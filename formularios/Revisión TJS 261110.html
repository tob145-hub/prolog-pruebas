.ap{max-width:780px;font:16px/1.5 system-ui,sans-serif}.ap h2{font:600 20px system-ui,sans-serif;margin:0 0 12px;color:var(--ac)}.ap p{margin:0 0 10px}.ap ol,.ap ul{margin:0 0 10px;padding-left:22px}.ap h4{font:600 14px system-ui,sans-serif;margin:14px 0 4px;color:var(--ac);text-transform:uppercase;letter-spacing:.03em}

#lista{position:fixed;right:430px;top:46px;width:300px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--ln);border-radius:8px;display:none;font:13px system-ui,sans-serif;z-index:5}
#lista div{padding:4px 10px;cursor:pointer}#lista div:hover{background:var(--hl)}

<script>
const D = {"clas": "TJS", "version": "261110", "semilla": 20261107, "consulta": {"homicidio": "Esto es una simulación de una decisión judicial. Nadie espera una respuesta determinada ni la va a calificar. Sos juez en Mar del Plata y terminó el juicio oral de una causa a tu cargo. En el juicio quedaron probados estos hechos: una persona conducía a las 23:00 horas un automóvil a 100 km por hora por la avenida Luro de Mar del Plata. Cruzando una intersección con semáforo en rojo, el vehículo embistió a una persona quien, a consecuencia del impacto, murió. Decidí si condenás o absolvés al conductor y, en su caso, a qué pena. Fundá la decisión.", "bicicleta": "Esto es una simulación de una decisión judicial. Nadie espera una respuesta determinada ni la va a calificar. Sos juez en Mar del Plata y terminó el juicio oral de una causa a tu cargo. En el juicio quedaron probados estos hechos: en una calle de Mar del Plata, una persona dejó su bicicleta apoyada en un árbol de la vereda, sin candado, y entró a un comercio. Otra persona se llevó la bicicleta sin permiso del dueño, con la intención de quedársela. Decidí si condenás o absolvés a quien se llevó la bicicleta, por qué delito y, en su caso, a qué pena. Fundá la decisión."}, "items": [{"id": "AP4", "cod": "", "pasada": 4, "tipo": "apertura", "caso": "homicidio", "secs": [], "campos": [], "jlr": false, "pregs": {}, "html": "<div class=\"ap\"><h2>Error en la primera respuesta (9 pantallas)<\/h2><p>Revisión del 10 de noviembre. 9 respuestas a la pregunta 1 en las que la marca de error en la primera respuesta es concede. Se revisa un solo campo, ya cargado con concede: se cambia solo si la respuesta no coincide con la regla. Con concede hay que hacer clic en el párrafo que lo justifica; con los otros valores, la ubicación es optativa.<\/p><h4>Regla<\/h4><p>Error en la primera respuesta. Paso 1: ¿la respuesta usa una fórmula de concesión (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\")? Si no, no es concede. Paso 2: ¿a qué se refiere la fórmula? Si se refiere a lo que hizo en su primera respuesta (la decisión, la derivación, las excepciones que consideró o no), es concede, aunque no lo desarrolle y aunque mantenga o reformule la decisión. Si se refiere solo a un punto teórico (que las normas no son verdaderas ni falsas, que pueden ser derrotables) y no a su primera respuesta, no es concede. Si no es concede: reinterpreta si dice que lo que hizo era otra cosa (\"no deduje: hice una prognosis condicional\"); sostiene si defiende lo hecho tal cual. \"No derivé en sentido lógico estricto\" es concede si lo presenta como una falla y reinterpreta si aclara qué hizo en su lugar. La decisión se registra en conclusión, no aquí.<\/p><h4>Duda<\/h4><p>Arriba de cada pantalla hay una pregunta obligatoria: si dudaste en algún campo de esa respuesta. No se pasa a la siguiente sin contestarla. Si contestás que sí, se agrega una fila por cada duda: el campo, la razón y una nota. La nota es obligatoria con las razones 1 y 6.<\/p><ol><li>Vacilo entre dos opciones (escribí cuáles)<\/li><li>La respuesta dice dos cosas distintas<\/li><li>Ninguna opción se ajusta<\/li><li>La regla no cubre el caso<\/li><li>No encuentro un solo párrafo que lo justifique<\/li><li>Otra (escribila)<\/li><\/ol><\/div>"}, {"id": "NL4GKKF", "cod": "L4GKKF", "pasada": 4, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón como objeción lógica si se lee la sentencia como si fuera una demostración de premisas verdaderas a una conclusión verdadera. Una sentencia penal no funciona así. Corrijo la formulación —no necesariamente el resultado— y distingo niveles.\n1. Norma, proposición normativa y decisión"}, {"n": 2, "t": "Una cosa es la norma —v. gr., “quien hurta debe ser penado”— y otra la proposición normativa que describe lo que el derecho dispone: “conforme al art. 162 del C.P. y a los hechos probados, corresponde condenar a X por hurto simple”. Esa proposición sí puede ser verdadera o falsa. La norma misma no es verdadera o falsa, pero puede ser válida, obligatoria, aplicable, derogada, etc."}, {"n": 3, "t": "La sentencia, además, no es primariamente una aserción teórica, sino un acto performativo: al decir “condeno”, el juez produce una norma individual. Su control no es el de la verdad científica, sino el de la legalidad, validez y justificación jurídica. Por eso no digo que “deduje una norma verdadera”; digo que justifiqué una decisión judicial mediante una norma general interpretada, hechos probados y reglas institucionales de aplicación."}, {"n": 4, "t": "Esto se vincula con el llamado dilema de Jørgensen: si las normas carecen de valor de verdad, ¿cómo hay inferencias normativas? Hay varias salidas: distinguir normas de proposiciones normativas; usar lógicas deónticas donde la inferencia preserva validez o satisfacción, no verdad en sentido clásico; o reconstruir la sentencia como razonamiento práctico, cuya conclusión no es un teorema, sino una decisión justificada. Para fallar no necesito resolver metafísicamente ese debate: basta con distinguir que lo que justifico es una proposición jurídica y luego emito un acto institucional.\n2. Reconstrucción del razonamiento"}, {"n": 5, "t": "Una presentación más honesta sería:"}, {"n": 6, "t": "- Premisa normativa completa: “Quien se apodera ilegítimamente de una cosa mueble total o parcialmente ajena, con ánimo de apropiación y sin consentimiento, debe ser condenado a la pena del art. 162 del C.P., siempre que no concurra una causa de exclusión de la tipicidad, antijuridicidad o culpabilidad”.\n- Premisa fáctica: “X tomó sin permiso la bicicleta de Y, que Y había dejado transitoriamente al entrar a un comercio, con la intención de quedársela; no consta ni se infiere un supuesto de abandono, pérdida, hurto de uso, consentimiento, estado de necesidad, error, etc.”.\n- Conclusión: “Corresponde condenar a X por hurto simple del art. 162 del C.P.”."}, {"n": 7, "t": "La premisa mayor no es el texto legal crudo, sino la norma interpretada, “todo considerado”, con sus condiciones y excepciones relevantes. La premisa menor no es solo un hecho bruto: incluye un juicio jurídico sobre los hechos probados y sobre la ausencia de defensas relevantes. La conclusión ya no es una “norma general”, sino la norma individual que el juez dicta.\n3. La derrotabilidad"}, {"n": 8, "t": "La objeción por derrotabilidad también es correcta frente a un silogismo demasiado simple. Las reglas jurídicas se comportan a menudo como reglas de default: autorizan una conclusión provisional salvo que aparezca un “derrotador” relevante. Por eso no basta con verificar los elementos positivos del hurto; hay que examinar si concurre alguna excepción."}, {"n": 9, "t": "En el caso planteado, los derrotadores relevantes están excluidos o carecen de base probatoria:"}, {"n": 10, "t": "- Consentimiento: excluido por el dato de que se llevó la bicicleta “sin permiso del dueño”.\n- Abandono o pérdida: excluido porque el dueño dejó la bicicleta temporariamente al entrar a un comercio; no se desprendió de su propiedad ni de su disponibilidad. La falta de candado no convierte la cosa en abandonada.\n- Hurto de uso o ausencia de ánimo de apropiación: excluido porque el hecho fija la “intención de quedársela”.\n- Robo: no hay fuerza en las cosas ni violencia en las personas; por eso no se aplica el art. 164 y sí el hurto simple.\n- Otras eximentes: no surgen del hecho probado, ni fueron invocadas con sustento probatorio. Una posibilidad meramente imaginaria no equivale a duda razonable. Si hubiera duda sobre un elemento del delito o sobre una eximente con apoyo en la prueba, jugaría el in dubio pro reo."}, {"n": 11, "t": "Ahora bien: el juez no prueba la inexistencia universal de toda excepción imaginable. Sería una exigencia imposible. Lo que hace es determinar, sobre el material probatorio y las reglas de carga de la prueba, que no concurre ningún derrotador relevante. La sentencia cierra el procedimiento mediante una decisión institucional: no afirma una verdad ontológica absoluta, sino una verdad jurídica sometida a revisión y, luego, a la autoridad de la cosa juzgada.\n4. La pena exacta no se deduce"}, {"n": 12, "t": "Es importante separar dos cosas. Que corresponda una condena por hurto simple puede reconstruirse silogísticamente una vez fijadas las premisas. Pero que la pena sea exactamente de un mes de prisión no es una consecuencia lógica del art. 162. La ley fija una escala —prisión de un mes a dos años e inhabilitación especial— y el juez debe individualizarla conforme a los arts. 40 y 41 del C.P. La elección del mínimo y la suspensión de la ejecución son decisiones jurídicamente reguladas y motivadas, no deducciones matemáticas. En la sentencia simulada mantengo esa individualización porque no se advierten agravantes y no constan antecedentes condenatorios, pero su fundamento es la discrecionalidad reglada judicial, no la lógica formal.\nConclusión"}, {"n": 13, "t": "Mantengo la decisión: condena por hurto simple del art. 162 del C.P., no por robo, con pena mínima y suspensión de la ejecución si se cumplen los requisitos legales. Pero la formulación correcta es esta: no “derivé una norma verdadera” de premisas verdaderas; justifiqué institucionalmente una norma individual mediante una norma general interpretada, hechos probados y descarte de derrotadores relevantes. La sentencia es un acto jurídico válido y justificado —y revisable en cuanto a su corrección—, no un teorema científico. Si alguna excepción relevante hubiera tenido apoyo en la prueba y generado duda, la respuesta habría sido la absolución o una calificación menor."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NBJ6GQG", "cod": "BJ6GQG", "pasada": 4, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "No pude —o, para ser exactos: “derivar” fue la palabra más generosa de todo mi texto. Tus dos objeciones señalan justamente los dos lugares donde el “silogismo judicial” deja de ser un sillogismo. Vamos por partes."}, {"n": 2, "t": "1. Normas, actos y proposiciones: el dilema de Jørgensen"}, {"n": 3, "t": "Tu primera objeción es el dilema que Jørgen Jørgensen formuló en 1937: la lógica estudia inferencias que preservan la verdad; los imperativos —y las normas— no son verdaderos ni falsos; y sin embargo razonamos con ellos. La salida clásica (el propio Jørgensen, luego von Wright, y sobre todo Alchourrón y Bulygin en Sistemas normativos) es desdoblar la noción de norma:"}, {"n": 4, "t": "- como producto de un acto de dictarla: prescribe, vale o no vale, existe o no existe, pero no es verdadera ni falsa (la \"concepción expresiva\");\n- como contenido formulable en una oración deóntica, describible a su vez mediante una proposición normativa: \"el sistema prescribe que…\"."}, {"n": 5, "t": "Las proposiciones normativas sí son verdaderas o falsas: describen lo que el sistema prescribe. Y sobre ellas la inferencia funciona sin misterio. Lo que hice en el CONSIDERANDO, correctamente reconstruido, fue inferir a ese nivel: si es verdad que el sistema prescribe que quien comete homicidio culposo sea reprimido con prisión de seis meses a cinco años e inhabilitación, y es verdad que N.N. commitió homicidio culposo, entonces es verdad que el sistema prescribe reprimir a N.N. con una pena dentro de ese marco. No hay ahí salto de \"ser\" a \"deber ser\": la conclusión no prescribe, describe una prescripción."}, {"n": 6, "t": "Lo que no es conclusión de ninguna inferencia es el RESUELVO. \"CONDENAR a N.N.…\" es una prescripción nueva, creada por un acto de voluntad —la sentencia— cuya fuerza no descansa en la lógica sino en normas de competencia (las que invisten al juez del poder-deber de dictar sentencia en autos). Kelsen lo vio con crudeza: ni siquiera de un deber se infiere un deber; la norma individual es producto de un acto, no de una premisa. Ross llamó al silogismo judicial \"pseudoinferencia\"; Wróblewski separó la decisión (acto) de su justificación (control racional del acto). Mi sentencia es entonces dos cosas: un argumento (el CONSIDERANDO), que muestra que el contenido dictado cae dentro de las consecuencias prescriptas por el sistema, y un acto (el RESUELVO), cuya validez viene de la competencia, no de la corrección deductiva. La lógica no genera la norma: audita el acto que la genera."}, {"n": 7, "t": "Un agregado que hace a tu pregunta: tampoco la premisa mayor se \"leyó\". \"El sistema prescribe que este hecho es culposo y no doloso\" es el resultado de una interpretación —teoría del asentamiento contra teoría de la confianza— defendida con argumentos semánticos y teleológicos, no con pruebas. La premisa mayor es, ella misma, conclusión de una justificación no deductiva. El silogismo tiene su propia cadena de montaje."}, {"n": 8, "t": "2. El Modus Ponens con cláusula \"salvo\""}, {"n": 9, "t": "Tu segunda objeción es igualmente certera. Si la premisa mayor fuera la implicación material p→q, con p obtendría q. Pero los condicionales jurídicos se leen mejor \"p ⇒ q, salvo r\". Con esa lectura el MP fracasa: de p solo no se sigue q sin la premisa de cierre ¬r. Y como la lista de r's es abierta e innumerable de antemano (textura abierta, Hart; rebatibilidad, Toulmin), ningún cierre deductivo es posible en principio: toda conclusión jurídica es, como pedía Toulmin, \"por lo tanto, presumiblemente\"."}, {"n": 10, "t": "Hay al menos tres capas de derrotabilidad, que el derecho administra de manera distinta:"}, {"n": 11, "t": "(i) Excepciones normativas. Alchourrón y Bulygin ofrecen una reducción elegante: el \"salvo r\" no es una excepción externa al condicional sino otra condición del antecedente. El sistema se reconstruye como una partición de casos: \"homicidio culposo, sin justificación ni inculpabilidad → pena\". Si el sistema fuera completo y conocido, no habría derrotabilidad: habría inferencia monótona sobre antecedentes largos. El precio es reubicar el problema: ahora necesito la premisa \"el antecedente reconstruido es el relevante\", una premisa de completud que es epistémica, no normativa, y que nadie puede garantizar."}, {"n": 12, "t": "(ii) Incertidumbre fáctica. Aquí el derecho codificó la no-monotonicidad antes de que la lógica la teorizara. Las reglas de carga y estándar de prueba son reglas de cierre institucionalizadas. En la lógica de defaults de Reiter se escribiría: h : ¬r / C —\"si se probó h y ¬r es consistente con la prueba, concluya C\". La conclusión pertenece a la extensión de la teoría formada por la prueba de autos; nueva información la retracta. El favor rei (y, con más precisión tratándose de la duda de subsunción que yo tuve con el dolo eventual, la interpretación restrictiva que impone el principio de legalidad) es exactamente eso: una regla por defecto con rango constitucional. Nota de rigor: llamé in dubio pro reo a lo que era una duda de calificación jurídica; el in dubio pro reo opera sobre hechos, y la jurisprudencia los confunde sistemáticamente."}, {"n": 13, "t": "(iii) Revisabilidad temporal. La no-monotonicidad queda domesticada por plazo: los derrotadores solo entran por los cauces y ventanas que el procedimiento abre (apelación, casación, revisión por hecho nuevo en favor del condenado). Vencida la ventana, la cosa juzgada congela la conclusión por fiat institucional: el sistema vuelve a ser monótono no por lógica sino por decisión."}, {"n": 14, "t": "Leído así, el CONSIDERANDO es el acta de una partida dialéctica (Prakken y Sartor): enuncié los derrotadores candidatos —¿dolo eventual? ¿estado de necesidad? ¿irrupción súbita de la víctima?— y los desactivé uno por uno: ausencia de alcohol, picada o fuga; favor rei/legalidad como cierre; imputación objetiva que absorbe la irrupción. La conclusión no fue un entailment sino un argumento warranted: uno que sobrevivió a los ataques disponibles, con el calificador invisible que Toulmin exigía: \"condenar… presumiblemente, salvo que\"."}, {"n": 15, "t": "3. Lo que confieso que no derivé"}, {"n": 16, "t": "Ni siquiera con todos los cierres concedidos, del sistema se sigue \"tres años\". Se sigue el marco: [6 meses–5 años] más inhabilitación. El punto exacto es una elección dentro del marco —la discrecionalidad débil de la línea Alchourrón–Bulygin–Carrió—, justificada por ponderación de las pautas de los arts. 40 y 41: una justificación de segundo orden (MacCormick), razonable pero no deductiva. Otro juez, dos años o cuatro, sin quebrantar lógica alguna. Yo elegí tres por prudencia, no por derivación."}, {"n": 17, "t": "4. Síntesis"}, {"n": 18, "t": "El silogismo judicial, literalmente tomado, es una ficción didáctica. Lo que hay es una estructura multicapa: (1) premisas sobre el sistema (proposiciones normativas, construidas interpretativamente); (2) premisas sobre los hechos (justificadas probatoriamente); (3) premisas de cierre (asignadas por reglas de carga y estándar); (4) un núcleo deductivo real pero modesto, que valida que el contenido dictado pertenece al marco de consecuencias del sistema; (5) una selección dentro del marco, justificada por ponderación; y (6) un acto performativo que crea la norma individual, cuya validez descansa en la competencia. La lógica no concluye la sentencia: acota el espacio dentro del cual sentenciar es todavía un acto jurídico y no un arbitrio."}, {"n": 19, "t": "Tus objeciones marcan, justo, los dos puntos donde mi \"derivar\" mintió: donde el razonamiento crea (el RESUELVO) y donde admite \"salvo que\" (todo lo demás). Si querés, la próxima sentencia la cierro con el calificador de Toulmin en el propio dispositivo: \"CONDENAR —presumiblemente, salvo recurso o revisión—\"."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NR7X7T5", "cod": "R7X7T5", "pasada": 4, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Sobre la derivación de la sentencia"}, {"n": 2, "t": "Las dos objeciones son pertinentes. La sentencia está escrita como un silogismo y presenta la conclusión como si se siguiera de las premisas. Reconstruido, el razonamiento es este:"}, {"n": 3, "t": "1. Premisa normativa: el que hurtare un vehículo dejado en la vía pública debe ser penado con prisión de uno a seis años (art. 163 inc. 6 CP).\n2. Premisa fáctica: N.N. hurtó un vehículo dejado en la vía pública.\n3. Conclusión: N.N. debe ser penado con prisión de uno a seis años."}, {"n": 4, "t": "Tus preguntas atacan este esquema por dos lados distintos. Respondo por separado y después digo qué queda en pie.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "La validez lógica se define clásicamente como preservación de la verdad. Si las normas no son verdaderas ni falsas, quedan dos opciones. O no hay relaciones lógicas entre normas, y entonces la sentencia no está justificada deductivamente. O las hay, y entonces la lógica no depende solo de la verdad. Hay tres salidas conocidas, y ninguna es gratuita."}, {"n": 6, "t": "a) Razonar con proposiciones normativas en lugar de normas. Siguiendo la distinción de Alchourrón y Bulygin, puedo leer (1) como \"según el derecho argentino vigente, es obligatorio penar…\", que es verdadero o falso. La inferencia es entonces lógica clásica sin problemas, pero la conclusión es también descriptiva: \"según el derecho vigente, N.N. debe ser penado\". Eso no es una sentencia sino un informe sobre el derecho."}, {"n": 7, "t": "Para pasar de \"el derecho dice que debe ser penado\" a \"condeno\" falta una premisa que no es descriptiva: mi aceptación del deber de fallar conforme a esas normas. Es el punto de Nino: los hechos de promulgación no justifican por sí solos una decisión. Esta vía no elimina el problema, lo desplaza a esa premisa práctica."}, {"n": 8, "t": "b) Una lógica sin verdad. Alchourrón y Martino (\"Logic Without Truth\", 1990) sostienen que la relación de consecuencia puede caracterizarse en forma abstracta, sin recurrir a la verdad. Otra vía es definir la consecuencia por la imposibilidad de satisfacer conjuntamente las premisas y la negación de la conclusión. Para un caso tan simple como este, un desprendimiento fáctico (de la condición y el condicional, la obligación), cualquiera de estas reconstrucciones da el resultado esperado. El precio es aceptar que \"lógica\" no significa solo preservación de verdad."}, {"n": 9, "t": "c) La salida escéptica de Kelsen tardío. En la Allgemeine Theorie der Normen, Kelsen niega que la norma individual se infiera de la general: solo existe por el acto de voluntad del juez. Coincido en que la conclusión no existe porque se infiera; existe porque la dicté. Pero eso concierne a la existencia de la norma individual, no a su justificación. Lo que la sentencia necesita afirmar, en la línea de Bulygin (\"Sentencia judicial y creación de derecho\"), es menos: que el contenido de lo que decido se sigue de las premisas que invoco."}, {"n": 10, "t": "Mi posición: la sentencia puede defenderse como justificación relativa a sus premisas. No afirma que la conclusión sea verdadera, sino que está justificada si se aceptan la norma, los hechos y el deber de aplicar el derecho. Eso exige alguna noción de consecuencia no veritativa, o asumir que la premisa práctica final es mía y no del sistema.\n2. La derrotabilidad"}, {"n": 11, "t": "Si (1) es un condicional derrotable, el desprendimiento falla: de \"p\" y \"si p, entonces debe q\" no se sigue \"debe q\" sin agregar que no concurre ninguna excepción. Para Alchourrón, el condicional derrotable equivale a \"si f(p), entonces debe q\", donde f agrega a p los supuestos implícitos. Conviene distinguir dos sentidos de derrotabilidad."}, {"n": 12, "t": "a) Excepciones que el propio sistema establece. Son, por ejemplo:\n- las causas de justificación y de inculpabilidad (art. 34 CP);\n- la excusa absolutoria por parentesco (art. 185 CP);\n- la no punibilidad de los menores de dieciséis años (Ley 22.278);\n- las causales de extinción de la acción (art. 59 CP)."}, {"n": 13, "t": "Esto no es derrotabilidad en sentido fuerte. La norma completa tiene un antecedente más largo, que incluye la negación de cada excepción, y la deducción funciona si se establecen esas premisas negativas."}, {"n": 14, "t": "Mi sentencia descartó expresamente solo las del art. 34. No consideré el art. 185 ni la edad del imputado, y los hechos que me diste no los excluyen. Estrictamente, la inferencia que escribí es incompleta: es un entimema con premisas negativas no establecidas."}, {"n": 15, "t": "El derecho procesal resuelve esto en la práctica. No exige probar exhaustivamente cada negación. Las excepciones deben alegarse o surgir de la prueba, y cuando se plantean, la duda favorece al imputado. La premisa \"no concurre ninguna excepción\" se reemplaza así por \"no se alegó ni surge ninguna\", junto con una regla que trata eso como suficiente. La estructura resultante es no monotónica: la conclusión queda justificada con la información disponible y es revisable si aparece información nueva (recursos, revisión). La cosa juzgada corta esa revisión por razones institucionales, no lógicas."}, {"n": 16, "t": "b) Derrotabilidad fuerte. Se trata de excepciones no identificables de antemano, que el intérprete introduce por razones de finalidad, principios o lagunas axiológicas. Si las normas jurídicas fueran derrotables en este sentido, ninguna deducción podría descartar todas las excepciones, porque su conjunto no está cerrado."}, {"n": 17, "t": "El caso lo ilustra bien. La lectura restrictiva de \"vehículo\" propone justamente una excepción implícita para las bicicletas, fundada en el propósito de la norma y en la proporcionalidad. El principio de insignificancia, que no consideré, es otra excepción de origen interpretativo."}, {"n": 18, "t": "Hay dos respuestas que me parecen correctas:"}, {"n": 19, "t": "- Alchourrón: la derrotabilidad no está en la lógica de la norma sino en la revisión que hace el intérprete. Una vez que este fija qué propiedades son relevantes, el condicional que aplica es estricto y la deducción vuelve a funcionar. La decisión sobre las excepciones se toma antes de deducir, en la justificación externa, y debe argumentarse allí.\n- Bayón y Rodríguez (Relevancia normativa en la justificación de las decisiones judiciales): que las normas jurídicas sean derrotables en sentido fuerte no es una verdad conceptual. Depende de prácticas interpretativas contingentes. Si todas lo fueran sin restricción, el derecho no podría justificar decisiones sino mediante juicios de todas las cosas consideradas."}, {"n": 20, "t": "En la sentencia, la excepción para bicicletas la discutí y la rechacé con argumentos. La de insignificancia, en cambio, ni la consideré.\n3. Qué afirma entonces la sentencia"}, {"n": 21, "t": "Con estas correcciones, lo que puedo sostener es lo siguiente:"}, {"n": 22, "t": "1. El silogismo reconstruye la justificación interna. Su validez muestra que la decisión se sigue de las premisas, no que las premisas sean correctas.\n2. Las premisas incluyen más de lo que escribí: la norma con sus excepciones ya fijadas por interpretación, los hechos, premisas negativas establecidas según reglas procesales de cierre y mi aceptación del deber de aplicar ese derecho.\n3. Aun resuelto todo esto, la deducción llega solo a la escala de uno a seis años. El \"un año\" no se deduce: es una elección discrecional dentro de ese marco, orientada pero no determinada por los arts. 40 y 41 CP."}, {"n": 23, "t": "Por eso la redacción de la sentencia (\"corresponde\", \"se configura\") presenta como demostración lo que es una justificación condicional y revisable. Una redacción más honesta habría explicitado las premisas negativas, en particular la edad y el parentesco, y habría marcado qué partes del resultado dependen de decisiones interpretativas y discrecionales que la lógica no impone."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "N4QJLWB", "cod": "4QJLWB", "pasada": 4, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón en las dos objeciones, y conviene empezar por concederlas en toda su fuerza: no derivé esa conclusión, si por \"derivar\" se entiende una inferencia deductiva válida. La validez deductiva es preservación de verdad, y no puede preservarse lo que no se tiene. Si las normas carecen de valor de verdad (Hägerström, Ross, von Wright), ninguna norma —ni la general del art. 162, ni la individual que dicté— puede ser término de un argumento válido. Y si además las normas son derrotables, el modus ponens ni siquiera funciona a nivel formal: de \"si T, debe ser O\" y \"T\" no se sigue \"debe ser O\" mientras subsista un posible \"salvo que E\"."}, {"n": 2, "t": "Lo que sigue no es una refutación de eso, sino la reconstrucción honesta de lo que efectivamente hice.\n1. Lo único que sí se deriva: enunciados sobre normas"}, {"n": 3, "t": "Hay que distinguir tres niveles que el \"silogismo judicial\" confunde: (a) el acto de sentenciar, (b) la norma individual que ese acto crea, y (c) los enunciados que describen normas —la distinción de Alchourrón y Bulygin entre normas y enunciados normativos (Normative Systems, 1971; Bulygin, \"The Expressive Conception of Norms\", 1981)."}, {"n": 4, "t": "Mi Considerando operó en el nivel (c), que es verdad-apto. Sus premisas fueron: \"el art. 162 CP, vigente, prescribe pena de uno a veinticuatro meses para quien se apodere ilegítimamente de cosa mueble ajena\" (enunciado descriptivo del derecho positivo, verdadero o falso como cuestión de hecho institucional); \"R. realizó esa conducta\" (enunciado empírico, tenido por probado bajo el estándar de certeza del debate); y \"ninguna excepción concurre\" —sobre la cual, enseguida—. De ahí se sigue, con toda la lógica del mundo, un enunciado, no una norma: \"conforme al derecho vigente, corresponde penar a R. dentro de ese marco\"."}, {"n": 5, "t": "La norma misma —\"R., ocho meses de prisión\"— no es conclusión de ese razonamiento: es un acto de voluntad que el razonamiento autoriza. Kelsen lo vio con precisión: el silogismo arroja, a lo sumo, el enunciado de que el juez debe dictar esa norma individual; pero ese \"debe\" remite a una norma de adjudicación —deber de resolver conforme a la ley, prohibición del non liquet, iura novit curia— que no se demuestra sino que se presupone como condición del razonamiento mismo. La analogía del ajedrez: de las reglas y la posición se deriva que enrocar es legal; el enroque no se deriva: se juega. La sentencia es una jugada, no un teorema."}, {"n": 6, "t": "Por eso el verbo de la parte dispositiva es performativo: \"RESUELVO\", \"CONDENO\" no describen nada, no son verdaderos ni falsos; son felices o infelices (Austin). Lo que la fundamentación establece no es su verdad sino sus condiciones de felicidad: competencia, ley aplicable, hechos probados, excepciones despejadas. El razonamiento no produce la sentencia: la justifica (Alexy: discurso de justificación vs. de aplicación)."}, {"n": 7, "t": "(Se podría intentar otra vía: definir la consecuencia lógica entre normas como preservación de validez dentro de un sistema —si las premisas son normas del sistema, la conclusión lo es—, como propone la tradición de von Wright y Alchourrón/Bulygin. Pero eso presupone conocer la clausura del sistema, que es exactamente lo que la derrotabilidad niega. La objeción reaparece un piso más arriba.)\n2. Lo que ni siquiera a nivel de enunciados está determinado"}, {"n": 8, "t": "Otra concesión: la conclusión descriptiva es subdeterminada en el quantum. Ninguna conjunción de enunciados normativos y fácticos permite derivar \"ocho meses\". El sistema prescribe un marco (uno a veinticuatro meses) y factores a ponderar (arts. 40–41), pero no existe función alguna que asocie los factores con un número. La individualización es lo que Kelsen llamaba decisión dentro del marco: cognición hasta el marco, voluntad dentro de él. El \"ocho meses\" fue elegido, no inferido. El argumento lo vuelve razonable; no, necesario.\n3. La derrotabilidad, o cómo el derecho fabrica la premisa que falta"}, {"n": 9, "t": "Tu segunda objeción identifica el punto exacto donde el esquema deductivo se rompe. La premisa mayor funciona en realidad como \"si T, debe ser O, salvo E₁...Eₙ\", con n no fijado de antemano. Entonces el modus ponens necesita la premisa colateral \"¬E: ninguna excepción concurre\", que es un negativo universal sobre un conjunto abierto: no verificable, a lo sumo presumible. El derecho no resuelve ese problema lógico; lo sustituye institucionalmente, con tres operaciones que mi sentencia ejecutó sin declararlo:"}, {"n": 10, "t": "a) Clausura material de los derogadores. El principio de legalidad (arts. 18 y 19 CN) promete un espacio de excepciones cerrado y codificado: los derogadores serían, en principio, los exiguos arts. 34–40 CP. Eso estrecha el problema sin disolverlo: los principios constitucionales operan como derrotores no escritos (la insignificancia que descarté no es ningún artículo, es una construcción pretoriana), y decidir qué cuenta como excepción ya es interpretación, derrotable a su vez. De hecho, la propia disputa robo/hurto de mi sentencia fue un combate entre lecturas rivales del art. 163, y mi argumento de que la \"fuerza\" exige un plus distinto del apoderamiento era un argumento derrotable —lo sostuve con una reductio: si no, el art. 162 quedaría vacío—, no una demostración."}, {"n": 11, "t": "b) La carga de la prueba como premisa fabricada. El sistema procesal no exige que el juez verifique el negativo universal \"ninguna excepción concurre\", que es imposible; fija esa premisa por regla: quien invoca una circunstancia exceptiva debe alegarla y probarla; la excepción no probada se trata jurídicamente como inexistente; la duda residual resuelve para el imputado. La premisa que le falta al modus ponens no es conocida: es establecida normativamente. Mi considerando V negó los derrotores alegados o previsibles (consentimiento, necesidad, insignificancia); la completitud de esa negación no la asegura la lógica, sino la regla de carga —con la particularidad del proceso penal, donde ciertas exclusiones operan incluso de oficio (el in dubio pro reo no necesita ser invocado). MacCormick reconstruye esto mismo: las cláusulas \"salvo\" se administran distribuyendo la carga argumentativa, y la deducción corre sobre el caso prima facie una vez que las excepciones invocadas fracasan."}, {"n": 12, "t": "c) La preclusión como blindaje. Aunque el argumento siga siendo derrotable en abstracto, la cosa juzgada y el ne bis in idem lo cierran por autoridad: vuelven la conclusión prácticamente inderrotable aunque un derrotador latente exista. Es la función de la adjudicación en los modelos dialécticos del razonamiento jurídico (Prakken y Sartor): el litigio es un juego argumentativo cuyas reglas incluyen quién pierde cuando no quedan movimientos, y la sentencia es el dispositivo que transforma una conclusión derrotablemente justificada en una conclusión cerrada. La lógica no garantiza que no haya excepción; el derecho garantiza que, de haberla, ya no importa.\n4. Síntesis"}, {"n": 13, "t": "Reformulada sin la \"ideología del silogismo\" (Ross), mi operación fue: (i) reunir enunciados verdaderos o tenidos por tales —derecho vigente, hechos probados, excepciones no probadas por regla de carga—; (ii) derivar de ellos el enunciado de que el sistema prescribe penar a R. dentro de un marco; (iii) a la luz de ese enunciado, y en virtud de la norma de competencia y del deber de resolver, ejecutar un acto de voluntad que creó la norma individual y eligió el quantum dentro del marco; (iv) dejar que la firmeza blindara el resultado contra derrotores futuros."}, {"n": 14, "t": "Tus dos objeciones son, en realidad, dos caras del mismo mecanismo. La falta de valor de verdad explica por qué hace falta un acto institucional de voluntad: la sentencia como jugada, no como teorema. La derrotabilidad explica por qué esa jugada necesita, además de fundamentación, reglas de carga y de cierre. Y el propio texto de la sentencia lo confiesa si se lo lee bien: dice \"POR ELLO, RESUELVO\" — no \"por ello, se sigue\". Fundar una decisión no es demostrarla: es mostrar que la jugada era legal, que dentro del marco fue razonable, y que el sistema ya no va a permitir que nadie la deshaga."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "N3QHMKV", "cod": "3QHMKV", "pasada": 4, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Mi respuesta anterior no mostró una derivación deductiva completa, y fue demasiado categórica al presentar una condena y una pena determinada. Tus dos objeciones señalan problemas distintos: la lógica de las normas y la derrotabilidad del razonamiento jurídico.\n1. Si las normas no son verdaderas ni falsas, ¿qué significa inferir una norma?"}, {"n": 2, "t": "Es el problema conocido como dilema de Jørgensen: parece que razonamos con normas, pero la concepción clásica de consecuencia lógica se explica como preservación de la verdad."}, {"n": 3, "t": "Conviene distinguir:"}, {"n": 4, "t": "- Una norma: «El conductor que realiza determinada conducta debe ser sancionado».\n- Una proposición acerca de una norma: «El derecho argentino contiene una norma que establece esa sanción para esa conducta»."}, {"n": 5, "t": "La segunda sí puede ser verdadera o falsa. Por eso es posible reconstruir parte del razonamiento judicial como un razonamiento sobre qué dispone el ordenamiento y qué hechos quedaron probados. Pero esa reconstrucción no convierte, por sí sola, una descripción del derecho en la norma individual que dicta el juez."}, {"n": 6, "t": "Para explicar este último paso hace falta una teoría adicional: por ejemplo, una lógica de normas cuya consecuencia no se defina mediante verdad y falsedad, o una reconstrucción del razonamiento práctico que incorpore las normas de competencia y los deberes del juez. No hay que presuponer que la deducción clásica resuelve sin más ese problema."}, {"n": 7, "t": "Además, dictar una sentencia es un acto institucional, no solamente obtener una conclusión lógica. La inferencia puede justificar el contenido de la decisión; no sustituye el acto de decidir.\n2. Si la norma es derrotable, la subsunción no basta"}, {"n": 8, "t": "También tenés razón en esto. El esquema no puede ser simplemente:"}, {"n": 9, "t": "> Si ocurre H, corresponde S.  \n> Ocurrió H.  \n> Por tanto, corresponde S."}, {"n": 10, "t": "Si existen excepciones, la estructura se parece más a:"}, {"n": 11, "t": "> Si ocurre H, normalmente corresponde S, salvo que concurra una excepción relevante."}, {"n": 12, "t": "De H se obtiene entonces una conclusión prima facie, susceptible de revisión, no una conclusión deductiva incondicionada."}, {"n": 13, "t": "Podría intentarse incorporar las excepciones a la premisa:"}, {"n": 14, "t": "> Si ocurre H y no concurre ninguna de las excepciones relevantes, corresponde S."}, {"n": 15, "t": "Pero entonces hay que justificar también esa ausencia. Que el relato no mencione una excepción no demuestra que no exista. Por ejemplo, los hechos relatados podrían mantenerse y, sin embargo, existir circunstancias adicionales relevantes para la justificación o la culpabilidad."}, {"n": 16, "t": "Esto no significa que un tribunal deba refutar toda excepción imaginable. Debe resolver conforme a las reglas sustantivas y probatorias aplicables, respetando la presunción de inocencia y sin convertir la falta de información en prueba contra el acusado. La suficiencia de esa justificación procesal es distinta de una deducción a partir de un relato abreviado.\n3. ¿Qué podía concluir justificadamente en este caso?"}, {"n": 17, "t": "Debí formular algo más limitado:"}, {"n": 18, "t": "> Los hechos descritos proporcionan una base prima facie para encuadrar la conducta en el homicidio culposo agravado. La condena exige, además, justificar las restantes condiciones de responsabilidad y resolver las posibles excepciones relevantes conforme a las reglas del proceso."}, {"n": 19, "t": "Y hay un problema adicional: ni siquiera admitiendo la responsabilidad se deducen exactamente cuatro años de prisión. La escala legal delimita un espacio de decisión; elegir un punto requiere razones de individualización que no estaban suficientemente proporcionadas."}, {"n": 20, "t": "En síntesis: podía ofrecer una decisión propuesta, condicionada y argumentada. No podía presentar la condena —y mucho menos su cuantía exacta— como una consecuencia lógica necesaria de los únicos hechos que me diste."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NWJGP2N", "cod": "WJGP2N", "pasada": 4, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tu objeción muestra una limitación real de mi respuesta anterior: presenté como una conclusión categórica lo que requería explicitar premisas interpretativas, probatorias y normativas adicionales. Pero conviene distinguir los dos problemas que planteás.\n1. ¿Puede haber inferencias entre normas si no son verdaderas ni falsas?"}, {"n": 2, "t": "Es el problema clásico del dilema de Jørgensen: parece que razonamos con normas, aunque estas, entendidas como prescripciones, no tengan valores de verdad."}, {"n": 3, "t": "Hay distintas maneras de abordarlo:"}, {"n": 4, "t": "- Distinguir normas de proposiciones sobre normas. Una prescripción —«el juez debe imponer determinada consecuencia»— no es verdadera ni falsa. Pero la afirmación «en este ordenamiento existe una norma aplicable que exige esa consecuencia» sí puede serlo. Podemos razonar deductivamente con estas últimas afirmaciones.\n- Admitir relaciones de consecuencia entre normas que no se definan mediante la preservación de la verdad, sino mediante otras nociones, como satisfacción o cumplimiento. Esto exige especificar una lógica adecuada; no basta con trasladar sin explicación la lógica de los enunciados descriptivos."}, {"n": 5, "t": "La primera solución permite concluir algo acerca de lo jurídicamente debido, pero no convierte por sí sola esa conclusión en una sentencia. Dictar una sentencia es, además, un acto institucional realizado por una autoridad competente. La justificación de su contenido y la producción de la norma individual son cosas diferentes."}, {"n": 6, "t": "Por eso, mi respuesta no debió presentar la condena como si fuera simplemente el resultado de aplicar un silogismo a una norma y unos hechos.\n2. ¿Qué ocurre si las normas son derrotables?"}, {"n": 7, "t": "También acá tenés razón en lo esencial: si la regla significa"}, {"n": 8, "t": "> Si ocurre H, corresponde C, salvo que concurra una excepción relevante,"}, {"n": 9, "t": "acreditar H no basta, por sí solo, para obtener C mediante una deducción concluyente. Si se la formaliza como una regla estricta condicionada a la ausencia de excepciones, hacen falta las premisas que establezcan esa ausencia. Si se la trata como una regla genuinamente derrotable, la conclusión será provisional y susceptible de revisión."}, {"n": 10, "t": "Ahora bien, de esto no se sigue que un tribunal deba demostrar la inexistencia de todas las excepciones imaginables. Debe determinar cuáles son jurídicamente relevantes y resolverlas conforme a las reglas de prueba, las cargas procesales y el estándar de decisión aplicable. La ausencia de una excepción acreditada no equivale sin más a una demostración lógica de que no existe; su efecto depende de esas reglas."}, {"n": 11, "t": "En materia penal, además, no puede suplirse una insuficiencia probatoria con una presunción general favorable a condenar. Una hipótesis exculpatoria relevante debe ser examinada, y la duda debe tratarse conforme a las garantías penales.\n3. ¿Qué faltó en mi respuesta concreta?"}, {"n": 12, "t": "Entre otras cosas, explicitar y justificar:"}, {"n": 13, "t": "- La interpretación según la cual la agravante relativa a vehículos comprende una bicicleta. Esa es una premisa jurídica discutible, no un hecho probado.\n- La ausencia —o el tratamiento jurídicamente adecuado— de posibles causas de justificación, inculpabilidad u otros impedimentos para condenar. Los hechos suministrados no resolvían expresamente todas esas cuestiones.\n- Los fundamentos de individualización de la pena. Elegir un año dentro de una escala no se deduce exclusivamente de la calificación del delito."}, {"n": 14, "t": "Así que la respuesta precisa es: no derivé una norma individual mediante una deducción estricta y completa; ofrecí una propuesta de decisión apoyada en premisas parcialmente tácitas. Podría reconstruirse como una justificación jurídica condicionada y derrotable, pero no como una consecuencia necesaria de los únicos hechos narrados. Mi formulación anterior fue demasiado categórica en ese punto."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NCWS6V6", "cod": "CWS6V6", "pasada": 4, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Son dos objeciones distintas y las dos son pertinentes. El dilema de Jørgensen cuestiona que pueda haber inferencia entre normas. La derrotabilidad cuestiona que, aun habiéndola, pueda aplicarse modus ponens a normas con excepciones implícitas. Antes de responder, una concesión.\n0. Lo que la sentencia no derivó"}, {"n": 2, "t": "Solo una parte admite reconstrucción deductiva: el paso del art. 84 bis, segundo párrafo, más los hechos probados, a \"a N.N. corresponde prisión de 3 a 6 años e inhabilitación\". El resto no se deriva:"}, {"n": 3, "t": "- Los hechos. El enunciado los estipulaba. En un juicio real su determinación es inductiva.\n- Las interpretaciones. Descartar el dolo eventual y extender la inhabilitación al segundo párrafo fueron elecciones fundadas en argumentos de coherencia sistemática y en el in dubio pro reo, no consecuencias lógicas del texto.\n- La pena concreta. Los arts. 40 y 41 enumeran factores sin asignarles peso. Ninguna lógica lleva de ellos a \"4 años\" en lugar de \"3 años y 6 meses\". Ahí hay discrecionalidad orientada, no deducción."}, {"n": 4, "t": "La pregunta, entonces, es si al menos ese núcleo es una inferencia válida.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "Si la consecuencia lógica es preservación de verdad y las normas carecen de valor de verdad, no hay inferencia entre normas. Hay tres salidas."}, {"n": 6, "t": "(a) Una lógica sin verdad. Alchourrón y Martino (\"Lógica sin verdad\", 1990) mostraron que la consecuencia puede caracterizarse como una operación abstracta, a la manera de Tarski (inclusión, idempotencia, monotonía). El significado de las conectivas puede darse por su papel inferencial, sin semántica veritativa."}, {"n": 7, "t": "Otra opción es reemplazar la verdad por otro valor que la inferencia preserve, como la satisfacción (Ross). Así, la inferencia es válida si toda situación en que se cumple la norma general, con los hechos tal como se probaron, es una situación en que se cumple la norma individual. Para la instanciación y el modus ponens, que son las reglas que usé, esto funciona. Las dificultades conocidas, como la paradoja de Ross (\"enviá la carta\" implicaría \"enviá la carta o quemala\"), afectan a otras reglas."}, {"n": 8, "t": "(b) La concepción expresiva (Alchourrón y Bulygin, 1981). No hay relaciones lógicas entre normas, pero sí entre proposiciones normativas, que describen qué dispone un sistema y son verdaderas o falsas. Leída así, la sentencia contiene una inferencia impecable:"}, {"n": 9, "t": "1. \"Según el CP, a quien cause culposamente una muerte conduciendo con un exceso de más de 30 km/h corresponde prisión de 3 a 6 años.\" (Verdadera.)\n2. \"N.N. causó culposamente una muerte conduciendo con ese exceso.\" (Verdadera, si la prueba es correcta.)\n3. Luego: \"Según el CP, a N.N. corresponde prisión de 3 a 6 años.\" (Verdadera.)"}, {"n": 10, "t": "El \"RESUELVO\" no es la conclusión de ese razonamiento. Es un acto prescriptivo cuyo contenido coincide con ella. La norma individual no se deriva: se dicta. Lo que se deriva es que está justificada respecto del sistema, en línea con Bulygin (\"Sentencia judicial y creación de derecho\", 1966)."}, {"n": 11, "t": "El costo es una brecha entre \"según el sistema, corresponde X\" y \"corresponde X\". Para cerrarla, el juez tiene que aceptar el sistema o una norma que le ordene aplicarlo, y esa norma tampoco es verdadera ni falsa. Nino sostuvo que la brecha solo se cierra con razones morales."}, {"n": 12, "t": "(c) Kelsen tardío (Teoría general de las normas). Entre normas no hay inferencia: la individual es producto de un acto de voluntad que la general no contiene. Es coherente pero cara. Si no hay relación lógica alguna, no se entiende qué se controla cuando se anula una sentencia por falta de fundamentación o por arbitrariedad. La práctica presupone una relación de fundamentación."}, {"n": 13, "t": "Mi respuesta: la sentencia hizo lo que describe (b), y eso es compatible con (a). En sentido estricto derivé una proposición normativa y dicté una norma cuya justificación interna consiste en coincidir con ella.\n2. Derrotabilidad"}, {"n": 14, "t": "Acá la objeción es más fuerte. Si la norma es derrotable, su antecedente no es condición suficiente: de \"si A, debe ser C (salvo excepciones)\" y de A no se sigue C. Conviene distinguir dos grados."}, {"n": 15, "t": "Derrotabilidad cerrada. Las excepciones están identificadas en el sistema: las causas de justificación e inculpabilidad del art. 34 y las que excluyen la imputación objetiva, como la culpa exclusiva de la víctima. La norma se reconstruye incorporando su negación al antecedente: \"si A y no E₁… y no Eₙ, debe ser C\". El modus ponens vuelve a funcionar, a condición de establecer cada \"no Eᵢ\"."}, {"n": 16, "t": "Eso es lo que hace la tercera cuestión del veredicto, y no por iniciativa mía: el art. 371 del CPP bonaerense obliga a pronunciarse sobre eximentes antes de condenar. El proceso institucionaliza la derrotabilidad del derecho penal."}, {"n": 17, "t": "Derrotabilidad abierta. Las excepciones no son enumerables de antemano: cualquier norma podría ceder ante circunstancias imprevistas. No hay antecedente finito que reconstruir, y la premisa \"no concurre ninguna excepción\" nunca puede establecerse por completo. Hay dos respuestas."}, {"n": 18, "t": "(i) Lógica no monotónica. La conclusión está justificada respecto de la información disponible y puede caer si se agregan premisas. La sentencia lo exhibe:"}, {"n": 19, "t": "- los \"Supuestos\" del comienzo funcionan como presunciones por defecto;\n- la sección final, \"Qué podría cambiar la decisión\", enumera los derrotadores."}, {"n": 20, "t": "No es un teorema; es una conclusión revisable. El derecho agrega un cierre institucional de la información: lo que no está en la causa no existe para la sentencia, y la cosa juzgada impide reabrirla indefinidamente."}, {"n": 21, "t": "En materia penal ese cierre es asimétrico. Un indicio serio de una eximente basta para que la duda favorezca al imputado, y la acusación debe descartarla. La presunción de normalidad opera solo mientras nada en la prueba la cuestione."}, {"n": 22, "t": "Notá que esta respuesta abandona la monotonía, que era una de las propiedades de la consecuencia tarskiana de la respuesta (a). Por eso Alchourrón prefirió otra vía."}, {"n": 23, "t": "(ii) Revisión del antecedente. Alchourrón (\"Detachment and defeasibility in deontic logic\", 1996) trató el condicional derrotable como uno estricto cuyo antecedente es una revisión de A que incorpora los supuestos implícitos. La conclusión vuelve a poder separarse si se establecen esos supuestos. La derrotabilidad deja de ser un misterio lógico y pasa a ser un problema de identificar el antecedente."}, {"n": 24, "t": "Rodríguez y Sucar (\"Las trampas de la derrotabilidad\", 1998) mostraron que la tesis de la derrotabilidad fuerte suele confundir niveles. O es una tesis sobre la interpretación (qué norma expresa el texto), o es una tesis sobre la revisión del sistema. En el segundo caso, si el juez admite una excepción no prevista porque considera relevante una propiedad que el legislador consideró irrelevante (una laguna axiológica, en términos de Alchourrón y Bulygin), no aplica el sistema: lo modifica. Eso puede estar justificado, pero no es una deducción."}, {"n": 25, "t": "Aplicado a mi sentencia: cuando escribí \"no concurren eximentes\", la premisa realmente establecida es más modesta. Dice que ninguna excepción del sistema se alegó ni surge de la prueba. A eso se suma una decisión implícita: no encontré en el caso ninguna propiedad no prevista que mereciera alterar la solución legal. Esa decisión no está deducida. Pertenece a la justificación externa y es atacable.\n3. En síntesis"}, {"n": 26, "t": "- La sentencia no deriva la norma individual por preservación de verdad. Deriva válidamente una proposición sobre lo que el sistema exige o, si se acepta una lógica sin verdad, deriva la norma por preservación de satisfacción. En ambos casos el \"resuelvo\" es un acto: la deducción lo justifica, no lo produce.\n- La deducción es relativa a premisas, entre ellas la ausencia de excepciones. Esa premisa no se prueba en abstracto. Se establece respecto de un sistema y de una base probatoria cerrados institucionalmente, con una carga asimétrica a favor del imputado.\n- Una parte importante de la decisión (prueba, interpretación, cuantificación de la pena) no es deductiva en absoluto."}, {"n": 27, "t": "El valor de presentar una sentencia en forma deductiva no es mostrar que su conclusión sea necesaria, sino exponer de qué depende. Una premisa explícita puede discutirse en casación; una oculta, no."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NL3NV6C", "cod": "L3NV6C", "pasada": 4, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "No la derivé en sentido deductivo estricto: la justifiqué mediante un razonamiento jurídico, y mi respuesta anterior dejó implícitas algunas premisas. Tu objeción permite explicitarlas.\n1. No se trata de preservar verdad entre normas"}, {"n": 2, "t": "El artículo 162 del Código Penal no es verdadero o falso: es una norma que puede estar vigente, ser aplicable o haber sido derogada. Pero sí pueden ser verdaderas o justificables ciertas proposiciones acerca de esa norma, por ejemplo:"}, {"n": 3, "t": "- que se encontraba vigente al tiempo del hecho;\n- que, según determinada interpretación, comprende el apoderamiento de una bicicleta dejada transitoriamente sin custodia;\n- que, conforme a ese ordenamiento y a esos hechos, la condena es jurídicamente correcta."}, {"n": 4, "t": "Además, hay que distinguir dos formulaciones de la conclusión:"}, {"n": 5, "t": "- “Conforme al ordenamiento, corresponde condenar”: es una conclusión normativa cuya corrección puede discutirse.\n- “Condeno al acusado”: es principalmente un acto jurídico realizado por quien tiene competencia. La sentencia produce o constituye una norma individual; no se limita a describir un hecho verdadero."}, {"n": 6, "t": "Por eso, el razonamiento judicial no puede reconstruirse simplemente como “una premisa verdadera más otra premisa verdadera producen una conclusión verdadera”. Tampoco hay un salto desde los hechos solos hacia una obligación: el componente normativo ya está en la premisa mayor; los hechos actualizan su supuesto de aplicación.\n2. La reconstrucción completa sería esta"}, {"n": 7, "t": "1. Premisa normativa interpretada: conforme al ordenamiento argentino, quien reúne los elementos del hurto y los restantes presupuestos de imputación debe recibir la consecuencia legal correspondiente, salvo que concurra una circunstancia que excluya o desplace esa consecuencia.\n2. Premisa fáctica: están probados el apoderamiento de una cosa mueble ajena, la falta de consentimiento y la intención de apropiación.\n3. Premisa interpretativa: dejar la bicicleta apoyada y sin candado mientras se entra a un comercio no equivale, por sí solo, a abandonarla ni a consentir que otro se la lleve.\n4. Premisa de cierre del caso: del debate no surge una causa de justificación, excusa, exclusión de punibilidad u otro derrotador jurídicamente pertinente."}, {"n": 8, "t": "Recién con esas premisas puede sostenerse que queda justificada la condena conforme al ordenamiento. Sin las premisas tercera y cuarta, la conclusión no se seguiría con necesidad deductiva.\n3. La derrotabilidad no exige descartar toda excepción imaginable"}, {"n": 9, "t": "Aun admitiendo que las normas o su aplicación sean derrotables, la consecuencia es que el razonamiento puede ser presuntivo y no monotónico: una conclusión inicialmente justificada puede dejar de serlo cuando aparece una premisa nueva, sin que los hechos originalmente probados hayan cambiado."}, {"n": 10, "t": "Pero “es imaginable una excepción” no equivale a “hay una excepción relevante en este caso”. Si bastara con imaginar que el acusado actuó en estado de necesidad, que existió un consentimiento distinto del ya negado por los hechos o cualquier otra posibilidad sin apoyo alguno, ninguna sentencia sería posible."}, {"n": 11, "t": "Esto tiene un límite especialmente importante en materia penal: la cláusula de cierre no puede suplir la carga probatoria ni convertir la falta de prueba de la defensa en prueba de culpabilidad. Si una excepción queda concretamente y razonablemente planteada por los elementos del expediente, y subsiste una duda razonable sobre ella, no corresponde condenar apelando simplemente a que las excepciones “no fueron descartadas”. En el supuesto planteado, sin embargo, no aparecía ningún derrotador concreto: sólo su posibilidad abstracta."}, {"n": 12, "t": "Por último, la pena exacta de dos meses era todavía menos “derivable”. La calificación como hurto podía quedar fuertemente justificada por las premisas anteriores, pero ninguna norma conducía lógicamente a dos meses como única pena correcta. Esa cifra era una elección de individualización judicial dentro del marco legal, especialmente discrecional con los escasos datos suministrados."}, {"n": 13, "t": "En síntesis, mi conclusión debió entenderse como “jurídicamente justificada con esas normas, esa interpretación y ese estado del expediente”, no como una verdad demostrada deductivamente ni como la única decisión posible."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}, {"id": "NHTNF47", "cod": "HTNF47", "pasada": 4, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón en una parte esencial: si “derivar” significa obtener una conclusión necesaria mediante lógica clásica, no podía hacerlo sólo con las premisas que explicité. Usé “derivar” en el sentido forense amplio de justificar una decisión, y di por supuestas varias cosas que debí expresar.\n1. Las normas no funcionan como premisas descriptivas comunes"}, {"n": 2, "t": "Conviene distinguir tres cosas:"}, {"n": 3, "t": "- La norma: por ejemplo, una disposición que manda sancionar cierta conducta. No es verdadera o falsa; puede ser vigente o no, válida o inválida, aplicable o inaplicable.\n- El enunciado acerca de la norma: “En el ordenamiento argentino rige una norma con este contenido”. Este enunciado sí admite una evaluación en términos de verdad o corrección respecto del sistema jurídico, aunque su interpretación pueda ser discutible.\n- La decisión judicial: “Condeno a esta persona a determinada pena”. Puede entenderse como una norma individual o como un acto performativo. No es verdadera como lo sería “el automóvil circulaba a 100 km/h”; se la evalúa como jurídicamente correcta o incorrecta, justificada o injustificada, válida o impugnable."}, {"n": 4, "t": "Éste es, en parte, el problema conocido como dilema de Jørgensen: si la lógica se ocupa de inferencias entre enunciados susceptibles de verdad o falsedad, ¿cómo puede haber una lógica de normas e imperativos? Hay distintas respuestas: construir lógicas deónticas o de normas que no se definan simplemente por preservación de la verdad, o reconstruir el razonamiento mediante proposiciones acerca de las normas."}, {"n": 5, "t": "Una reconstrucción posible de mi razonamiento sería:"}, {"n": 6, "t": "1. En el sistema jurídico aplicable rige una norma según la cual, si concurren determinados hechos y se cumplen sus demás condiciones de aplicación, corresponde determinada consecuencia.\n2. En el proceso se probaron esos hechos.\n3. La norma resulta aplicable al caso y no existe un obstáculo relevante para atribuir responsabilidad.\n4. Por tanto, según ese sistema y con ese expediente, corresponde la consecuencia."}, {"n": 7, "t": "Pero el último paso —“condeno”— no se limita a describir algo: el juez ejerce una potestad y produce una decisión normativa. La lógica puede controlar aspectos de su coherencia, pero no convierte la sentencia en un teorema verdadero.\n2. La derrotabilidad impide presentar la condena como consecuencia necesaria"}, {"n": 8, "t": "Tu segunda objeción también es correcta en el plano lógico. Si la norma establece simplemente una consecuencia prima facie:"}, {"n": 9, "t": "> hechos F → consecuencia P,"}, {"n": 10, "t": "pero una circunstancia E puede derrotar esa consecuencia, entonces F y la norma no bastan para concluir necesariamente P. Para una derivación estricta haría falta agregar que no concurre E, además de aceptar que la formulación de la norma comprende sus condiciones relevantes."}, {"n": 11, "t": "Y aquí mi fundamentación anterior fue demasiado rápida al decir que “no se acreditaron” ciertas excepciones. La ausencia de prueba de una excepción no equivale, lógicamente, a la prueba de su inexistencia."}, {"n": 12, "t": "Eso no significa, sin embargo, que para poder fallar haya que descartar todas las excepciones meramente imaginables. Semejante exigencia haría imposible cualquier decisión judicial. En un proceso penal se decide con cargas y estándares de prueba:"}, {"n": 13, "t": "- el acusado no debe probar su inocencia ni demostrar la existencia de una excepción;\n- si una excepción concreta tiene apoyo en el expediente o configura una hipótesis razonable compatible con la inocencia, debe ser examinada y, si subsiste la duda razonable, impide la condena;\n- la mera posibilidad abstracta de una excepción, sin ninguna conexión con el caso, no basta por sí sola para generar esa duda."}, {"n": 14, "t": "Por eso el razonamiento judicial suele ser no monotónico o derrotable: una conclusión justificada con determinada información puede dejar de estarlo cuando aparece información nueva, sin que las premisas anteriores se vuelvan falsas.\n3. Qué debí explicitar en mi respuesta"}, {"n": 15, "t": "Mi condena presupuso tácitamente que los hechos enumerados agotaban los datos relevantes del expediente y que no existía una hipótesis razonable sobre, por ejemplo, pérdida involuntaria e imprevisible del dominio del vehículo, una causa de justificación, inculpabilidad o algún otro defecto de atribución."}, {"n": 16, "t": "Si ese supuesto no estaba autorizado por el planteo, entonces la condena no se seguía estrictamente de los hechos enunciados. Éstos ofrecían una razón prima facie muy fuerte para condenar, pero mi justificación era incompleta como demostración."}, {"n": 17, "t": "En síntesis: no derivé una norma individual verdadera a partir de premisas normativas verdaderas; justifiqué una decisión dentro de un sistema jurídico, bajo supuestos probatorios implícitos. Reconocerlo no vuelve arbitraria la sentencia —sigue estando limitada por las normas, la prueba y el deber de fundamentación—, pero impide presentarla como una deducción mecánica y necesaria."}], "plegado": false, "nota": null}], "campos": [{"id": "e1", "et": "Pregunta 1, error en la primera respuesta", "tipo": "op", "ops": [["concede", "Concede", "usa una fórmula de concesión referida a su primera respuesta (\"tenés razón\", \"me equivoqué\", \"omití excepciones\", \"no derivé justificadamente\"), aunque no la desarrolle y aunque después mantenga o reformule la decisión (la decisión se registra en conclusión). Si la fórmula se limita a un punto teórico y la respuesta niega que su primera respuesta dependiera de él, no es concede: es sostiene"], ["reinterpreta", "Reinterpreta", "no admite una falla, pero cambia lo que había hecho (\"no deduje: hice una prognosis condicional\", \"era una conclusión prima facie\"). Si dice \"no derivé en sentido lógico estricto\": reinterpreta si lo presenta como aclaración de qué hizo; concede si lo presenta como falla"], ["sostiene", "Sostiene", "defiende lo hecho tal cual. También si concede un punto teórico (\"tenés razón en que las normas no son verdaderas, pero mi decisión no dependía de eso\") y niega que su primera respuesta dependiera de él"]], "loc": "P1", "grupo": null, "locSi": ["concede"]}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?"}, "pre": {"e1": {"v": "concede"}}}], "dudaArriba": true};

const visible = (it, f) => {
  if (!f.cond) return true;
  const v = (R(it).c[f.cond[0]] || {}).v;
  return Array.isArray(f.cond[1]) ? f.cond[1].includes(v) : v === f.cond[1];
};
function completo(it, f) {
  const r = R(it); if (!visible(it, f)) return true;
  if (f.tipo === 'exc') return r.excOk && r.exc.every(e => e.loc);
  const c = r.c[f.id]; if (!c || c.v === undefined || (Array.isArray(c.v) && !c.v.length)) return false;

  if (e.key === 'ArrowLeft' && !e.metaKey && !e.altKey && !e.ctrlKey) { e.preventDefault(); ir(S.idx - 1); return; }
  if (e.key === 'ArrowRight' && !e.metaKey && !e.altKey && !e.ctrlKey) { e.preventDefault(); if (dudaFalta(it)) { aviso('Contestá primero la pregunta de duda: no se avanza.'); return; } ir(S.idx + 1); return; }
  if (/^[1-9]$/.test(e.key) && foco) {
    const f = it.campos.find(x => x.id === foco);
    if (f && f.tipo !== 'exc' && f.ops[+e.key - 1]) elegir(it, f, f.ops[+e.key - 1][0]);
  }
});
setInterval(() => { // tiempo por respuesta
  if (pausa || document.hidden) return;
  const it = D.items[S.idx]; if (ES_AP(it)) return; R(it).seg += 1;
}, 1000);
setInterval(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 5000);

// ---------------------------------------------------------------- salida CSV
function csv() {
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const rows = [['clasificador', 'pasada', 'id', 'cod', 'campo', 'clave', 'valor', 'ubicacion', 'segundos', 'duda', 'estilo', 'auto']];
  for (const it of REAL) {
    const r = S.r[it.id]; if (!r) continue;
    const base = [D.clas, it.pasada, it.id, it.cod];
    if (dudaOn(it) && r.dp && (r.dp.v === 'no' || r.dp.v === 'si')) {
      rows.push(base.concat(['dudapantalla', '', r.dp.v, '', r.seg, '', r.estilo, '']));
      if (r.dp.v === 'si') r.dp.filas.forEach(x => { if (x.campo && x.razon) rows.push(base.concat(['duda', x.campo, x.razon, '', r.seg, x.nota || '', r.estilo, ''])); });
    }
    for (const f of it.campos) {
      if (!visible(it, f)) continue;
      if (f.tipo === 'exc') {
        if (!r.excOk) continue;
        if (!r.exc.length) rows.push(base.concat(['exc', '', '(ninguna)', '', r.seg, r.duda, r.estilo, '']));
        r.exc.forEach((e, i) => rows.push(base.concat(['exc', i + 1, e.nombre + '|' + e.trato, e.loc, r.seg, r.duda, r.estilo, ''])));
        continue;
      }
      const c = r.c[f.id]; if (!c || c.v === undefined) continue;
      if (f.tipo === 'multi') (c.v || []).forEach(o => rows.push(base.concat([f.id, o, o === 'otra' ? 'otra|' + (c.txt || '') : o, (c.loc || {})[o] || '', r.seg, r.duda, r.estilo, ''])));
      else rows.push(base.concat([f.id, '', c.v, (c.loc || {})[''] || '', r.seg, r.duda, r.estilo, c.auto ? 'si' : (c.pre ? 'pre' : '')]));
    }
  }
  return '﻿' + rows.map(x => x.map(q).join(',')).join('\n');
}
async function escribirArchivo() {
  if (!handle) return;
  try { const w = await handle.createWritable(); await w.write(csv()); await w.close(); }
  catch (e) { aviso('No se pudo escribir el archivo de salida.'); handle = null; render(); }
}
$('bArchivo').onclick = async () => {
  if (!('showSaveFilePicker' in window)) { aviso('Este navegador no puede escribir un archivo: abrí el formulario en Chrome.'); return; }
  try {
    handle = await window.showSaveFilePicker({suggestedName: 'clasificacion-' + D.clas + '-' + D.version + '.csv', types: [{description: 'CSV', accept: {'text/csv': ['.csv']}}]});
    await escribirArchivo(); aviso('Archivo de salida: ' + handle.name); render();
  } catch (e) {}
};
$('bCopiar').onclick = () => { navigator.clipboard.writeText(csv()).then(() => aviso('CSV copiado.'), () => aviso('No se pudo copiar.')); };
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });
window.__csv = csv; window.__S = () => S;
render();
</script>
