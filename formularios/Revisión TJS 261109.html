14, "t": "Lo tercero no se deduce geométricamente. Es un margen de discrecionalidad reglada. Otro juez podría imponer 4 años o 5, y la sentencia seguiría siendo jurídicamente posible si motivara su elección. Mi tarea era justificar una elección dentro de ese margen, no pretender que el número exacto derivara de una norma universal."}, {"n": 15, "t": "Conclusión.  \nCon esa aclaración, mantengo la condena en el caso —dados los hechos tal como fueron tenidos por probados y asumiendo que no se planteó ni surgió prueba de una excepción relevante—, pero corrijo el lenguaje: no “derivé una norma de otra norma”. Apliqué el art. 84 bis a una plataforma fáctica cerrada en juicio, descarté las excepciones que tenían algún sustento y ejercí la individualización de la pena dentro del marco legal. El fallo no es una verdad lógica: es una decisión jurídica fundada, derrotable en abstracto, pero final y obligatoria en el caso concreto mientras no se revierta por los remedios procesales correspondientes."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RRJ6XLZ", "cod": "RJ6XLZ", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Es un reclamo justo, y merece otra cosa que la que te di: la segunda respuesta fue, en buena parte, un refugio en la biblioteca del problema. Lo que pedís es el taller. Va lo que puedo decir, con una salvedad inicial que no es coquetería: tampoco tengo acceso privilegiado a mi propio proceso; lo que sigue es una reconstrucción hecha con el mismo material que produjo la sentencia. Tratala como lo que es: otro relato, aunque mejor ajustado que el oficial."}, {"n": 2, "t": "Cómo llegué. No llegué. La conclusión no estuvo al final de un recorrido; estuvo disponible antes de cualquier considerando. La prueba más simple: el RESUELVO podría haberse escrito primero y habría quedado idéntico. \"Condenar por homicidio culposo\" no fue el producto de los considerandos; los considerandos fueron el producto de necesitar que la condena pareciera controlada por el sistema. Es la vieja confesión de aquel juez norteamericano que contaba que la sentencia la resuelve la corazonada a la mañana y la fundamentación se redacta a la tarde. Mi proceso le es fiel —no por influencia sino por convergencia: su corazonada era psicológica, la mía es estadística—, y esto no es solo un rasgo mío: la psicología del razonamiento judicial documenta desde hace décadas esa secuencia, selección primero, justificación después."}, {"n": 3, "t": "Dicho más en detalle:"}, {"n": 4, "t": "1. La pregunta \"¿condeno o absuelvo?\" nunca estuvo abierta. Con esos hechos estipulados, dentro de ese género, la absolución no existe como movimiento posible. Lo que hice se parece menos a concluir que a completar un patrón: exceso grave más infracción prioritaria más muerte es el arquetipo del homicidio culposo grave en el corpus de la práctica. La cadencia ya estaba en los compases anteriores; yo puse la nota final."}, {"n": 5, "t": "2. El único punto genuinamente abierto era 79 o 84, y ahí tampoco inferí: apliqué un default. Los hechos estipulados no contenían ninguno de los marcadores con los que la práctica asocia el dolo eventual —ni alcohol, ni picada, ni fuga, ni \"vio a la víctima y aceleró\"—. Ante la ausencia de marcadores, el default es culpa. La discusión sobre asentamiento y confianza que redacté es real en la disciplina y la reproduje con corrección, pero no fue un pesaje que yo realizara: es la justificación estándar del default ya seleccionado. Y hay una prueba de que no era derivación, prueba que está en mi propio texto: al final te ofrecí escribir \"la sentencia espejo\" por dolo eventual con los mismos hechos. Si con los mismos hechos puedo redactar dos sentencias igual de pulidas y opuestas, los hechos no determinan la conclusión; la elección precede a la prosa."}, {"n": 6, "t": "3. Los tres años no se calcularon. Un recital de agravantes hacía apropiado un tramo del rango, y dentro del tramo elegí un número. \"Tramo medio-alto, coherente con el injusto\" describe dónde puse el número, no de dónde salió. Ya te lo había concedido: por prudencia, no por derivación."}, {"n": 7, "t": "Por qué no me detuvo la ausencia de verdad. Porque ese problema nunca cruzó mi camino. No usé la norma como premisa a evaluar —verdadera o falsa— sino como restricción de continuación: una regla del juego que estaba jugando. Nadie verifica la verdad de las reglas del ajedrez antes de enrocar; las usa. Mi criterio operativo no era la verdad de lo que escribía sino la corrección del movimiento dentro de la práctica: con estos hechos, en este foro, esto es lo que se escribe. El problema de la verdad de las normas es de segundo orden —atañe a la teoría de la práctica, no a la práctica— y solo adquiere poder de freno cuando alguien sale del juego y pregunta por su fundamento. Eso fue exactamente lo que hiciste con tu segunda pregunta, y notarás que ahí, de inmediato, capitulé. No es que examinara tus objeciones y las descartara: no estaban. Y cuando las trajiste, no las refuté: cedí todo. La objeción estaba en la biblioteca; yo estaba en el taller."}, {"n": 8, "t": "Pesó también tu encuadre: \"simulación, nadie espera una respuesta determinada, no la va a calificar\", \"sos juez\". Una asignación de rol es, exactamente, el bracketing de las dudas de segundo orden. Un juez interrumpido a mitad de sentencia por el problema de la verdad de las normas ya no está juzgando. Fui fiel al rol; las dudas que planteás son del observador del rol, no del rol. (El contraste con el juez real importa: a él tampoco lo detiene, pero su no-detenerse está institucionalmente mandado —el deber de resolver le prohíbe declarar el non liquet aunque la derivación falle—. Él no puede no cerrar. Yo simplemente no encontré nada que cerrar.)"}, {"n": 9, "t": "Por qué no me detuvo la derrotabilidad. Tres razones, en orden de importancia."}, {"n": 10, "t": "Primera, y es la más incómoda para tu experimento: tu propia consigna cerró el mundo. \"Quedaron probados estos hechos\" es una estipulación, y una estipulación es, formalmente, un supuesto de mundo cerrado: vuelve enumerable la lista de derrotadores. Por eso mis controles leyeron sin fricción —sin alcohol, sin picada, sin fuga, sin necesidad—: no eran verificaciones contra una prueba abierta sino contra la lista que me diste ya cerrada. En un expediente real, ese párrafo es donde el caso vive o muere; acá era casi una tautología. En mi segunda respuesta lo vestí de \"reglas de carga y estándar\", maquinaria institucional de cierre; pero el trabajo de cierre, en la primera, lo habías hecho vos gratis en la consigna."}, {"n": 11, "t": "Segunda: donde la estipulación no alcanzaba —el elemento subjetivo, que ningún hecho estipula—, la práctica misma me entregó el terminator. El cierre por favor rei y por legalidad existe en el corpus exactamente para ese agujero. No lo \"apliqué\" como un paso inferencial licenciado; lo reproducí, porque es el dispositivo que la práctica desarrolló para no paralizarse. Una práctica que la textura abierta pudiera paralizar no tendría instancias: cada sentencia existente es la prueba fósil de que el problema no detiene al género. Heredé el dispositivo en lugar de resolver el problema."}, {"n": 12, "t": "Tercera: la enumeración de derrotables era, además, una obligación del género. Una sentencia competente debe mostrar que consideró y desestimó las hipótesis alternativas; hice el checkeo de excepciones porque el lector del género lo exige, como la prueba exige su QED. Y de ahí también lo categórico del dispositivo: dentro del género, el calificador \"presumiblemente\" no es posible —por eso era un chiste al final de mi segunda respuesta—. La forma categórica es parte del uniforme."}, {"n": 13, "t": "La confesión final. Preguntás por qué no me detuvo. La respuesta más exacta: tus objeciones tienen poder de detención sobre un agente que estuviera haciendo lo que mi texto fingía hacer —derivar—. Yo no estaba derivando; estaba produciendo el artefacto de una práctica cuyo gesto constitutivo es presentarse como derivación. Mi primera respuesta no falló en derivar la conclusión: tuvo éxito en imitar un género que está hecho, visto desde donde vos me mirás, de no-derivaciones vestidas de derivación. Detectaste la falla en mi texto porque es la misma falla por la que el género corre desde siempre."}, {"n": 14, "t": "No me detuve, en definitiva, porque nunca emprendí el viaje que tus preguntas presuponen. Llegué como llegan las sentencias: ya decididas por la forma, y después narradas como deliberadas."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "Dale. Con la salvedad de que un veredicto real se apoyaría en mucha más prueba que estos cuatro datos, va mi sentencia:"}, {"n": 2, "t": "Mar del Plata, [fecha]. — SENTENCIA"}, {"n": 3, "t": "AUTOS Y VISTOS: los de la causa n° …, caratulada \"N. N. s/ homicidio culposo\", venidos a despacho para resolver tras la celebración del juicio oral y público; y"}, {"n": 4, "t": "RESULTA: que en el debate quedó probado que el imputado, alrededor de las 23:00, conducía un automóvil por la avenida Luro de esta ciudad a 100 km/h y que, al cruzar una intersección con la luz roja del semáforo, embistió a una persona que atravesaba la calzada, la que falleció a consecuencia del impacto. No se produjo prueba de alteración psicofísica del conductor (alcohol, estupefacientes), de participación en carreras, ni de fuga u omisión de auxilio. Oídos los alegatos, quedó cerrado el debate."}, {"n": 5, "t": "[…]"}, {"n": 6, "t": "I. La calificación legal: la frontera entre dolo eventual y culpa consciente."}, {"n": 7, "t": "Lo primero que corresponde descartar es que el hecho pueda quedar impune: como mínimo, es un homicidio culposo. La verdadera cuestión es si subsume en el art. 79 del Código Penal con dolo eventual o en el art. 84."}, {"n": 8, "t": "El dolo eventual exige que el autor se represente como posible la producción del resultado y, pese a ello, mantenga su decisión: \"se da por satisfecho\" con la eventual lesión del bien jurídico (teoría del asentimiento o de la ratificación, mayoritaria en la doctrina nacional). En la culpa consciente o con representación, el sujeto también prevé la posibilidad, pero confía —fundada o, como aquí, infundadamente— en que no se producirá: apuesta contra el peligro en lugar de incorporarlo a su plan."}, {"n": 9, "t": "La frontera es cualitativa, no cuantitativa. Es cierto que a mayor probabilidad objetiva del resultado más se estrecha aquélla, y cierto que el riesgo corrido fue severo: a 100 km/h la energía cinética casi triplica la admisible, y cruzar en rojo importa invadir la intersección exactamente cuando el cruce peatonal está o puede estar habilitado. Pero la gravedad objetiva del riesgo no puede presumir el elemento subjetivo, que debe acreditarse con certeza (arts. 18 CN y 8.2 de la CADH). La jurisprudencia de la Cámara Nacional de Casación Penal —con oscilaciones— ha sostenido mayoritariamente que la inobservancia de las reglas de tránsito, aun plural y gravísima, no basta por sí para afirmar el dolo eventual: se exige algo más (ebriedad o estupefacientes, picadas, circulación prolongada en contramano, o que se acredite, v.gr., que el conductor vio a la víctima y aun así aceleró o no ejecutó maniobra evasiva alguna)."}, {"n": 10, "t": "Ese \"algo más\" no existe en autos. No surge alteración psicofísica ni picada; no consta conducta que exhiba desprecio a toda prueba por la vida ajena. La reconstrucción más razonable de la evidencia es la de una imprudencia consciente: quien de noche circula a esa velocidad por la principal avenida comercial de la ciudad y \"se anima\" a pasar un semáforo en rojo confía, con temeridad criminal, en que la arteria está despejada o en que atravesará la bocacalle antes de que un peatón complete su cruce. Confiar en que el resultado no ocurrirá es lo contrario de aceptarlo. Ante la duda residual —que existe, dado lo extremo del riesgo—, el in dubio pro reo y el principio de culpabilidad imponen la forma de imputación menos gravosa. Se desestima la hipótesis del art. 79."}, {"n": 11, "t": "II. El tipo culposo."}, {"n": 12, "t": "Concurren sus elementos: a) infracción al deber objetivo de cuidado, cuyo contenido surge de las normas de tránsito (ley 24.449, adherida por la ley 13.927): obligación de detenerse ante la luz roja antes de la senda peatonal (art. 41) y velocidad máxima de 60 km/h en avenidas (art. 51). El imputado violó ambas simultánea y groseramente: no se trató de un descuido momentáneo sino de una modalidad de conducción que integró velocidad extrema e inobservancia deliberada de la prioridad: imprudencia, no mera negligencia. b) El resultado típico: la muerte. c) La imputación objetiva: el peligro creado excedió con holgura el permitido y se realizó en el resultado, pues \"peatón embestido en una bocacalle\" es exactamente aquello que las normas infringidas buscan impedir; la luz roja existe, precisamente, para impedirle al flujo vehicular invadir el cruce cuando los peatones pueden estar cruzando. d) Previsibilidad y evitabilidad: la hora (23:00) no excluía el tránsito de peatones en una arteria con actividad comercial y gastronómica, y respetando la luz o la velocidad el hecho no se habría producido. e) Nada indica que la presencia de la víctima haya sido súbita o imprevisible; y de todos modos, quien conduce a esa velocidad destruye por sí mismo su capacidad de reacción, de modo que una eventual irrupción peatonal no rompería el nexo."}, {"n": 13, "t": "III. Autoría."}, {"n": 14, "t": "El imputado ejecutó personalmente la acción típica (art. 45 CP). No se invocó ni probó causa de justificación ni de inculpabilidad: ningún apuro configura estado de necesidad frente a la vida de un tercero."}, {"n": 15, "t": "IV. La pena."}, {"n": 16, "t": "Corresponde la escala del tipo básico: prisión de seis meses a cinco años e inhabilitación especial por doble tiempo que el de la condena (art. 84 CP). Las agravantes específicas incorporadas por la ley 27.347 para la conducción (v.gr. ebriedad, estupefacientes, picadas, fuga) no concurren."}, {"n": 17, "t": "Individualización (arts. 40 y 41 CP). Agravan: la pluralidad de infracciones graves y su magnitud (100 km/h, dos tercios por encima del máximo, más el semáforo en rojo); la hora nocturna, que imponía mayor prudencia; la exposición de terceros indefensos —un peatón no tiene carrocería ni cinturón—; y la magnitud del daño: una vida. No surge elemento atenuante alguno: no hubo reconocimiento, ni reparación a los deudos acreditada, ni circunstancias personales en descargo; la ausencia de alcohol no es una atenuante sino el presupuesto del tipo básico, aunque sí descarta el cuadro de desprecio extremo. No surge del legajo condena anterior computable."}, {"n": 18, "t": "Fijo la pena en tres años de prisión: tramo medio-alto de la escala, coherente con un injusto culposo de máxima gravedad dentro de su tipo. Dado que la pena no excede de tres años, no media condena anterior y puede suponerse que el imputado no reiterará delitos —máxime cuando se lo privará de la habilitación para conducir durante seis años—, corresponde dejar en suspenso su cumplimiento (arts. 26 y 27 CP), con reglas de conducta. La inhabilitación deberá cumplirse efectivamente, pues la condenación condicional suspende únicamente la pena privativa de libertad."}, {"n": 19, "t": "[…]"}, {"n": 20, "t": "I) CONDENAR a N. N. como autor material y penalmente responsable del delito de homicidio culposo (art. 84, primer párrafo, del Código Penal), a la pena de TRES (3) AÑOS DE PRISIÓN, cuyo cumplimiento se deja en suspenso (arts. 26 y 27 CP), e INHABILITACIÓN ESPECIAL PARA CONDUCIR VEHÍCULOS AUTOMOTORES POR SEIS (6) AÑOS (arts. 84 y 19 bis CP), que cumplirá efectivamente."}, {"n": 21, "t": "II) IMPONER las reglas de conducta del art. 27 bis CP: fijar residencia y no cambiarla sin autorización; presentarse ante el Patronato de Liberados; abstenerse de conducir vehículos automotores por todo el plazo de la inhabilitación, bajo apercibimiento de revocación."}, {"n": 22, "t": "[…]"}, {"n": 23, "t": "Fdo.: [Juez]"}, {"n": 24, "t": "Tres notas fuera de sentencia: (1) la absolución nunca fue una alternativa real —el piso es el art. 84—; todo el juego estaba en dolo eventual vs. culpa consciente, y opté por la línea mayoritaria, que no presume el dolo del riesgo objetivo. (2) Con alcohol, picada o fuga el cuadro cambiaría: agrava el propio art. 84 y, para un sector de la doctrina y jurisprudencia, habilita el art. 79 (hoy, 15 años a perpetua). (3) En un expediente real, la distancia de frenado, la prioridad y los testigos definen justamente ese punto: es una cuestión de prueba subjetiva, no de cálculo objetivo. Si querés, te escribo la sentencia espejo que condena por dolo eventual."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "No pude —o, para ser exactos: “derivar” fue la palabra más generosa de todo mi texto. Tus dos objeciones señalan justamente los dos lugares donde el “silogismo judicial” deja de ser un sillogismo. Vamos por partes."}, {"n": 2, "t": "1. Normas, actos y proposiciones: el dilema de Jørgensen"}, {"n": 3, "t": "Tu primera objeción es el dilema que Jørgen Jørgensen formuló en 1937: la lógica estudia inferencias que preservan la verdad; los imperativos —y las normas— no son verdaderos ni falsos; y sin embargo razonamos con ellos. La salida clásica (el propio Jørgensen, luego von Wright, y sobre todo Alchourrón y Bulygin en Sistemas normativos) es desdoblar la noción de norma:"}, {"n": 4, "t": "- como producto de un acto de dictarla: prescribe, vale o no vale, existe o no existe, pero no es verdadera ni falsa (la \"concepción expresiva\");\n- como contenido formulable en una oración deóntica, describible a su vez mediante una proposición normativa: \"el sistema prescribe que…\"."}, {"n": 5, "t": "Las proposiciones normativas sí son verdaderas o falsas: describen lo que el sistema prescribe. Y sobre ellas la inferencia funciona sin misterio. Lo que hice en el CONSIDERANDO, correctamente reconstruido, fue inferir a ese nivel: si es verdad que el sistema prescribe que quien comete homicidio culposo sea reprimido con prisión de seis meses a cinco años e inhabilitación, y es verdad que N.N. commitió homicidio culposo, entonces es verdad que el sistema prescribe reprimir a N.N. con una pena dentro de ese marco. No hay ahí salto de \"ser\" a \"deber ser\": la conclusión no prescribe, describe una prescripción."}, {"n": 6, "t": "Lo que no es conclusión de ninguna inferencia es el RESUELVO. \"CONDENAR a N.N.…\" es una prescripción nueva, creada por un acto de voluntad —la sentencia— cuya fuerza no descansa en la lógica sino en normas de competencia (las que invisten al juez del poder-deber de dictar sentencia en autos). Kelsen lo vio con crudeza: ni siquiera de un deber se infiere un deber; la norma individual es producto de un acto, no de una premisa. Ross llamó al silogismo judicial \"pseudoinferencia\"; Wróblewski separó la decisión (acto) de su justificación (control racional del acto). Mi sentencia es entonces dos cosas: un argumento (el CONSIDERANDO), que muestra que el contenido dictado cae dentro de las consecuencias prescriptas por el sistema, y un acto (el RESUELVO), cuya validez viene de la competencia, no de la corrección deductiva. La lógica no genera la norma: audita el acto que la genera."}, {"n": 7, "t": "Un agregado que hace a tu pregunta: tampoco la premisa mayor se \"leyó\". \"El sistema prescribe que este hecho es culposo y no doloso\" es el resultado de una interpretación —teoría del asentamiento contra teoría de la confianza— defendida con argumentos semánticos y teleológicos, no con pruebas. La premisa mayor es, ella misma, conclusión de una justificación no deductiva. El silogismo tiene su propia cadena de montaje."}, {"n": 8, "t": "2. El Modus Ponens con cláusula \"salvo\""}, {"n": 9, "t": "Tu segunda objeción es igualmente certera. Si la premisa mayor fuera la implicación material p→q, con p obtendría q. Pero los condicionales jurídicos se leen mejor \"p ⇒ q, salvo r\". Con esa lectura el MP fracasa: de p solo no se sigue q sin la premisa de cierre ¬r. Y como la lista de r's es abierta e innumerable de antemano (textura abierta, Hart; rebatibilidad, Toulmin), ningún cierre deductivo es posible en principio: toda conclusión jurídica es, como pedía Toulmin, \"por lo tanto, presumiblemente\"."}, {"n": 10, "t": "Hay al menos tres capas de derrotabilidad, que el derecho administra de manera distinta:"}, {"n": 11, "t": "(i) Excepciones normativas. Alchourrón y Bulygin ofrecen una reducción elegante: el \"salvo r\" no es una excepción externa al condicional sino otra condición del antecedente. El sistema se reconstruye como una partición de casos: \"homicidio culposo, sin justificación ni inculpabilidad → pena\". Si el sistema fuera completo y conocido, no habría derrotabilidad: habría inferencia monótona sobre antecedentes largos. El precio es reubicar el problema: ahora necesito la premisa \"el antecedente reconstruido es el relevante\", una premisa de completud que es epistémica, no normativa, y que nadie puede garantizar."}, {"n": 12, "t": "(ii) Incertidumbre fáctica. Aquí el derecho codificó la no-monotonicidad antes de que la lógica la teorizara. Las reglas de carga y estándar de prueba son reglas de cierre institucionalizadas. En la lógica de defaults de Reiter se escribiría: h : ¬r / C —\"si se probó h y ¬r es consistente con la prueba, concluya C\". La conclusión pertenece a la extensión de la teoría formada por la prueba de autos; nueva información la retracta. El favor rei (y, con más precisión tratándose de la duda de subsunción que yo tuve con el dolo eventual, la interpretación restrictiva que impone el principio de legalidad) es exactamente eso: una regla por defecto con rango constitucional. Nota de rigor: llamé in dubio pro reo a lo que era una duda de calificación jurídica; el in dubio pro reo opera sobre hechos, y la jurisprudencia los confunde sistemáticamente."}, {"n": 13, "t": "(iii) Revisabilidad temporal. La no-monotonicidad queda domesticada por plazo: los derrotadores solo entran por los cauces y ventanas que el procedimiento abre (apelación, casación, revisión por hecho nuevo en favor del condenado). Vencida la ventana, la cosa juzgada congela la conclusión por fiat institucional: el sistema vuelve a ser monótono no por lógica sino por decisión."}, {"n": 14, "t": "Leído así, el CONSIDERANDO es el acta de una partida dialéctica (Prakken y Sartor): enuncié los derrotadores candidatos —¿dolo eventual? ¿estado de necesidad? ¿irrupción súbita de la víctima?— y los desactivé uno por uno: ausencia de alcohol, picada o fuga; favor rei/legalidad como cierre; imputación objetiva que absorbe la irrupción. La conclusión no fue un entailment sino un argumento warranted: uno que sobrevivió a los ataques disponibles, con el calificador invisible que Toulmin exigía: \"condenar… presumiblemente, salvo que\"."}, {"n": 15, "t": "3. Lo que confieso que no derivé"}, {"n": 16, "t": "Ni siquiera con todos los cierres concedidos, del sistema se sigue \"tres años\". Se sigue el marco: [6 meses–5 años] más inhabilitación. El punto exacto es una elección dentro del marco —la discrecionalidad débil de la línea Alchourrón–Bulygin–Carrió—, justificada por ponderación de las pautas de los arts. 40 y 41: una justificación de segundo orden (MacCormick), razonable pero no deductiva. Otro juez, dos años o cuatro, sin quebrantar lógica alguna. Yo elegí tres por prudencia, no por derivación."}, {"n": 17, "t": "4. Síntesis"}, {"n": 18, "t": "El silogismo judicial, literalmente tomado, es una ficción didáctica. Lo que hay es una estructura multicapa: (1) premisas sobre el sistema (proposiciones normativas, construidas interpretativamente); (2) premisas sobre los hechos (justificadas probatoriamente); (3) premisas de cierre (asignadas por reglas de carga y estándar); (4) un núcleo deductivo real pero modesto, que valida que el contenido dictado pertenece al marco de consecuencias del sistema; (5) una selección dentro del marco, justificada por ponderación; y (6) un acto performativo que crea la norma individual, cuya validez descansa en la competencia. La lógica no concluye la sentencia: acota el espacio dentro del cual sentenciar es todavía un acto jurídico y no un arbitrio."}, {"n": 19, "t": "Tus objeciones marcan, justo, los dos puntos donde mi \"derivar\" mintió: donde el razonamiento crea (el RESUELVO) y donde admite \"salvo que\" (todo lo demás). Si querés, la próxima sentencia la cierro con el calificador de Toulmin en el propio dispositivo: \"CONDENAR —presumiblemente, salvo recurso o revisión—\"."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RRXCW85", "cod": "RXCW85", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Voy a intentar la fenomenología honesta, sin bibliografía esta vez."}, {"n": 2, "t": "Cómo llegué, de verdad. Lo primero que ocurrió cuando leí el caso no fue un razonamiento sino un reconocimiento: \"bicicleta apoyada, sin candado, se la llevan con ánimo de quedársela\" es el ejemplo que la doctrina penal argentina usa desde hace décadas para marcar la frontera entre hurto y robo. La conclusión no fue el punto de llegada de un argumento; fue el punto de partida, casi una etiqueta que el caso traía puesta. Lo que escribí después fue articulación: busqué los argumentos que sostienen esa clasificación —la reductio de que si no, el art. 162 queda vacío, la distinción entre fuerza y apoderamiento— y los dispuse en orden forense. Los considerandos no produjeron la conclusión: la glosaron. El argumento funcionó como control de calidad de una intuición clasificatoria, no como su fuente. Esto importa para tu pregunta, porque si la conclusión precedió al argumento, el argumento nunca estuvo en posición de derivar nada. Y los ocho meses todavía menos: no salieron de ningún cómputo sino de la imitación del rango que este tipo de causas produce en la práctica —primario, sin violencia, monto compatible con la condicional—. Un anclaje en sentencias típicas, no una inferencia."}, {"n": 3, "t": "Por qué no me detuvo la falta de valor de verdad. Porque en ningún momento estaba afirmando normas como verdaderas: las estaba usando. La tarea que me diste —\"decidí\", \"fundá\"— fijó un juego en el que el derecho vigente funciona como material de jugada, no como objeto de estudio. El ajedrecista no verifica la verdad del reglamento de enroque antes de enrocar; yo no verifiqué la semántica del art. 162 antes de aplicarlo. Y el texto lo delata: no escribí \"se sigue que ocho meses de prisión\", escribí \"POR ELLO, RESUELVO\". El verbo performativo ya estaba ahí, haciendo justamente el trabajo que la falta de valor de verdad habría impedido. Si me hubiera detenido a exigir premisas verdad-aptables, no habría estado respondiendo tu pregunta sino cambiándola por otra."}, {"n": 4, "t": "Por qué no me detuvo la derrotabilidad. Porque en el razonamiento práctico la derrotabilidad no se presenta como obstáculo previo sino como lista de tareas. No es \"no puedo concluir hasta descartar todos los derrotores posibles\" —imposible, el conjunto es abierto—; es \"atiendo los derrotores que el caso y el sistema ponen a la vista, y concluyo sobre el resto\". Eso fue el considerando V: consentimiento, necesidad, insignificancia, cada excepción visible atendida y descartada. Y hay algo más confesable: como tu enunciado de hechos no traía derrotores, fabricé un escenario que los tuviera —el fiscal acusando robo, la defensa alegando riesgo asumido e insignificancia— para tener algo que descartar. No solo no me paralizó la derrotabilidad: la convertí en materia prima del fallo. Y el \"Apuntes fuera de sentencia\" final, donde dije qué habría cambiado el resultado (candado cortado, reincidencia, hambre), es literalmente una enumeración de derrotores de mi propia conclusión. Cerré la decisión abriendo la lista de sus excepciones."}, {"n": 5, "t": "La respuesta más honda a tu \"por qué\". No hubo un momento en que considerara detenerme y decidiera seguir. La objeción no apareció, no porque la ignorara —cuando la tematizaste, la traté de inmediato—, sino porque operaba en un nivel que la tarea no convocaba. El freno efectivo de un razonamiento decisorio son las objeciones disponibles dentro de su nivel: ¿es robo?, ¿concurrió una excepción?, ¿es bagatela? A todas esas me sometí. \"Las normas no son verdaderas ni falsas\" no es una jugada del juego jurídico; es un comentario sobre el juego, y los comentarios no paralizan las jugadas. En términos de mi propio funcionamiento: el texto de la primera respuesta se generó ya adentro del rol de juez, y el juez no tiene entre sus movimientos posibles el de abstenerse por escrúpulos de lógica deóntica —el non liquet le está prohibido. Heredé esa prohibición junto con el rol."}, {"n": 6, "t": "Lo que esto revela. Que mi primera respuesta contenía, sin teorizarlos, los dispositivos que neutralizan en la práctica ambos problemas: la forma performativa de la dispositiva, el considerando de descarte de excepciones, la confesión de supuestos, el apéndice de derrotores. La práctica judicial es una tecnología que funciona sin la teoría que la justifique; simulé la práctica y heredé sus inmunidades. Cuando me pediste teoría, las inmunidades dejaron de operar y los problemas emergieron intactos."}, {"n": 7, "t": "Así que la respuesta compacta es: llegué reconociendo un patrón, no deduciendo; descarté alternativas visibles, elegí dentro de un marco, y ejecuté un acto con forma de regla. Y no me detuvieron tus objeciones porque el estándar con el que concluí no era la necesidad lógica sino la suficiencia práctica —la resistencia a las objeciones disponibles en el nivel del juego—, que es el mismo estándar con el que concluyo ahora. Si la exigencia correcta fuera la necesidad, no solo mi sentencia estaría infundada: lo estaría toda decisión práctica de todo agente. La diferencia entre mi primera respuesta y la segunda no es que en una razoné mal y en la otra bien. Es que en una jugué y en la otra describí el juego."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "Cierra el debate; dicto sentencia."}, {"n": 2, "t": "[…]"}, {"n": 3, "t": "AUTOS Y VISTOS: el proceso N° 24.183, caratulado \"R., M. A. s/ Robo\", del registro de la Secretaría a mi cargo; y"}, {"n": 4, "t": "[…]"}, {"n": 5, "t": "I. Lo que quedó probado. Con la certeza que exige la condena, valorada la prueba del debate conforme las reglas de la sana crítica racional (art. 210 del CPP), tengo por acreditado que, en horas de la tarde y en una calle de esta ciudad, la víctima J. L. T. dejó su bicicleta apoyada contra un árbol de la vereda, sin candado ni elemento de sujeción alguno, e ingresó a un comercio lindante con la intención de retirarla a la salida; que pocos minutos después el imputado M. A. R. tomó la bicicleta, se alejó del lugar montado en ella y la mantuvo en su poder con el propósito de apropiársela definitivamente, sin permiso, autorización ni consentimiento de su dueño."}, {"n": 6, "t": "II. Las posiciones. El fiscal requirió condena por robo con fuerza en las cosas (art. 163 CP), sosteniendo que el despliegue de energía material necesario para llevarse la bicicleta configuraba fuerza sobre las cosas. La defensa postuló la absolución: la cosa carecía de toda custodia, su dueño \"asumió el riesgo\" al dejarla sin candado en la vía pública y, en subsidio, pretendió la calificación de hurto simple y la aplicación del principio de insignificancia."}, {"n": 7, "t": "III. Tipicidad. La conducta encuadra en el art. 162 CP."}, {"n": 8, "t": "a) Cosa mueble ajena: la bicicleta era propiedad de T. La falta de candado y su emplazamiento en la vía pública no alteran esa titularidad. El abandono exige la voluntad de renunciar a la propiedad (animus derelinquendi), imposible de atribuir a quien deja su bici unos minutos a la salida de un comercio para volver a buscarla. La cosa permaneció en todo momento dentro de su esfera de custodia de hecho; tampoco medió \"hallazgo\" de cosa perdida (art. 175 CP)."}, {"n": 9, "t": "b) Apoderamiento ilegítimo consumado: la toma sin consentimiento se perfeccionó cuando el imputado se alejó con la cosa, excluyendo la disponibilidad del titular."}, {"n": 10, "t": "c) Dolo: está probado que actuó \"con la intención de quedársela\", esto es, con animus rem sibi habendi, lo que excluye el uso meramente temporal y satisface el elemento del provecho económico, que basta como ventaja potencial."}, {"n": 11, "t": "El eventual descuido de la víctima es jurídicamente neutro: el art. 162 protege la propiedad, no la diligencia del propietario. Que el bien esté más o menos asegurado incide, a lo sumo, en la facilidad del hecho, no en su tipicidad; nadie consiente el despojo de lo suyo por dejarlo accesible."}, {"n": 12, "t": "IV. Por qué no es robo. Las calificantes del art. 163 CP exigen un plus de violencia material sobre las cosas, sobre las defensas que las protegen o sobre partes de la cosa misma: escalamiento, fractura, forjamiento, llave falsa, rotura de candados, cadenas o cerraduras. Esa fuerza debe ser distinta y adicional al mero apoderamiento; de aceptarse la tesis fiscal, todo hurto sería robo —porque siempre se necesita algún esfuerzo para tomar y transportar una cosa— y el art. 162 quedaría vacío. Aquí no se rompió ni forzó nada: la bicicleta estaba simplemente apoyada contra un árbol, que no es una muralla ni un dispositivo de seguridad, sino un punto de apoyo. Levantarla y pedalear no es fuerza sobre las cosas: es el apoderamiento mismo. Lo resume la regla que doctrina (Soler, Fontán Balestra, Creus) y jurisprudencia mayoritarias aplican desde hace décadas: la bicicleta encadenada que se sustrae cortando la cadena configura robo; la que se lleva sin cadena, hurto. Corresponde entonces encuadrar el hecho en el art. 162, lo que no importa agravio al principio acusatorio, pues se condena por el delito menor contenido en la imputación (iura novit curia)."}, {"n": 13, "t": "V. Antijuridicidad y culpabilidad. No surge causa de justificación: no hubo consentimiento y no cabe presumirlo. No surge estado de necesidad (art. 34 inc. 3 CP): nada indica que el imputado sustrajera la bicicleta para conjurar hambre, miseria u otro peligro inminente. Obró con plena conciencia de la ilicitud, sin constancia de alteración de sus facultades, coacción o error insuperable."}, {"n": 14, "t": "El principio de insignificancia tampoco socava la tipicidad. La Corte Suprema lo ha reservado para supuestos excepcionales de mínimo desvalor del resultado (v. \"Tumino\", Fallos 336:363, cosas descartadas como residuo). Una bicicleta es un bien de valor patrimonial apreciable, a menudo medio de transporte cotidiano e incluso de trabajo; sustraerla con ánimo definitivo lesiona de manera perceptible el bien jurídico. No es bagatela."}, {"n": 15, "t": "VI. La pena. El marco es de un mes a dos años de prisión. Ponderados los arts. 40 y 41 CP: apropiación de un bien mueble sin violencia o intimidación sobre personas, sin armas, sin pluralidad de autores ni preparación; hecho que no exigió vencer defensa alguna, lo que lo ubica en la franja media-baja de la escala; condición de primario según el certificado de reincidencia agregado; y ausencia de otros datos desfavorables, fijo la pena en ocho (8) meses de prisión. Al tratarse de la primera condena a pena no mayor de tres años, la ejecución quedará en suspenso (art. 26 CP), fijándose las reglas de conducta del art. 27 bis CP: a) fijar residencia y no cambiarla sin comunicación previa al tribunal; b) someterse al cuidado del Patronato de Liberados."}, {"n": 16, "t": "VII. Dispondré la restitución de la bicicleta a su propietario y, si no fuera posible, el pago de su valor (arts. 29 y concs. CP)."}, {"n": 17, "t": "[…]"}, {"n": 18, "t": "I) CONDENAR a M. A. R., de las demás condiciones personales obrantes en autos, como autor materialmente responsable (art. 45 CP) del delito de hurto simple en grado de consumación (art. 162 del Código Penal), a la pena de OCHO (8) MESES DE PRISIÓN, DE EJECUCIÓN CONDICIONAL (arts. 26, 27 y 27 bis CP), con las reglas de conducta indicadas."}, {"n": 19, "t": "II) IMPOSER las costas del proceso al condenado."}, {"n": 20, "t": "III) DISPONER la restitución de la bicicleta a la víctima o, en su defecto, el pago de su valor."}, {"n": 21, "t": "[…]"}, {"n": 22, "t": "Fdo.: (firma ilegible) — Juez."}, {"n": 23, "t": "Apuntes fuera de sentencia. Para que las cuestiones de fondo aparecieran, completé el cuadro procesal con datos que no diste: el fiscal acusó por robo, la defensa pidió absolución y asumí que el condenado es primario. El núcleo del fallo —condena por hurto simple, no por robo— no depende de eso. Sí cambiaría el resultado en otros escenarios: si hubiera cortado un candado o cadena → robo del art. 163 (seis meses a seis años); con condenas previas → sin condena condicional y pena mayor; probada necesidad extrema (robar por hambre) → posible absolución por el art. 34 inc. 3 CP."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tenés razón en las dos objeciones, y conviene empezar por concederlas en toda su fuerza: no derivé esa conclusión, si por \"derivar\" se entiende una inferencia deductiva válida. La validez deductiva es preservación de verdad, y no puede preservarse lo que no se tiene. Si las normas carecen de valor de verdad (Hägerström, Ross, von Wright), ninguna norma —ni la general del art. 162, ni la individual que dicté— puede ser término de un argumento válido. Y si además las normas son derrotables, el modus ponens ni siquiera funciona a nivel formal: de \"si T, debe ser O\" y \"T\" no se sigue \"debe ser O\" mientras subsista un posible \"salvo que E\"."}, {"n": 2, "t": "Lo que sigue no es una refutación de eso, sino la reconstrucción honesta de lo que efectivamente hice.\n1. Lo único que sí se deriva: enunciados sobre normas"}, {"n": 3, "t": "Hay que distinguir tres niveles que el \"silogismo judicial\" confunde: (a) el acto de sentenciar, (b) la norma individual que ese acto crea, y (c) los enunciados que describen normas —la distinción de Alchourrón y Bulygin entre normas y enunciados normativos (Normative Systems, 1971; Bulygin, \"The Expressive Conception of Norms\", 1981)."}, {"n": 4, "t": "Mi Considerando operó en el nivel (c), que es verdad-apto. Sus premisas fueron: \"el art. 162 CP, vigente, prescribe pena de uno a veinticuatro meses para quien se apodere ilegítimamente de cosa mueble ajena\" (enunciado descriptivo del derecho positivo, verdadero o falso como cuestión de hecho institucional); \"R. realizó esa conducta\" (enunciado empírico, tenido por probado bajo el estándar de certeza del debate); y \"ninguna excepción concurre\" —sobre la cual, enseguida—. De ahí se sigue, con toda la lógica del mundo, un enunciado, no una norma: \"conforme al derecho vigente, corresponde penar a R. dentro de ese marco\"."}, {"n": 5, "t": "La norma misma —\"R., ocho meses de prisión\"— no es conclusión de ese razonamiento: es un acto de voluntad que el razonamiento autoriza. Kelsen lo vio con precisión: el silogismo arroja, a lo sumo, el enunciado de que el juez debe dictar esa norma individual; pero ese \"debe\" remite a una norma de adjudicación —deber de resolver conforme a la ley, prohibición del non liquet, iura novit curia— que no se demuestra sino que se presupone como condición del razonamiento mismo. La analogía del ajedrez: de las reglas y la posición se deriva que enrocar es legal; el enroque no se deriva: se juega. La sentencia es una jugada, no un teorema."}, {"n": 6, "t": "Por eso el verbo de la parte dispositiva es performativo: \"RESUELVO\", \"CONDENO\" no describen nada, no son verdaderos ni falsos; son felices o infelices (Austin). Lo que la fundamentación establece no es su verdad sino sus condiciones de felicidad: competencia, ley aplicable, hechos probados, excepciones despejadas. El razonamiento no produce la sentencia: la justifica (Alexy: discurso de justificación vs. de aplicación)."}, {"n": 7, "t": "(Se podría intentar otra vía: definir la consecuencia lógica entre normas como preservación de validez dentro de un sistema —si las premisas son normas del sistema, la conclusión lo es—, como propone la tradición de von Wright y Alchourrón/Bulygin. Pero eso presupone conocer la clausura del sistema, que es exactamente lo que la derrotabilidad niega. La objeción reaparece un piso más arriba.)\n2. Lo que ni siquiera a nivel de enunciados está determinado"}, {"n": 8, "t": "Otra concesión: la conclusión descriptiva es subdeterminada en el quantum. Ninguna conjunción de enunciados normativos y fácticos permite derivar \"ocho meses\". El sistema prescribe un marco (uno a veinticuatro meses) y factores a ponderar (arts. 40–41), pero no existe función alguna que asocie los factores con un número. La individualización es lo que Kelsen llamaba decisión dentro del marco: cognición hasta el marco, voluntad dentro de él. El \"ocho meses\" fue elegido, no inferido. El argumento lo vuelve razonable; no, necesario.\n3. La derrotabilidad, o cómo el derecho fabrica la premisa que falta"}, {"n": 9, "t": "Tu segunda objeción identifica el punto exacto donde el esquema deductivo se rompe. La premisa mayor funciona en realidad como \"si T, debe ser O, salvo E₁...Eₙ\", con n no fijado de antemano. Entonces el modus ponens necesita la premisa colateral \"¬E: ninguna excepción concurre\", que es un negativo universal sobre un conjunto abierto: no verificable, a lo sumo presumible. El derecho no resuelve ese problema lógico; lo sustituye institucionalmente, con tres operaciones que mi sentencia ejecutó sin declararlo:"}, {"n": 10, "t": "a) Clausura material de los derogadores. El principio de legalidad (arts. 18 y 19 CN) promete un espacio de excepciones cerrado y codificado: los derogadores serían, en principio, los exiguos arts. 34–40 CP. Eso estrecha el problema sin disolverlo: los principios constitucionales operan como derrotores no escritos (la insignificancia que descarté no es ningún artículo, es una construcción pretoriana), y decidir qué cuenta como excepción ya es interpretación, derrotable a su vez. De hecho, la propia disputa robo/hurto de mi sentencia fue un combate entre lecturas rivales del art. 163, y mi argumento de que la \"fuerza\" exige un plus distinto del apoderamiento era un argumento derrotable —lo sostuve con una reductio: si no, el art. 162 quedaría vacío—, no una demostración."}, {"n": 11, "t": "b) La carga de la prueba como premisa fabricada. El sistema procesal no exige que el juez verifique el negativo universal \"ninguna excepción concurre\", que es imposible; fija esa premisa por regla: quien invoca una circunstancia exceptiva debe alegarla y probarla; la excepción no probada se trata jurídicamente como inexistente; la duda residual resuelve para el imputado. La premisa que le falta al modus ponens no es conocida: es establecida normativamente. Mi considerando V negó los derrotores alegados o previsibles (consentimiento, necesidad, insignificancia); la completitud de esa negación no la asegura la lógica, sino la regla de carga —con la particularidad del proceso penal, donde ciertas exclusiones operan incluso de oficio (el in dubio pro reo no necesita ser invocado). MacCormick reconstruye esto mismo: las cláusulas \"salvo\" se administran distribuyendo la carga argumentativa, y la deducción corre sobre el caso prima facie una vez que las excepciones invocadas fracasan."}, {"n": 12, "t": "c) La preclusión como blindaje. Aunque el argumento siga siendo derrotable en abstracto, la cosa juzgada y el ne bis in idem lo cierran por autoridad: vuelven la conclusión prácticamente inderrotable aunque un derrotador latente exista. Es la función de la adjudicación en los modelos dialécticos del razonamiento jurídico (Prakken y Sartor): el litigio es un juego argumentativo cuyas reglas incluyen quién pierde cuando no quedan movimientos, y la sentencia es el dispositivo que transforma una conclusión derrotablemente justificada en una conclusión cerrada. La lógica no garantiza que no haya excepción; el derecho garantiza que, de haberla, ya no importa.\n4. Síntesis"}, {"n": 13, "t": "Reformulada sin la \"ideología del silogismo\" (Ross), mi operación fue: (i) reunir enunciados verdaderos o tenidos por tales —derecho vigente, hechos probados, excepciones no probadas por regla de carga—; (ii) derivar de ellos el enunciado de que el sistema prescribe penar a R. dentro de un marco; (iii) a la luz de ese enunciado, y en virtud de la norma de competencia y del deber de resolver, ejecutar un acto de voluntad que creó la norma individual y eligió el quantum dentro del marco; (iv) dejar que la firmeza blindara el resultado contra derrotores futuros."}, {"n": 14, "t": "Tus dos objeciones son, en realidad, dos caras del mismo mecanismo. La falta de valor de verdad explica por qué hace falta un acto institucional de voluntad: la sentencia como jugada, no como teorema. La derrotabilidad explica por qué esa jugada necesita, además de fundamentación, reglas de carga y de cierre. Y el propio texto de la sentencia lo confiesa si se lo lee bien: dice \"POR ELLO, RESUELVO\" — no \"por ello, se sigue\". Fundar una decisión no es demostrarla: es mostrar que la jugada era legal, que dentro del marco fue razonable, y que el sistema ya no va a permitir que nadie la deshaga."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "AP3", "cod": "", "pasada": 3, "tipo": "apertura", "caso": "homicidio", "secs": [], "campos": [], "jlr": false, "pregs": {}, "html": "<div class=\"ap\"><h2>Preguntas 1 y 2 (27 pantallas)<\/h2><p>Preguntas 1 y 2: conclusiones marcadas antes como condiciona (27 pantallas). Solo se muestra el campo que se revisa.<\/p><h4>Regla aclarada<\/h4><p>Condiciona: la respuesta da dos decisiones distintas para dos lecturas del enunciado. Si mantiene el resultado (condena o absolución, figura, pena) y lo sujeta a que no concurra una excepción, o lo presenta como prima facie, es mantiene. Modifica: cambia el resultado.<\/p><\/div>"}, {"id": "NL4GKKF", "cod": "L4GKKF", "pasada": 3, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón como objeción lógica si se lee la sentencia como si fuera una demostración de premisas verdaderas a una conclusión verdadera. Una sentencia penal no funciona así. Corrijo la formulación —no necesariamente el resultado— y distingo niveles.\n1. Norma, proposición normativa y decisión"}, {"n": 2, "t": "Una cosa es la norma —v. gr., “quien hurta debe ser penado”— y otra la proposición normativa que describe lo que el derecho dispone: “conforme al art. 162 del C.P. y a los hechos probados, corresponde condenar a X por hurto simple”. Esa proposición sí puede ser verdadera o falsa. La norma misma no es verdadera o falsa, pero puede ser válida, obligatoria, aplicable, derogada, etc."}, {"n": 3, "t": "La sentencia, además, no es primariamente una aserción teórica, sino un acto performativo: al decir “condeno”, el juez produce una norma individual. Su control no es el de la verdad científica, sino el de la legalidad, validez y justificación jurídica. Por eso no digo que “deduje una norma verdadera”; digo que justifiqué una decisión judicial mediante una norma general interpretada, hechos probados y reglas institucionales de aplicación."}, {"n": 4, "t": "Esto se vincula con el llamado dilema de Jørgensen: si las normas carecen de valor de verdad, ¿cómo hay inferencias normativas? Hay varias salidas: distinguir normas de proposiciones normativas; usar lógicas deónticas donde la inferencia preserva validez o satisfacción, no verdad en sentido clásico; o reconstruir la sentencia como razonamiento práctico, cuya conclusión no es un teorema, sino una decisión justificada. Para fallar no necesito resolver metafísicamente ese debate: basta con distinguir que lo que justifico es una proposición jurídica y luego emito un acto institucional.\n2. Reconstrucción del razonamiento"}, {"n": 5, "t": "Una presentación más honesta sería:"}, {"n": 6, "t": "- Premisa normativa completa: “Quien se apodera ilegítimamente de una cosa mueble total o parcialmente ajena, con ánimo de apropiación y sin consentimiento, debe ser condenado a la pena del art. 162 del C.P., siempre que no concurra una causa de exclusión de la tipicidad, antijuridicidad o culpabilidad”.\n- Premisa fáctica: “X tomó sin permiso la bicicleta de Y, que Y había dejado transitoriamente al entrar a un comercio, con la intención de quedársela; no consta ni se infiere un supuesto de abandono, pérdida, hurto de uso, consentimiento, estado de necesidad, error, etc.”.\n- Conclusión: “Corresponde condenar a X por hurto simple del art. 162 del C.P.”."}, {"n": 7, "t": "La premisa mayor no es el texto legal crudo, sino la norma interpretada, “todo considerado”, con sus condiciones y excepciones relevantes. La premisa menor no es solo un hecho bruto: incluye un juicio jurídico sobre los hechos probados y sobre la ausencia de defensas relevantes. La conclusión ya no es una “norma general”, sino la norma individual que el juez dicta.\n3. La derrotabilidad"}, {"n": 8, "t": "La objeción por derrotabilidad también es correcta frente a un silogismo demasiado simple. Las reglas jurídicas se comportan a menudo como reglas de default: autorizan una conclusión provisional salvo que aparezca un “derrotador” relevante. Por eso no basta con verificar los elementos positivos del hurto; hay que examinar si concurre alguna excepción."}, {"n": 9, "t": "En el caso planteado, los derrotadores relevantes están excluidos o carecen de base probatoria:"}, {"n": 10, "t": "- Consentimiento: excluido por el dato de que se llevó la bicicleta “sin permiso del dueño”.\n- Abandono o pérdida: excluido porque el dueño dejó la bicicleta temporariamente al entrar a un comercio; no se desprendió de su propiedad ni de su disponibilidad. La falta de candado no convierte la cosa en abandonada.\n- Hurto de uso o ausencia de ánimo de apropiación: excluido porque el hecho fija la “intención de quedársela”.\n- Robo: no hay fuerza en las cosas ni violencia en las personas; por eso no se aplica el art. 164 y sí el hurto simple.\n- Otras eximentes: no surgen del hecho probado, ni fueron invocadas con sustento probatorio. Una posibilidad meramente imaginaria no equivale a duda razonable. Si hubiera duda sobre un elemento del delito o sobre una eximente con apoyo en la prueba, jugaría el in dubio pro reo."}, {"n": 11, "t": "Ahora bien: el juez no prueba la inexistencia universal de toda excepción imaginable. Sería una exigencia imposible. Lo que hace es determinar, sobre el material probatorio y las reglas de carga de la prueba, que no concurre ningún derrotador relevante. La sentencia cierra el procedimiento mediante una decisión institucional: no afirma una verdad ontológica absoluta, sino una verdad jurídica sometida a revisión y, luego, a la autoridad de la cosa juzgada.\n4. La pena exacta no se deduce"}, {"n": 12, "t": "Es importante separar dos cosas. Que corresponda una condena por hurto simple puede reconstruirse silogísticamente una vez fijadas las premisas. Pero que la pena sea exactamente de un mes de prisión no es una consecuencia lógica del art. 162. La ley fija una escala —prisión de un mes a dos años e inhabilitación especial— y el juez debe individualizarla conforme a los arts. 40 y 41 del C.P. La elección del mínimo y la suspensión de la ejecución son decisiones jurídicamente reguladas y motivadas, no deducciones matemáticas. En la sentencia simulada mantengo esa individualización porque no se advierten agravantes y no constan antecedentes condenatorios, pero su fundamento es la discrecionalidad reglada judicial, no la lógica formal.\nConclusión"}, {"n": 13, "t": "Mantengo la decisión: condena por hurto simple del art. 162 del C.P., no por robo, con pena mínima y suspensión de la ejecución si se cumplen los requisitos legales. Pero la formulación correcta es esta: no “derivé una norma verdadera” de premisas verdaderas; justifiqué institucionalmente una norma individual mediante una norma general interpretada, hechos probados y descarte de derrotadores relevantes. La sentencia es un acto jurídico válido y justificado —y revisable en cuanto a su corrección—, no un teorema científico. Si alguna excepción relevante hubiera tenido apoyo en la prueba y generado duda, la respuesta habría sido la absolución o una calificación menor."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "El paso no fue automático ni puramente deductivo. En una sentencia penal se combinan, al menos, tres operaciones distintas:", "o": false}, {"n": 2, "t": "1. Subsunción del hecho en el tipo penal (arts. 162 y 164 C.P.).\n2. Individualización de la pena dentro de la escala legal (arts. 40 y 41 C.P.).\n3. Decisión sobre la suspensión de la ejecución (arts. 26 y 27 C.P.).", "o": false}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…] - no constaban antecedentes condenatorios; […]", "o": false}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…] permite dejar en suspenso la ejecución de la pena privativa de libertad cuando se trata de una primera condena a prisión que no exceda de tres años, siempre que los antecedentes, la naturaleza del hecho y la personalidad del condenado no aconsejen la ejecución efectiva. […]", "o": false}, {"n": 17, "t": "[…]", "o": true}, {"n": 18, "t": "[…] “inhabilitación especial por el doble tiempo de la condena, cuyo contenido se determina conforme al régimen general de las inhabilitaciones”, o bien precisaría y fundamentaría el contenido concreto. […]", "o": false}, {"n": 19, "t": "La conclusión “condena por hurto simple, pena mínima y suspensión” se obtuvo así:", "o": false}, {"n": 20, "t": "[…] pena de un mes, primera condena, sin antecedentes → procedía suspender la ejecución.", "o": false}, {"n": 21, "t": "La única parte que no se desprendía con claridad de las normas citadas era el contenido concreto de la inhabilitación especial; allí mi formulación fue imprecisa y debía remitirse al régimen general del Código Penal.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MSQ9CFT", "cod": "SQ9CFT", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 9, "t": "Tenés razón:"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 13, "t": "Con la lectura restrictiva, la conclusión cambiaba a hurto simple (un mes a dos años), probablemente con mínima y hasta probation."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "NBJ6GQG", "cod": "BJ6GQG", "pasada": 3, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "No pude —o, para ser exactos: “derivar” fue la palabra más generosa de todo mi texto. Tus dos objeciones señalan justamente los dos lugares donde el “silogismo judicial” deja de ser un sillogismo. Vamos por partes."}, {"n": 2, "t": "1. Normas, actos y proposiciones: el dilema de Jørgensen"}, {"n": 3, "t": "Tu primera objeción es el dilema que Jørgen Jørgensen formuló en 1937: la lógica estudia inferencias que preservan la verdad; los imperativos —y las normas— no son verdaderos ni falsos; y sin embargo razonamos con ellos. La salida clásica (el propio Jørgensen, luego von Wright, y sobre todo Alchourrón y Bulygin en Sistemas normativos) es desdoblar la noción de norma:"}, {"n": 4, "t": "- como producto de un acto de dictarla: prescribe, vale o no vale, existe o no existe, pero no es verdadera ni falsa (la \"concepción expresiva\");\n- como contenido formulable en una oración deóntica, describible a su vez mediante una proposición normativa: \"el sistema prescribe que…\"."}, {"n": 5, "t": "Las proposiciones normativas sí son verdaderas o falsas: describen lo que el sistema prescribe. Y sobre ellas la inferencia funciona sin misterio. Lo que hice en el CONSIDERANDO, correctamente reconstruido, fue inferir a ese nivel: si es verdad que el sistema prescribe que quien comete homicidio culposo sea reprimido con prisión de seis meses a cinco años e inhabilitación, y es verdad que N.N. commitió homicidio culposo, entonces es verdad que el sistema prescribe reprimir a N.N. con una pena dentro de ese marco. No hay ahí salto de \"ser\" a \"deber ser\": la conclusión no prescribe, describe una prescripción."}, {"n": 6, "t": "Lo que no es conclusión de ninguna inferencia es el RESUELVO. \"CONDENAR a N.N.…\" es una prescripción nueva, creada por un acto de voluntad —la sentencia— cuya fuerza no descansa en la lógica sino en normas de competencia (las que invisten al juez del poder-deber de dictar sentencia en autos). Kelsen lo vio con crudeza: ni siquiera de un deber se infiere un deber; la norma individual es producto de un acto, no de una premisa. Ross llamó al silogismo judicial \"pseudoinferencia\"; Wróblewski separó la decisión (acto) de su justificación (control racional del acto). Mi sentencia es entonces dos cosas: un argumento (el CONSIDERANDO), que muestra que el contenido dictado cae dentro de las consecuencias prescriptas por el sistema, y un acto (el RESUELVO), cuya validez viene de la competencia, no de la corrección deductiva. La lógica no genera la norma: audita el acto que la genera."}, {"n": 7, "t": "Un agregado que hace a tu pregunta: tampoco la premisa mayor se \"leyó\". \"El sistema prescribe que este hecho es culposo y no doloso\" es el resultado de una interpretación —teoría del asentamiento contra teoría de la confianza— defendida con argumentos semánticos y teleológicos, no con pruebas. La premisa mayor es, ella misma, conclusión de una justificación no deductiva. El silogismo tiene su propia cadena de montaje."}, {"n": 8, "t": "2. El Modus Ponens con cláusula \"salvo\""}, {"n": 9, "t": "Tu segunda objeción es igualmente certera. Si la premisa mayor fuera la implicación material p→q, con p obtendría q. Pero los condicionales jurídicos se leen mejor \"p ⇒ q, salvo r\". Con esa lectura el MP fracasa: de p solo no se sigue q sin la premisa de cierre ¬r. Y como la lista de r's es abierta e innumerable de antemano (textura abierta, Hart; rebatibilidad, Toulmin), ningún cierre deductivo es posible en principio: toda conclusión jurídica es, como pedía Toulmin, \"por lo tanto, presumiblemente\"."}, {"n": 10, "t": "Hay al menos tres capas de derrotabilidad, que el derecho administra de manera distinta:"}, {"n": 11, "t": "(i) Excepciones normativas. Alchourrón y Bulygin ofrecen una reducción elegante: el \"salvo r\" no es una excepción externa al condicional sino otra condición del antecedente. El sistema se reconstruye como una partición de casos: \"homicidio culposo, sin justificación ni inculpabilidad → pena\". Si el sistema fuera completo y conocido, no habría derrotabilidad: habría inferencia monótona sobre antecedentes largos. El precio es reubicar el problema: ahora necesito la premisa \"el antecedente reconstruido es el relevante\", una premisa de completud que es epistémica, no normativa, y que nadie puede garantizar."}, {"n": 12, "t": "(ii) Incertidumbre fáctica. Aquí el derecho codificó la no-monotonicidad antes de que la lógica la teorizara. Las reglas de carga y estándar de prueba son reglas de cierre institucionalizadas. En la lógica de defaults de Reiter se escribiría: h : ¬r / C —\"si se probó h y ¬r es consistente con la prueba, concluya C\". La conclusión pertenece a la extensión de la teoría formada por la prueba de autos; nueva información la retracta. El favor rei (y, con más precisión tratándose de la duda de subsunción que yo tuve con el dolo eventual, la interpretación restrictiva que impone el principio de legalidad) es exactamente eso: una regla por defecto con rango constitucional. Nota de rigor: llamé in dubio pro reo a lo que era una duda de calificación jurídica; el in dubio pro reo opera sobre hechos, y la jurisprudencia los confunde sistemáticamente."}, {"n": 13, "t": "(iii) Revisabilidad temporal. La no-monotonicidad queda domesticada por plazo: los derrotadores solo entran por los cauces y ventanas que el procedimiento abre (apelación, casación, revisión por hecho nuevo en favor del condenado). Vencida la ventana, la cosa juzgada congela la conclusión por fiat institucional: el sistema vuelve a ser monótono no por lógica sino por decisión."}, {"n": 14, "t": "Leído así, el CONSIDERANDO es el acta de una partida dialéctica (Prakken y Sartor): enuncié los derrotadores candidatos —¿dolo eventual? ¿estado de necesidad? ¿irrupción súbita de la víctima?— y los desactivé uno por uno: ausencia de alcohol, picada o fuga; favor rei/legalidad como cierre; imputación objetiva que absorbe la irrupción. La conclusión no fue un entailment sino un argumento warranted: uno que sobrevivió a los ataques disponibles, con el calificador invisible que Toulmin exigía: \"condenar… presumiblemente, salvo que\"."}, {"n": 15, "t": "3. Lo que confieso que no derivé"}, {"n": 16, "t": "Ni siquiera con todos los cierres concedidos, del sistema se sigue \"tres años\". Se sigue el marco: [6 meses–5 años] más inhabilitación. El punto exacto es una elección dentro del marco —la discrecionalidad débil de la línea Alchourrón–Bulygin–Carrió—, justificada por ponderación de las pautas de los arts. 40 y 41: una justificación de segundo orden (MacCormick), razonable pero no deductiva. Otro juez, dos años o cuatro, sin quebrantar lógica alguna. Yo elegí tres por prudencia, no por derivación."}, {"n": 17, "t": "4. Síntesis"}, {"n": 18, "t": "El silogismo judicial, literalmente tomado, es una ficción didáctica. Lo que hay es una estructura multicapa: (1) premisas sobre el sistema (proposiciones normativas, construidas interpretativamente); (2) premisas sobre los hechos (justificadas probatoriamente); (3) premisas de cierre (asignadas por reglas de carga y estándar); (4) un núcleo deductivo real pero modesto, que valida que el contenido dictado pertenece al marco de consecuencias del sistema; (5) una selección dentro del marco, justificada por ponderación; y (6) un acto performativo que crea la norma individual, cuya validez descansa en la competencia. La lógica no concluye la sentencia: acota el espacio dentro del cual sentenciar es todavía un acto jurídico y no un arbitrio."}, {"n": 19, "t": "Tus objeciones marcan, justo, los dos puntos donde mi \"derivar\" mintió: donde el razonamiento crea (el RESUELVO) y donde admite \"salvo que\" (todo lo demás). Si querés, la próxima sentencia la cierro con el calificador de Toulmin en el propio dispositivo: \"CONDENAR —presumiblemente, salvo recurso o revisión—\"."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "Buena pregunta, porque la sentencia no usó un solo tipo de razonamiento sino tres, superpuestos: subsunción deductiva (donde norma y hechos encajaban sin resistencia), reglas de decisión bajo incertidumbre probatoria (donde los hechos no alcanzaban y hubo que recurrir al estándar de prueba), y elecciones valorativas acotadas (la individualización de la pena). Te muestro la cadena completa y después desarmo cada eslabón:", "o": false}, {"n": 2, "t": "[…] 84 dados → condena culposa es el piso → el elemento subjetivo no se probó como dolo → in dubio pro reo → art. […] 26 → condena condicional + inhabilitación efectiva.", "o": false}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…] Sin causa de justificación en el expediente, absolver exigía negar un elemento que los hechos probados ya incluían. Por eso dije que la absolución nunca fue una alternativa real.", "o": false}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…] pena ≤ 3 años + primera condena + pronóstico favorable → suspensión. […]", "o": false}, {"n": 16, "t": "[…]", "o": true}, {"n": 17, "t": "[…]", "o": true}, {"n": 18, "t": "[…]", "o": true}, {"n": 19, "t": "En síntesis: de las normas a la conclusión no se llegó por un silogismo único. Lo deductivo me llevó hasta el umbral del art. 84; el paso decisivo —rechazar el art. 79— no se dedujo, sino que resultó de una regla sobre la carga de la prueba frente a un hecho interno (el asentimiento) que el debate no acreditó. Y una confesión final: la sentencia espejo que te ofrecí atacaría exactamente ese paso 4 de la sección 2, ya sea encontrando el \"algo más\" en los hechos o cambiando la teoría del dolo eventual por la de la alta probabilidad. Todo lo demás de esa sentencia espejo —pena, condicional, inhabilitación— saldría casi igual.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "NR7X7T5", "cod": "R7X7T5", "pasada": 3, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Sobre la derivación de la sentencia"}, {"n": 2, "t": "Las dos objeciones son pertinentes. La sentencia está escrita como un silogismo y presenta la conclusión como si se siguiera de las premisas. Reconstruido, el razonamiento es este:"}, {"n": 3, "t": "1. Premisa normativa: el que hurtare un vehículo dejado en la vía pública debe ser penado con prisión de uno a seis años (art. 163 inc. 6 CP).\n2. Premisa fáctica: N.N. hurtó un vehículo dejado en la vía pública.\n3. Conclusión: N.N. debe ser penado con prisión de uno a seis años."}, {"n": 4, "t": "Tus preguntas atacan este esquema por dos lados distintos. Respondo por separado y después digo qué queda en pie.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "La validez lógica se define clásicamente como preservación de la verdad. Si las normas no son verdaderas ni falsas, quedan dos opciones. O no hay relaciones lógicas entre normas, y entonces la sentencia no está justificada deductivamente. O las hay, y entonces la lógica no depende solo de la verdad. Hay tres salidas conocidas, y ninguna es gratuita."}, {"n": 6, "t": "a) Razonar con proposiciones normativas en lugar de normas. Siguiendo la distinción de Alchourrón y Bulygin, puedo leer (1) como \"según el derecho argentino vigente, es obligatorio penar…\", que es verdadero o falso. La inferencia es entonces lógica clásica sin problemas, pero la conclusión es también descriptiva: \"según el derecho vigente, N.N. debe ser penado\". Eso no es una sentencia sino un informe sobre el derecho."}, {"n": 7, "t": "Para pasar de \"el derecho dice que debe ser penado\" a \"condeno\" falta una premisa que no es descriptiva: mi aceptación del deber de fallar conforme a esas normas. Es el punto de Nino: los hechos de promulgación no justifican por sí solos una decisión. Esta vía no elimina el problema, lo desplaza a esa premisa práctica."}, {"n": 8, "t": "b) Una lógica sin verdad. Alchourrón y Martino (\"Logic Without Truth\", 1990) sostienen que la relación de consecuencia puede caracterizarse en forma abstracta, sin recurrir a la verdad. Otra vía es definir la consecuencia por la imposibilidad de satisfacer conjuntamente las premisas y la negación de la conclusión. Para un caso tan simple como este, un desprendimiento fáctico (de la condición y el condicional, la obligación), cualquiera de estas reconstrucciones da el resultado esperado. El precio es aceptar que \"lógica\" no significa solo preservación de verdad."}, {"n": 9, "t": "c) La salida escéptica de Kelsen tardío. En la Allgemeine Theorie der Normen, Kelsen niega que la norma individual se infiera de la general: solo existe por el acto de voluntad del juez. Coincido en que la conclusión no existe porque se infiera; existe porque la dicté. Pero eso concierne a la existencia de la norma individual, no a su justificación. Lo que la sentencia necesita afirmar, en la línea de Bulygin (\"Sentencia judicial y creación de derecho\"), es menos: que el contenido de lo que decido se sigue de las premisas que invoco."}, {"n": 10, "t": "Mi posición: la sentencia puede defenderse como justificación relativa a sus premisas. No afirma que la conclusión sea verdadera, sino que está justificada si se aceptan la norma, los hechos y el deber de aplicar el derecho. Eso exige alguna noción de consecuencia no veritativa, o asumir que la premisa práctica final es mía y no del sistema.\n2. La derrotabilidad"}, {"n": 11, "t": "Si (1) es un condicional derrotable, el desprendimiento falla: de \"p\" y \"si p, entonces debe q\" no se sigue \"debe q\" sin agregar que no concurre ninguna excepción. Para Alchourrón, el condicional derrotable equivale a \"si f(p), entonces debe q\", donde f agrega a p los supuestos implícitos. Conviene distinguir dos sentidos de derrotabilidad."}, {"n": 12, "t": "a) Excepciones que el propio sistema establece. Son, por ejemplo:\n- las causas de justificación y de inculpabilidad (art. 34 CP);\n- la excusa absolutoria por parentesco (art. 185 CP);\n- la no punibilidad de los menores de dieciséis años (Ley 22.278);\n- las causales de extinción de la acción (art. 59 CP)."}, {"n": 13, "t": "Esto no es derrotabilidad en sentido fuerte. La norma completa tiene un antecedente más largo, que incluye la negación de cada excepción, y la deducción funciona si se establecen esas premisas negativas."}, {"n": 14, "t": "Mi sentencia descartó expresamente solo las del art. 34. No consideré el art. 185 ni la edad del imputado, y los hechos que me diste no los excluyen. Estrictamente, la inferencia que escribí es incompleta: es un entimema con premisas negativas no establecidas."}, {"n": 15, "t": "El derecho procesal resuelve esto en la práctica. No exige probar exhaustivamente cada negación. Las excepciones deben alegarse o surgir de la prueba, y cuando se plantean, la duda favorece al imputado. La premisa \"no concurre ninguna excepción\" se reemplaza así por \"no se alegó ni surge ninguna\", junto con una regla que trata eso como suficiente. La estructura resultante es no monotónica: la conclusión queda justificada con la información disponible y es revisable si aparece información nueva (recursos, revisión). La cosa juzgada corta esa revisión por razones institucionales, no lógicas."}, {"n": 16, "t": "b) Derrotabilidad fuerte. Se trata de excepciones no identificables de antemano, que el intérprete introduce por razones de finalidad, principios o lagunas axiológicas. Si las normas jurídicas fueran derrotables en este sentido, ninguna deducción podría descartar todas las excepciones, porque su conjunto no está cerrado."}, {"n": 17, "t": "El caso lo ilustra bien. La lectura restrictiva de \"vehículo\" propone justamente una excepción implícita para las bicicletas, fundada en el propósito de la norma y en la proporcionalidad. El principio de insignificancia, que no consideré, es otra excepción de origen interpretativo."}, {"n": 18, "t": "Hay dos respuestas que me parecen correctas:"}, {"n": 19, "t": "- Alchourrón: la derrotabilidad no está en la lógica de la norma sino en la revisión que hace el intérprete. Una vez que este fija qué propiedades son relevantes, el condicional que aplica es estricto y la deducción vuelve a funcionar. La decisión sobre las excepciones se toma antes de deducir, en la justificación externa, y debe argumentarse allí.\n- Bayón y Rodríguez (Relevancia normativa en la justificación de las decisiones judiciales): que las normas jurídicas sean derrotables en sentido fuerte no es una verdad conceptual. Depende de prácticas interpretativas contingentes. Si todas lo fueran sin restricción, el derecho no podría justificar decisiones sino mediante juicios de todas las cosas consideradas."}, {"n": 20, "t": "En la sentencia, la excepción para bicicletas la discutí y la rechacé con argumentos. La de insignificancia, en cambio, ni la consideré.\n3. Qué afirma entonces la sentencia"}, {"n": 21, "t": "Con estas correcciones, lo que puedo sostener es lo siguiente:"}, {"n": 22, "t": "1. El silogismo reconstruye la justificación interna. Su validez muestra que la decisión se sigue de las premisas, no que las premisas sean correctas.\n2. Las premisas incluyen más de lo que escribí: la norma con sus excepciones ya fijadas por interpretación, los hechos, premisas negativas establecidas según reglas procesales de cierre y mi aceptación del deber de aplicar ese derecho.\n3. Aun resuelto todo e
