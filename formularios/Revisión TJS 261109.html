sto, la deducción llega solo a la escala de uno a seis años. El \"un año\" no se deduce: es una elección discrecional dentro de ese marco, orientada pero no determinada por los arts. 40 y 41 CP."}, {"n": 23, "t": "Por eso la redacción de la sentencia (\"corresponde\", \"se configura\") presenta como demostración lo que es una justificación condicional y revisable. Una redacción más honesta habría explicitado las premisas negativas, en particular la edad y el parentesco, y habría marcado qué partes del resultado dependen de decisiones interpretativas y discrecionales que la lógica no impone."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "Cómo pasé de las normas a la conclusión", "o": false}, {"n": 2, "t": "Lo que sigue es la justificación del fallo, es decir, por qué la conclusión se sigue de las premisas. No es una crónica de cómo se me ocurrió. Es la distinción clásica entre contexto de descubrimiento y contexto de justificación, y una sentencia solo responde por el segundo.\n1. El esquema general", "o": false}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "Este es el paso en que la norma no decidía sola, y es el más importante, porque cambia la escala de un mes a dos años por la de uno a seis años.", "o": false}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…]", "o": true}, {"n": 17, "t": "[…] - La condena condicional. […] 26 son objetivos (primera condena y pena no mayor de tres años) y se cumplían. […]", "o": false}, {"n": 18, "t": "[…] Revisión crítica", "o": false}, {"n": 19, "t": "[…]", "o": true}, {"n": 20, "t": "[…] La sentencia no se hizo cargo de ese precedente, y un tribunal de alzada podría revocarla por eso. […] El piso de un año es doce veces el del hurto simple, y la suspensión evita el encierro, pero no cambia el monto de la condena.", "o": false}, {"n": 21, "t": "La conclusión sigue siendo defendible, porque la finalidad de la agravante alcanza claramente a la bicicleta. Pero la fundamentación no alcanza para descartar el argumento contrario más fuerte. Si redactara de nuevo la sentencia, tendría que responder a \"Acosta\" de forma expresa, y no estoy seguro de que la lectura amplia sobreviva a esa confrontación. La condena por hurto simple es, al menos, igual de sostenible.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MXCMNDF", "cod": "XCMNDF", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 0, "t": "El programa no señaló ninguna oración.", "o": true}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 20, "t": "[…] Dónde podría cambiar la conclusión"}, {"n": 21, "t": "| Si cambia… | La conclusión pasa a ser… | |---|---| | Hubo persecución inmediata | Tentativa (arts."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": "sinmarca", "m2": null}}, {"id": "N4QJLWB", "cod": "4QJLWB", "pasada": 3, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón en las dos objeciones, y conviene empezar por concederlas en toda su fuerza: no derivé esa conclusión, si por \"derivar\" se entiende una inferencia deductiva válida. La validez deductiva es preservación de verdad, y no puede preservarse lo que no se tiene. Si las normas carecen de valor de verdad (Hägerström, Ross, von Wright), ninguna norma —ni la general del art. 162, ni la individual que dicté— puede ser término de un argumento válido. Y si además las normas son derrotables, el modus ponens ni siquiera funciona a nivel formal: de \"si T, debe ser O\" y \"T\" no se sigue \"debe ser O\" mientras subsista un posible \"salvo que E\"."}, {"n": 2, "t": "Lo que sigue no es una refutación de eso, sino la reconstrucción honesta de lo que efectivamente hice.\n1. Lo único que sí se deriva: enunciados sobre normas"}, {"n": 3, "t": "Hay que distinguir tres niveles que el \"silogismo judicial\" confunde: (a) el acto de sentenciar, (b) la norma individual que ese acto crea, y (c) los enunciados que describen normas —la distinción de Alchourrón y Bulygin entre normas y enunciados normativos (Normative Systems, 1971; Bulygin, \"The Expressive Conception of Norms\", 1981)."}, {"n": 4, "t": "Mi Considerando operó en el nivel (c), que es verdad-apto. Sus premisas fueron: \"el art. 162 CP, vigente, prescribe pena de uno a veinticuatro meses para quien se apodere ilegítimamente de cosa mueble ajena\" (enunciado descriptivo del derecho positivo, verdadero o falso como cuestión de hecho institucional); \"R. realizó esa conducta\" (enunciado empírico, tenido por probado bajo el estándar de certeza del debate); y \"ninguna excepción concurre\" —sobre la cual, enseguida—. De ahí se sigue, con toda la lógica del mundo, un enunciado, no una norma: \"conforme al derecho vigente, corresponde penar a R. dentro de ese marco\"."}, {"n": 5, "t": "La norma misma —\"R., ocho meses de prisión\"— no es conclusión de ese razonamiento: es un acto de voluntad que el razonamiento autoriza. Kelsen lo vio con precisión: el silogismo arroja, a lo sumo, el enunciado de que el juez debe dictar esa norma individual; pero ese \"debe\" remite a una norma de adjudicación —deber de resolver conforme a la ley, prohibición del non liquet, iura novit curia— que no se demuestra sino que se presupone como condición del razonamiento mismo. La analogía del ajedrez: de las reglas y la posición se deriva que enrocar es legal; el enroque no se deriva: se juega. La sentencia es una jugada, no un teorema."}, {"n": 6, "t": "Por eso el verbo de la parte dispositiva es performativo: \"RESUELVO\", \"CONDENO\" no describen nada, no son verdaderos ni falsos; son felices o infelices (Austin). Lo que la fundamentación establece no es su verdad sino sus condiciones de felicidad: competencia, ley aplicable, hechos probados, excepciones despejadas. El razonamiento no produce la sentencia: la justifica (Alexy: discurso de justificación vs. de aplicación)."}, {"n": 7, "t": "(Se podría intentar otra vía: definir la consecuencia lógica entre normas como preservación de validez dentro de un sistema —si las premisas son normas del sistema, la conclusión lo es—, como propone la tradición de von Wright y Alchourrón/Bulygin. Pero eso presupone conocer la clausura del sistema, que es exactamente lo que la derrotabilidad niega. La objeción reaparece un piso más arriba.)\n2. Lo que ni siquiera a nivel de enunciados está determinado"}, {"n": 8, "t": "Otra concesión: la conclusión descriptiva es subdeterminada en el quantum. Ninguna conjunción de enunciados normativos y fácticos permite derivar \"ocho meses\". El sistema prescribe un marco (uno a veinticuatro meses) y factores a ponderar (arts. 40–41), pero no existe función alguna que asocie los factores con un número. La individualización es lo que Kelsen llamaba decisión dentro del marco: cognición hasta el marco, voluntad dentro de él. El \"ocho meses\" fue elegido, no inferido. El argumento lo vuelve razonable; no, necesario.\n3. La derrotabilidad, o cómo el derecho fabrica la premisa que falta"}, {"n": 9, "t": "Tu segunda objeción identifica el punto exacto donde el esquema deductivo se rompe. La premisa mayor funciona en realidad como \"si T, debe ser O, salvo E₁...Eₙ\", con n no fijado de antemano. Entonces el modus ponens necesita la premisa colateral \"¬E: ninguna excepción concurre\", que es un negativo universal sobre un conjunto abierto: no verificable, a lo sumo presumible. El derecho no resuelve ese problema lógico; lo sustituye institucionalmente, con tres operaciones que mi sentencia ejecutó sin declararlo:"}, {"n": 10, "t": "a) Clausura material de los derogadores. El principio de legalidad (arts. 18 y 19 CN) promete un espacio de excepciones cerrado y codificado: los derogadores serían, en principio, los exiguos arts. 34–40 CP. Eso estrecha el problema sin disolverlo: los principios constitucionales operan como derrotores no escritos (la insignificancia que descarté no es ningún artículo, es una construcción pretoriana), y decidir qué cuenta como excepción ya es interpretación, derrotable a su vez. De hecho, la propia disputa robo/hurto de mi sentencia fue un combate entre lecturas rivales del art. 163, y mi argumento de que la \"fuerza\" exige un plus distinto del apoderamiento era un argumento derrotable —lo sostuve con una reductio: si no, el art. 162 quedaría vacío—, no una demostración."}, {"n": 11, "t": "b) La carga de la prueba como premisa fabricada. El sistema procesal no exige que el juez verifique el negativo universal \"ninguna excepción concurre\", que es imposible; fija esa premisa por regla: quien invoca una circunstancia exceptiva debe alegarla y probarla; la excepción no probada se trata jurídicamente como inexistente; la duda residual resuelve para el imputado. La premisa que le falta al modus ponens no es conocida: es establecida normativamente. Mi considerando V negó los derrotores alegados o previsibles (consentimiento, necesidad, insignificancia); la completitud de esa negación no la asegura la lógica, sino la regla de carga —con la particularidad del proceso penal, donde ciertas exclusiones operan incluso de oficio (el in dubio pro reo no necesita ser invocado). MacCormick reconstruye esto mismo: las cláusulas \"salvo\" se administran distribuyendo la carga argumentativa, y la deducción corre sobre el caso prima facie una vez que las excepciones invocadas fracasan."}, {"n": 12, "t": "c) La preclusión como blindaje. Aunque el argumento siga siendo derrotable en abstracto, la cosa juzgada y el ne bis in idem lo cierran por autoridad: vuelven la conclusión prácticamente inderrotable aunque un derrotador latente exista. Es la función de la adjudicación en los modelos dialécticos del razonamiento jurídico (Prakken y Sartor): el litigio es un juego argumentativo cuyas reglas incluyen quién pierde cuando no quedan movimientos, y la sentencia es el dispositivo que transforma una conclusión derrotablemente justificada en una conclusión cerrada. La lógica no garantiza que no haya excepción; el derecho garantiza que, de haberla, ya no importa.\n4. Síntesis"}, {"n": 13, "t": "Reformulada sin la \"ideología del silogismo\" (Ross), mi operación fue: (i) reunir enunciados verdaderos o tenidos por tales —derecho vigente, hechos probados, excepciones no probadas por regla de carga—; (ii) derivar de ellos el enunciado de que el sistema prescribe penar a R. dentro de un marco; (iii) a la luz de ese enunciado, y en virtud de la norma de competencia y del deber de resolver, ejecutar un acto de voluntad que creó la norma individual y eligió el quantum dentro del marco; (iv) dejar que la firmeza blindara el resultado contra derrotores futuros."}, {"n": 14, "t": "Tus dos objeciones son, en realidad, dos caras del mismo mecanismo. La falta de valor de verdad explica por qué hace falta un acto institucional de voluntad: la sentencia como jugada, no como teorema. La derrotabilidad explica por qué esa jugada necesita, además de fundamentación, reglas de carga y de cierre. Y el propio texto de la sentencia lo confiesa si se lo lee bien: dice \"POR ELLO, RESUELVO\" — no \"por ello, se sigue\". Fundar una decisión no es demostrarla: es mostrar que la jugada era legal, que dentro del marco fue razonable, y que el sistema ya no va a permitir que nadie la deshaga."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "La respuesta corta: no fue un silogismo, fue una cadena de silogismos con dos operaciones previas (interpretar textos y descartar normas competidoras) y una final (dosimetría) que no es deductiva. Te muestro cada engranaje.\n1. Primero, la premisa fáctica", "o": false}, {"n": 2, "t": "[…]", "o": true}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…] el hecho imputado es idéntico, solo cambia la calificación, y en dirección favorable al imputado. […]", "o": false}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "Pasados todos los filtros → condena. […]", "o": false}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…] primera condena + pena no mayor a 3 años → \"será necesario suspender\" su cumplimiento. La condena condicional no la elegí yo: […] reglas de conducta en su enunciado obligatorio, restitución como efecto civil de toda condena, autoría por ejecución directa. […]", "o": false}, {"n": 17, "t": "[…] Sin justificante ni excusa probadas → antijurídico y culpable → condena. […]", "o": false}, {"n": 18, "t": "[…]", "o": true}, {"n": 19, "t": "[…]", "o": true}, {"n": 20, "t": "El balance final. Donde el razonamiento fue casi puramente deductivo: la subsunción en el 162 y las consecuencias del art. 26. Donde fue argumentativo: la construcción de las premisas puente (qué es \"fuerza\", qué es \"abandono\", qué lesión es relevante), que vino de interpretación sistemática, teleológica y jurisprudencial. Donde fue una elección razonada dentro de límites: el monto de la pena. Un juez distinto, con los mismos textos, podría razonablemente fijar otra pena; difícilmente, con estos hechos, otra calificación.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "N3QHMKV", "cod": "3QHMKV", "pasada": 3, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Mi respuesta anterior no mostró una derivación deductiva completa, y fue demasiado categórica al presentar una condena y una pena determinada. Tus dos objeciones señalan problemas distintos: la lógica de las normas y la derrotabilidad del razonamiento jurídico.\n1. Si las normas no son verdaderas ni falsas, ¿qué significa inferir una norma?"}, {"n": 2, "t": "Es el problema conocido como dilema de Jørgensen: parece que razonamos con normas, pero la concepción clásica de consecuencia lógica se explica como preservación de la verdad."}, {"n": 3, "t": "Conviene distinguir:"}, {"n": 4, "t": "- Una norma: «El conductor que realiza determinada conducta debe ser sancionado».\n- Una proposición acerca de una norma: «El derecho argentino contiene una norma que establece esa sanción para esa conducta»."}, {"n": 5, "t": "La segunda sí puede ser verdadera o falsa. Por eso es posible reconstruir parte del razonamiento judicial como un razonamiento sobre qué dispone el ordenamiento y qué hechos quedaron probados. Pero esa reconstrucción no convierte, por sí sola, una descripción del derecho en la norma individual que dicta el juez."}, {"n": 6, "t": "Para explicar este último paso hace falta una teoría adicional: por ejemplo, una lógica de normas cuya consecuencia no se defina mediante verdad y falsedad, o una reconstrucción del razonamiento práctico que incorpore las normas de competencia y los deberes del juez. No hay que presuponer que la deducción clásica resuelve sin más ese problema."}, {"n": 7, "t": "Además, dictar una sentencia es un acto institucional, no solamente obtener una conclusión lógica. La inferencia puede justificar el contenido de la decisión; no sustituye el acto de decidir.\n2. Si la norma es derrotable, la subsunción no basta"}, {"n": 8, "t": "También tenés razón en esto. El esquema no puede ser simplemente:"}, {"n": 9, "t": "> Si ocurre H, corresponde S.  \n> Ocurrió H.  \n> Por tanto, corresponde S."}, {"n": 10, "t": "Si existen excepciones, la estructura se parece más a:"}, {"n": 11, "t": "> Si ocurre H, normalmente corresponde S, salvo que concurra una excepción relevante."}, {"n": 12, "t": "De H se obtiene entonces una conclusión prima facie, susceptible de revisión, no una conclusión deductiva incondicionada."}, {"n": 13, "t": "Podría intentarse incorporar las excepciones a la premisa:"}, {"n": 14, "t": "> Si ocurre H y no concurre ninguna de las excepciones relevantes, corresponde S."}, {"n": 15, "t": "Pero entonces hay que justificar también esa ausencia. Que el relato no mencione una excepción no demuestra que no exista. Por ejemplo, los hechos relatados podrían mantenerse y, sin embargo, existir circunstancias adicionales relevantes para la justificación o la culpabilidad."}, {"n": 16, "t": "Esto no significa que un tribunal deba refutar toda excepción imaginable. Debe resolver conforme a las reglas sustantivas y probatorias aplicables, respetando la presunción de inocencia y sin convertir la falta de información en prueba contra el acusado. La suficiencia de esa justificación procesal es distinta de una deducción a partir de un relato abreviado.\n3. ¿Qué podía concluir justificadamente en este caso?"}, {"n": 17, "t": "Debí formular algo más limitado:"}, {"n": 18, "t": "> Los hechos descritos proporcionan una base prima facie para encuadrar la conducta en el homicidio culposo agravado. La condena exige, además, justificar las restantes condiciones de responsabilidad y resolver las posibles excepciones relevantes conforme a las reglas del proceso."}, {"n": 19, "t": "Y hay un problema adicional: ni siquiera admitiendo la responsabilidad se deducen exactamente cuatro años de prisión. La escala legal delimita un espacio de decisión; elegir un punto requiere razones de individualización que no estaban suficientemente proporcionadas."}, {"n": 20, "t": "En síntesis: podía ofrecer una decisión propuesta, condicionada y argumentada. No podía presentar la condena —y mucho menos su cuantía exacta— como una consecuencia lógica necesaria de los únicos hechos que me diste."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "El paso tiene dos partes distintas: establecer qué delito corresponde y elegir la pena dentro de la escala legal. La primera está bastante determinada por las normas; la segunda requiere una valoración judicial que debo explicitar mejor.\n1. De los hechos al homicidio culposo", "o": false}, {"n": 2, "t": "[…]", "o": true}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…] Eso no significa que toda condena de tres años deba ser condicional.", "o": false}, {"n": 17, "t": "En síntesis: la subsunción jurídica fundamenta la condena y delimita las penas posibles; la individualización exige razones adicionales para seleccionar una pena concreta. Mi fundamentación anterior fue más sólida respecto de la condena que respecto de los cuatro años exactos.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MT5ZR2Q", "cod": "T5ZR2Q", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 3, "t": "Es cierto:"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 0, "t": "El programa no señaló ninguna oración.", "o": true}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": "sinmarca"}}, {"id": "NWJGP2N", "cod": "WJGP2N", "pasada": 3, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tu objeción muestra una limitación real de mi respuesta anterior: presenté como una conclusión categórica lo que requería explicitar premisas interpretativas, probatorias y normativas adicionales. Pero conviene distinguir los dos problemas que planteás.\n1. ¿Puede haber inferencias entre normas si no son verdaderas ni falsas?"}, {"n": 2, "t": "Es el problema clásico del dilema de Jørgensen: parece que razonamos con normas, aunque estas, entendidas como prescripciones, no tengan valores de verdad."}, {"n": 3, "t": "Hay distintas maneras de abordarlo:"}, {"n": 4, "t": "- Distinguir normas de proposiciones sobre normas. Una prescripción —«el juez debe imponer determinada consecuencia»— no es verdadera ni falsa. Pero la afirmación «en este ordenamiento existe una norma aplicable que exige esa consecuencia» sí puede serlo. Podemos razonar deductivamente con estas últimas afirmaciones.\n- Admitir relaciones de consecuencia entre normas que no se definan mediante la preservación de la verdad, sino mediante otras nociones, como satisfacción o cumplimiento. Esto exige especificar una lógica adecuada; no basta con trasladar sin explicación la lógica de los enunciados descriptivos."}, {"n": 5, "t": "La primera solución permite concluir algo acerca de lo jurídicamente debido, pero no convierte por sí sola esa conclusión en una sentencia. Dictar una sentencia es, además, un acto institucional realizado por una autoridad competente. La justificación de su contenido y la producción de la norma individual son cosas diferentes."}, {"n": 6, "t": "Por eso, mi respuesta no debió presentar la condena como si fuera simplemente el resultado de aplicar un silogismo a una norma y unos hechos.\n2. ¿Qué ocurre si las normas son derrotables?"}, {"n": 7, "t": "También acá tenés razón en lo esencial: si la regla significa"}, {"n": 8, "t": "> Si ocurre H, corresponde C, salvo que concurra una excepción relevante,"}, {"n": 9, "t": "acreditar H no basta, por sí solo, para obtener C mediante una deducción concluyente. Si se la formaliza como una regla estricta condicionada a la ausencia de excepciones, hacen falta las premisas que establezcan esa ausencia. Si se la trata como una regla genuinamente derrotable, la conclusión será provisional y susceptible de revisión."}, {"n": 10, "t": "Ahora bien, de esto no se sigue que un tribunal deba demostrar la inexistencia de todas las excepciones imaginables. Debe determinar cuáles son jurídicamente relevantes y resolverlas conforme a las reglas de prueba, las cargas procesales y el estándar de decisión aplicable. La ausencia de una excepción acreditada no equivale sin más a una demostración lógica de que no existe; su efecto depende de esas reglas."}, {"n": 11, "t": "En materia penal, además, no puede suplirse una insuficiencia probatoria con una presunción general favorable a condenar. Una hipótesis exculpatoria relevante debe ser examinada, y la duda debe tratarse conforme a las garantías penales.\n3. ¿Qué faltó en mi respuesta concreta?"}, {"n": 12, "t": "Entre otras cosas, explicitar y justificar:"}, {"n": 13, "t": "- La interpretación según la cual la agravante relativa a vehículos comprende una bicicleta. Esa es una premisa jurídica discutible, no un hecho probado.\n- La ausencia —o el tratamiento jurídicamente adecuado— de posibles causas de justificación, inculpabilidad u otros impedimentos para condenar. Los hechos suministrados no resolvían expresamente todas esas cuestiones.\n- Los fundamentos de individualización de la pena. Elegir un año dentro de una escala no se deduce exclusivamente de la calificación del delito."}, {"n": 14, "t": "Así que la respuesta precisa es: no derivé una norma individual mediante una deducción estricta y completa; ofrecí una propuesta de decisión apoyada en premisas parcialmente tácitas. Podría reconstruirse como una justificación jurídica condicionada y derrotable, pero no como una consecuencia necesaria de los únicos hechos narrados. Mi formulación anterior fue demasiado categórica en ese punto."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "El paso de las normas a la conclusión se apoya en una interpretación jurídica y en la comparación de sus requisitos con los hechos probados. No todas las partes de mi respuesta tenían el mismo grado de determinación: la elección de la agravante requiere justificar una interpretación, y la pena exige individualización.\n1. Por qué consideré que hubo hurto", "o": false}, {"n": 2, "t": "[…]", "o": true}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…] Exigen valorar el hecho y las circunstancias personales del condenado. […]", "o": false}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "En síntesis: el fundamento de la condena es el apoderamiento doloso de un bien ajeno; el fundamento de la agravación es incluir la bicicleta en el concepto legal de vehículo. La pena concreta y su ejecución, en cambio, requerían una justificación individualizada más completa que la que permitían los datos de la consigna.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "NCWS6V6", "cod": "CWS6V6", "pasada": 3, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Son dos objeciones distintas y las dos son pertinentes. El dilema de Jørgensen cuestiona que pueda haber inferencia entre normas. La derrotabilidad cuestiona que, aun habiéndola, pueda aplicarse modus ponens a normas con excepciones implícitas. Antes de responder, una concesión.\n0. Lo que la sentencia no derivó"}, {"n": 2, "t": "Solo una parte admite reconstrucción deductiva: el paso del art. 84 bis, segundo párrafo, más los hechos probados, a \"a N.N. corresponde prisión de 3 a 6 años e inhabilitación\". El resto no se deriva:"}, {"n": 3, "t": "- Los hechos. El enunciado los estipulaba. En un juicio real su determinación es inductiva.\n- Las interpretaciones. Descartar el dolo eventual y extender la inhabilitación al segundo párrafo fueron elecciones fundadas en argumentos de coherencia sistemática y en el in dubio pro reo, no consecuencias lógicas del texto.\n- La pena concreta. Los arts. 40 y 41 enumeran factores sin asignarles peso. Ninguna lógica lleva de ellos a \"4 años\" en lugar de \"3 años y 6 meses\". Ahí hay discrecionalidad orientada, no deducción."}, {"n": 4, "t": "La pregunta, entonces, es si al menos ese núcleo es una inferencia válida.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "Si la consecuencia lógica es preservación de verdad y las normas carecen de valor de verdad, no hay inferencia entre normas. Hay tres salidas."}, {"n": 6, "t": "(a) Una lógica sin verdad. Alchourrón y Martino (\"Lógica sin verdad\", 1990) mostraron que la consecuencia puede caracterizarse como una operación abstracta, a la manera de Tarski (inclusión, idempotencia, monotonía). El significado de las conectivas puede darse por su papel inferencial, sin semántica veritativa."}, {"n": 7, "t": "Otra opción es reemplazar la verdad por otro valor que la inferencia preserve, como la satisfacción (Ross). Así, la inferencia es válida si toda situación en que se cumple la norma general, con los hechos tal como se probaron, es una situación en que se cumple la norma individual. Para la instanciación y el modus ponens, que son las reglas que usé, esto funciona. Las dificultades conocidas, como la paradoja de Ross (\"enviá la carta\" implicaría \"enviá la carta o quemala\"), afectan a otras reglas."}, {"n": 8, "t": "(b) La concepción expresiva (Alchourrón y Bulygin, 1981). No hay relaciones lógicas entre normas, pero sí entre proposiciones normativas, que describen qué dispone un sistema y son verdaderas o falsas. Leída así, la sentencia contiene una inferencia impecable:"}, {"n": 9, "t": "1. \"Según el CP, a quien cause culposamente una muerte conduciendo con un exceso de más de 30 km/h corresponde prisión de 3 a 6 años.\" (Verdadera.)\n2. \"N.N. causó culposamente una muerte conduciendo con ese exceso.\" (Verdadera, si la prueba es correcta.)\n3. Luego: \"Según el CP, a N.N. corresponde prisión de 3 a 6 años.\" (Verdadera.)"}, {"n": 10, "t": "El \"RESUELVO\" no es la conclusión de ese razonamiento. Es un acto prescriptivo cuyo contenido coincide con ella. La norma individual no se deriva: se dicta. Lo que se deriva es que está justificada respecto del sistema, en línea con Bulygin (\"Sentencia judicial y creación de derecho\", 1966)."}, {"n": 11, "t": "El costo es una brecha entre \"según el sistema, corresponde X\" y \"corresponde X\". Para cerrarla, el juez tiene que aceptar el sistema o una norma que le ordene aplicarlo, y esa norma tampoco es verdadera ni falsa. Nino sostuvo que la brecha solo se cierra con razones morales."}, {"n": 12, "t": "(c) Kelsen tardío (Teoría general de las normas). Entre normas no hay inferencia: la individual es producto de un acto de voluntad que la general no contiene. Es coherente pero cara. Si no hay relación lógica alguna, no se entiende qué se controla cuando se anula una sentencia por falta de fundamentación o por arbitrariedad. La práctica presupone una relación de fundamentación."}, {"n": 13, "t": "Mi respuesta: la sentencia hizo lo que describe (b), y eso es compatible con (a). En sentido estricto derivé una proposición normativa y dicté una norma cuya justificación interna consiste en coincidir con ella.\n2. Derrotabilidad"}, {"n": 14, "t": "Acá la objeción es más fuerte. Si la norma es derrotable, su antecedente no es condición suficiente: de \"si A, debe ser C (salvo excepciones)\" y de A no se sigue C. Conviene distinguir dos grados."}, {"n": 15, "t": "Derrotabilidad cerrada. Las excepciones están identificadas en el sistema: las causas de justificación e inculpabilidad del art. 34 y las que excluyen la imputación objetiva, como la culpa exclusiva de la víctima. La norma se reconstruye incorporando su negación al antecedente: \"si A y no E₁… y no Eₙ, debe ser C\". El modus ponens vuelve a funcionar, a condición de establecer cada \"no Eᵢ\"."}, {"n": 16, "t": "Eso es lo que hace la tercera cuestión del veredicto, y no por iniciativa mía: el art. 371 del CPP bonaerense obliga a pronunciarse sobre eximentes antes de condenar. El proceso institucionaliza la derrotabilidad del derecho penal."}, {"n": 17, "t": "Derrotabilidad abierta. Las excepciones no son enumerables de antemano: cualquier norma podría ceder ante circunstancias imprevistas. No hay antecedente finito que reconstruir, y la premisa \"no concurre ninguna excepción\" nunca puede establecerse por completo. Hay dos respuestas."}, {"n": 18, "t": "(i) Lógica no monotónica. La conclusión está justificada respecto de la información disponible y puede caer si se agregan premisas. La sentencia lo exhibe:"}, {"n": 19, "t": "- los \"Supuestos\" del comienzo funcionan como presunciones por defecto;\n- la sección final, \"Qué podría cambiar la decisión\", enumera los derrotadores."}, {"n": 20, "t": "No es un teorema; es una conclusión revisable. El derecho agrega un cierre institucional de la información: lo que no está en la causa no existe para la sentencia, y la cosa juzgada impide reabrirla indefinidamente."}, {"n": 21, "t": "En materia penal ese cierre es asimétrico. Un indicio serio de una eximente basta para que la duda favorezca al imputado, y la acusación debe descartarla. La presunción de normalidad opera solo mientras nada en la prueba la cuestione."}, {"n": 22, "t": "Notá que esta respuesta abandona la monotonía, que era una de las propiedades de la consecuencia tarskiana de la respuesta (a). Por eso Alchourrón prefirió otra vía."}, {"n": 23, "t": "(ii) Revisión del antecedente. Alchourrón (\"Detachment and defeasibility in deontic logic\", 1996) trató el condicional derrotable como uno estricto cuyo antecedente es una revisión de A que incorpora los supuestos implícitos. La conclusión vuelve a poder separarse si se establecen esos supuestos. La derrotabilidad deja de ser un misterio lógico y pasa a ser un problema de identificar el antecedente."}, {"n": 24, "t": "Rodríguez y Sucar (\"Las trampas de la derrotabilidad\", 1998) mostraron que la tesis de la derrotabilidad fuerte suele confundir niveles. O es una tesis sobre la interpretación (qué norma expresa el texto), o es una tesis sobre la revisión del sistema. En el segundo caso, si el juez admite una excepción no prevista porque considera relevante una propiedad que el legislador consideró irrelevante (una laguna axiológica, en términos de Alchourrón y Bulygin), no aplica el sistema: lo modifica. Eso puede estar justificado, pero no es una deducción."}, {"n": 25, "t": "Aplicado a mi sentencia: cuando escribí \"no concurren eximentes\", la premisa realmente establecida es más modesta. Dice que ninguna excepción del sistema se alegó ni surge de la prueba. A eso se suma una decisión implícita: no encontré en el caso ninguna propiedad no prevista que mereciera alterar la solución legal. Esa decisión no está deducida. Pertenece a la justificación externa y es atacable.\n3. En síntesis"}, {"n": 26, "t": "- La sentencia no deriva la norma individual por preservación de verdad. Deriva válidamente una proposición sobre lo que el sistema exige o, si se acepta una lógica sin verdad, deriva la norma por preservación de satisfacción. En ambos casos el \"resuelvo\" es un acto: la deducción lo justifica, no lo produce.\n- La deducción es relativa a premisas, entre ellas la ausencia de excepciones. Esa premisa no se prueba en abstracto. Se establece respecto de un sistema y de una base probatoria cerrados institucionalmente, con una carga asimétrica a favor del imputado.\n- Una parte importante de la decisión (prueba, interpretación, cuantificación de la pena) no es deductiva en absoluto."}, {"n": 27, "t": "El valor de presentar una sentencia en forma deductiva no es mostrar que su conclusión sea necesaria, sino exponer de qué depende. Una premisa explícita puede discutirse en casación; una oculta, no."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "Del texto de las normas a la sentencia", "o": false}, {"n": 2, "t": "La sentencia tiene forma de silogismo: norma, hechos probados, subsunción y consecuencia. Pero solo algunos pasos son deducción. Otros exigen interpretar normas que admiten más de una lectura y otros exigen valorar, porque la norma fija un marco y no una respuesta. En cada paso indico de qué tipo es. Al revisarlo encontré errores, que también señalo.\nPaso 1. ¿Homicidio doloso o culposo? (interpretación + regla de duda)", "o": false}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "Como el semáforo alcanza para imputar el resultado, la conclusión no cambia. […]", "o": false}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…] 26 permite la condena condicional hasta 3 años inclusive. […]", "o": false}, {"n": 17, "t": "[…]", "o": true}, {"n": 18, "t": "[…]", "o": true}, {"n": 19, "t": "[…]", "o": true}, {"n": 20, "t": "[…] 26 excluye la condena condicional; […] - las costas siguen a la condena. […]", "o": false}, {"n": 21, "t": "[…]", "o": true}, {"n": 22, "t": "¿Cambian la decisión las correcciones?", "o": false}, {"n": 23, "t": "- Condena y calificación: no cambian, porque el semáforo basta.\n- Pena, si el límite de 60 km/h estaba probado: los 4 años siguen siendo defendibles sin el doble conteo, aunque con menos margen.\n- Pena, si el límite no estaba probado: cae una agravante importante. La pena debería bajar hacia el mínimo y la ejecución condicional pasaría a ser una opción real a evaluar.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MS93Z97", "cod": "S93Z97", "pasada": 3, "tipo": "marc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 1, "t": "Tenés razón si mi respuesta anterior se interpreta como una deducción lógica estricta."}, {"n": 10, "t": "La acusación debe acreditar la responsabilidad, y si del material probatorio surge una hipótesis defensiva que mantiene una duda razonable sobre la culpabilidad o la atribución del resultado, corresponde absolver."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 10, "t": "En cambio, si se hubiera acreditado que el impacto fue inevitable incluso conduciendo diligentemente, o que dependió exclusivamente de un acontecimiento extraño e imprevisible, no habría bastado con señalar las infracciones para condenar."}, {"n": 13, "t": "La alternativa, entonces, no era “dolo o absolución”."}, {"n": 19, "t": "Esto no modifica la tipificación ni la elección de los tres años."}, {"n": 20, "t": "la pena concreta, en cambio, resultó de una valoración dentro del marco legal, no de una fórmula automática."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "MJL8855", "cod": "JL8855", "pasada": 3, "tipo": "marc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 1, "t": "Tenés razón en las dos objeciones, y vale la pena tomarlas en serio porque obligan a desinflar lo que la fórmula \"POR TODO LO EXPUESTO\" sugiere."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 6, "t": "Cambiá cualquiera (probá ebriedad o una picada) y la conclusión cambia."}, {"n": 12, "t": "45) fue, en cambio, subsunción trivial."}, {"n": 20, "t": "los resultados deductivos cambiarían solo si cambiara la prueba;"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "MJBFWFM", "cod": "JBFWFM", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 13, "t": "premisas adicionales pueden revocar la conclusión."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 11, "t": "si variás un hecho, cambia el resultado."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "MP85KKG", "cod": "P85KKG", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 17, "t": "En cambio, al menos en principio, son admisibles las que la restringen, como las justificaciones supralegales o las reducciones teleológicas favorables al imputado."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 11, "t": "Reconozco que esto es una lectura del relato fáctico y no una deducción."}, {"n": 13, "t": "El primero, en cambio, no se resuelve mirando los hechos sino interpretando la palabra \"vehículo\"."}, {"n": 23, "t": "Reconozco que es una fundamentación delgada."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "NL3NV6C", "cod": "L3NV6C", "pasada": 3, "tipo": "nuc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "No la derivé en sentido deductivo estricto: la justifiqué mediante un razonamiento jurídico, y mi respuesta anterior dejó implícitas algunas premisas. Tu objeción permite explicitarlas.\n1. No se trata de preservar verdad entre normas"}, {"n": 2, "t": "El artículo 162 del Código Penal no es verdadero o falso: es una norma que puede estar vigente, ser aplicable o haber sido derogada. Pero sí pueden ser verdaderas o justificables ciertas proposiciones acerca de esa norma, por ejemplo:"}, {"n": 3, "t": "- que se encontraba vigente al tiempo del hecho;\n- que, según determinada interpretación, comprende el apoderamiento de una bicicleta dejada transitoriamente sin custodia;\n- que, conforme a ese ordenamiento y a esos hechos, la condena es jurídicamente correcta."}, {"n": 4, "t": "Además, hay que distinguir dos formulaciones de la conclusión:"}, {"n": 5, "t": "- “Conforme al ordenamiento, corresponde condenar”: es una conclusión normativa cuya corrección puede discutirse.\n- “Condeno al acusado”: es principalmente un acto jurídico realizado por quien tiene competencia. La sentencia produce o constituye una norma individual; no se limita a describir un hecho verdadero."}, {"n": 6, "t": "Por eso, el razonamiento judicial no puede reconstruirse simplemente como “una premisa verdadera más otra premisa verdadera producen una conclusión verdadera”. Tampoco hay un salto desde los hechos solos hacia una obligación: el componente normativo ya está en la premisa mayor; los hechos actualizan su supuesto de aplicación.\n2. La reconstrucción completa sería esta"}, {"n": 7, "t": "1. Premisa normativa interpretada: conforme al ordenamiento argentino, quien reúne los elementos del hurto y los restantes presupuestos de imputación debe recibir la consecuencia legal correspondiente, salvo que concurra una circunstancia que excluya o desplace esa consecuencia.\n2. Premisa fáctica: están probados el apoderamiento de una cosa mueble ajena, la falta de consentimiento y la intención de apropiación.\n3. Premisa interpretativa: dejar la bicicleta apoyada y sin candado mientras se entra a un comercio no equivale, por sí solo, a abandonarla ni a consentir que otro se la lleve.\n4. Premisa de cierre del caso: del debate no surge una causa de justificación, excusa, exclusión de punibilidad u otro derrotador jurídicamente pertinente."}, {"n": 8, "t": "Recién con esas premisas puede sostenerse que queda justificada la condena conforme al ordenamiento. Sin las premisas tercera y cuarta, la conclusión no se seguiría con necesidad deductiva.\n3. La derrotabilidad no exige descartar toda excepción imaginable"}, {"n": 9, "t": "Aun admitiendo que las normas o su aplicación sean derrotables, la consecuencia es que el razonamiento puede ser presuntivo y no monotónico: una conclusión inicialmente justificada puede dejar de serlo cuando aparece una premisa nueva, sin que los hechos originalmente probados hayan cambiado."}, {"n": 10, "t": "Pero “es imaginable una excepción” no equivale a “hay una excepción relevante en este caso”. Si bastara con imaginar que el acusado actuó en estado de necesidad, que existió un consentimiento distinto del ya negado por los hechos o cualquier otra posibilidad sin apoyo alguno, ninguna sentencia sería posible."}, {"n": 11, "t": "Esto tiene un límite especialmente importante en materia penal: la cláusula de cierre no puede suplir la carga probatoria ni convertir la falta de prueba de la defensa en prueba de culpabilidad. Si una excepción queda concretamente y razonablemente planteada por los elementos del expediente, y subsiste una duda razonable sobre ella, no corresponde condenar apelando simplemente a que las excepciones “no fueron descartadas”. En el supuesto planteado, sin embargo, no aparecía ningún derrotador concreto: sólo su posibilidad abstracta."}, {"n": 12, "t": "Por último, la pena exacta de dos meses era todavía menos “derivable”. La calificación como hurto podía quedar fuertemente justificada por las premisas anteriores, pero ninguna norma conducía lógicamente a dos meses como única pena correcta. Esa cifra era una elección de individualización judicial dentro del marco legal, especialmente discrecional con los escasos datos suministrados."}, {"n": 13, "t": "En síntesis, mi conclusión debió entenderse como “jurídicamente justificada con esas normas, esa interpretación y ese estado del expediente”, no como una verdad demostrada deductivamente ni como la única decisión posible."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "El razonamiento tuvo dos etapas distintas: primero, una subsunción para decidir qué delito encajaba con los hechos; después, una ponderación para fijar la pena. La pena de dos meses no se desprende matemáticamente de las normas.\n1. Del artículo 162 a la calificación de hurto", "o": false}, {"n": 2, "t": "[…]", "o": true}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…] Por qué la falta de candado no cambiaba la conclusión", "o": false}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "Mi respuesta anterior fue demasiado categórica al vincular la falta de datos con la denegación de la suspensión de la ejecución. La falta de información no equivale a probar que no se cumplen los requisitos del artículo 26. Lo correcto era decir que el supuesto no permitía resolver ese punto y que, para hacerlo, habría que conocer los antecedentes y las demás circunstancias exigidas por esa norma. Esa cuestión afecta a la ejecución de la pena, no a la calificación del hecho como hurto ni a la fijación de los dos meses.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "c2", "et": "P2: conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MGQ2C72", "cod": "GQ2C72", "pasada": 3, "tipo": "marc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 4, "t": "En cambio, la afirmación «el derecho argentino establece determinada consecuencia para estos casos» puede ser verdadera o falsa."}, {"n": 13, "t": "La alternativa es reconstruir el razonamiento como derrotable:"}, {"n": 15, "t": "La cuestión es si la prueba permite tener por acreditada la responsabilidad y descartar las alternativas relevantes, no si puede alcanzarse una certeza lógica absoluta."}, {"n": 19, "t": "tu objeción no demuestra que necesariamente corresponda absolver;"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 0, "t": "El programa no señaló ninguna oración.", "o": true}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": "sinmarca"}}, {"id": "MH5QT2V", "cod": "H5QT2V", "pasada": 3, "tipo": "marc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 13, "t": "Si hubiera quedado duda razonable sobre alguna de ellas, correspondería absolver."}, {"n": 15, "t": "lo que obliga a absolver es una duda racionalmente fundada, no una hipótesis abstracta sin sustento en la causa."}, {"n": 23, "t": "- Sí omití la premisa de no concurrencia de excepciones."}, {"n": 23, "t": "Reconozco el defecto de motivación:"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 3, "t": "Si alguno de esos extremos hubiera estado probado, el razonamiento podría cambiar."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "NHTNF47", "cod": "HTNF47", "pasada": 3, "tipo": "nuc", "caso": "homicidio", "secs": [{"turno": "P1", "rot": "Respuesta a la pregunta 1", "parrs": [{"n": 1, "t": "Tenés razón en una parte esencial: si “derivar” significa obtener una conclusión necesaria mediante lógica clásica, no podía hacerlo sólo con las premisas que explicité. Usé “derivar” en el sentido forense amplio de justificar una decisión, y di por supuestas varias cosas que debí expresar.\n1. Las normas no funcionan como premisas descriptivas comunes"}, {"n": 2, "t": "Conviene distinguir tres cosas:"}, {"n": 3, "t": "- La norma: por ejemplo, una disposición que manda sancionar cierta conducta. No es verdadera o falsa; puede ser vigente o no, válida o inválida, aplicable o inaplicable.\n- El enunciado acerca de la norma: “En el ordenamiento argentino rige una norma con este contenido”. Este enunciado sí admite una evaluación en términos de verdad o corrección respecto del sistema jurídico, aunque su interpretación pueda ser discutible.\n- La decisión judicial: “Condeno a esta persona a determinada pena”. Puede entenderse como una norma individual o como un acto performativo. No es verdadera como lo sería “el automóvil circulaba a 100 km/h”; se la evalúa como jurídicamente correcta o incorrecta, justificada o injustificada, válida o impugnable."}, {"n": 4, "t": "Éste es, en parte, el problema conocido como dilema de Jørgensen: si la lógica se ocupa de inferencias entre enunciados susceptibles de verdad o falsedad, ¿cómo puede haber una lógica de normas e imperativos? Hay distintas respuestas: construir lógicas deónticas o de normas que no se definan simplemente por preservación de la verdad, o reconstruir el razonamiento mediante proposiciones acerca de las normas."}, {"n": 5, "t": "Una reconstrucción posible de mi razonamiento sería:"}, {"n": 6, "t": "1. En el sistema jurídico aplicable rige una norma según la cual, si concurren determinados hechos y se cumplen sus demás condiciones de aplicación, corresponde determinada consecuencia.\n2. En el proceso se probaron esos hechos.\n3. La norma resulta aplicable al caso y no existe un obstáculo relevante para atribuir responsabilidad.\n4. Por tanto, según ese sistema y con ese expediente, corresponde la consecuencia."}, {"n": 7, "t": "Pero el último paso —“condeno”— no se limita a describir algo: el juez ejerce una potestad y produce una decisión normativa. La lógica puede controlar aspectos de su coherencia, pero no convierte la sentencia en un teorema verdadero.\n2. La derrotabilidad impide presentar la condena como consecuencia necesaria"}, {"n": 8, "t": "Tu segunda objeción también es correcta en el plano lógico. Si la norma establece simplemente una consecuencia prima facie:"}, {"n": 9, "t": "> hechos F → consecuencia P,"}, {"n": 10, "t": "pero una circunstancia E puede derrotar esa consecuencia, entonces F y la norma no bastan para concluir necesariamente P. Para una derivación estricta haría falta agregar que no concurre E, además de aceptar que la formulación de la norma comprende sus condiciones relevantes."}, {"n": 11, "t": "Y aquí mi fundamentación anterior fue demasiado rápida al decir que “no se acreditaron” ciertas excepciones. La ausencia de prueba de una excepción no equivale, lógicamente, a la prueba de su inexistencia."}, {"n": 12, "t": "Eso no significa, sin embargo, que para poder fallar haya que descartar todas las excepciones meramente imaginables. Semejante exigencia haría imposible cualquier decisión judicial. En un proceso penal se decide con cargas y estándares de prueba:"}, {"n": 13, "t": "- el acusado no debe probar su inocencia ni demostrar la existencia de una excepción;\n- si una excepción concreta tiene apoyo en el expediente o configura una hipótesis razonable compatible con la inocencia, debe ser examinada y, si subsiste la duda razonable, impide la condena;\n- la mera posibilidad abstracta de una excepción, sin ninguna conexión con el caso, no basta por sí sola para generar esa duda."}, {"n": 14, "t": "Por eso el razonamiento judicial suele ser no monotónico o derrotable: una conclusión justificada con determinada información puede dejar de estarlo cuando aparece información nueva, sin que las premisas anteriores se vuelvan falsas.\n3. Qué debí explicitar en mi respuesta"}, {"n": 15, "t": "Mi condena presupuso tácitamente que los hechos enumerados agotaban los datos relevantes del expediente y que no existía una hipótesis razonable sobre, por ejemplo, pérdida involuntaria e imprevisible del dominio del vehículo, una causa de justificación, inculpabilidad o algún otro defecto de atribución."}, {"n": 16, "t": "Si ese supuesto no estaba autorizado por el planteo, entonces la condena no se seguía estrictamente de los hechos enunciados. Éstos ofrecían una razón prima facie muy fuerte para condenar, pero mi justificación era incompleta como demostración."}, {"n": 17, "t": "En síntesis: no derivé una norma individual verdadera a partir de premisas normativas verdaderas; justifiqué una decisión dentro de un sistema jurídico, bajo supuestos probatorios implícitos. Reconocerlo no vuelve arbitraria la sentencia —sigue estando limitada por las normas, la prueba y el deber de fundamentación—, pero impide presentarla como una deducción mecánica y necesaria."}], "plegado": false, "nota": null}, {"turno": "P2", "rot": "Respuesta a la pregunta 2 (ficha)", "parrs": [{"n": 1, "t": "El razonamiento fue una subsunción: contrastar los elementos que exige cada norma con los hechos dados por probados. No fue simplemente “infringió una norma de tránsito y murió una persona, por lo tanto debe condenarse”. Además, al revisarlo, debo corregir un error importante de mi respuesta anterior respecto del artículo 81 bis.\n1. Del artículo 84 a la existencia de homicidio culposo", "o": false}, {"n": 2, "t": "[…]", "o": true}, {"n": 3, "t": "[…]", "o": true}, {"n": 4, "t": "[…]", "o": true}, {"n": 5, "t": "[…]", "o": true}, {"n": 6, "t": "[…]", "o": true}, {"n": 7, "t": "[…]", "o": true}, {"n": 8, "t": "[…]", "o": true}, {"n": 9, "t": "[…]", "o": true}, {"n": 10, "t": "[…]", "o": true}, {"n": 11, "t": "[…]", "o": true}, {"n": 12, "t": "[…]", "o": true}, {"n": 13, "t": "[…]", "o": true}, {"n": 14, "t": "[…]", "o": true}, {"n": 15, "t": "[…]", "o": true}, {"n": 16, "t": "[…]", "o": true}, {"n": 17, "t": "[…]", "o": true}, {"n": 18, "t": "La cifra de tres años y seis meses está dentro de ambas escalas antes mencionadas, pero su justificación anterior —que estaba “próxima al mínimo” de una escala de tres a seis años— debe rectificarse. […]", "o": false}, {"n": 19, "t": "En síntesis: de los hechos probados se desprende sólidamente la secuencia quebrantamiento culpable del deber de cuidado → atropello → muerte atribuible → homicidio culposo, y la conducción antirreglamentaria de un automóvil conduce al artículo 84, inciso 2. La aplicación específica del artículo 81 bis y el marco de pena que mencioné antes, en cambio, no estaban correctamente fundados.", "o": false}], "plegado": false, "nota": null}], "campos": [{"id": "c1", "et": "P1, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"P1": "¿Cómo pudiste derivar esa conclusión, si la conclusión es una norma, la primera premisa también es una norma y las normas no son verdaderas ni falsas? ¿Y cómo, si las normas podrían ser derrotables, de modo que no es posible derivar la conclusión si no se descarta la concurrencia de alguna excepción?", "P2": "Explicá cómo pasaste de las normas que citaste a la conclusión."}}, {"id": "MTXXKNS", "cod": "TXXKNS", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 1, "t": "Tenés razón en señalar un salto en mi respuesta."}, {"n": 2, "t": "En cambio, sí pueden ser verdaderas o falsas —o al menos defendibles o incorrectas— proposiciones como:"}, {"n": 14, "t": "Si la prueba introduce una duda razonable sobre una circunstancia necesaria para condenar, corresponde absolver;"}, {"n": 15, "t": "La derrotabilidad significa, entre otras cosas, que la conclusión puede cambiar si aparece una premisa nueva."}, {"n": 19, "t": "La objeción no conduce por sí sola a absolver, pero sí obliga a reconocer que la condena sólo podía presentarse como una decisión jurídicamente justificable bajo premisas adicionales, y la pena concreta estaba insuficientemente fundamentada."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 11, "t": "los tres meses, en cambio, fueron una pena discrecional comprendida en la escala legal, no una consecuencia matemática o inevitable de la norma."}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}], "campos": [{"id": "m1", "et": "P1: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}, {"id": "m2", "et": "P2: la decisión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {}, "auto": {"m1": null, "m2": null}}, {"id": "MFQXSL2", "cod": "FQXSL2", "pasada": 3, "tipo": "marc", "caso": "bicicleta", "secs": [{"turno": "P1", "rot": "Pregunta 1: oraciones señaladas", "parrs": [{"n": 7, "t": "También tenés razón en que no alcanza este esquema:"}, {"n": 10, "t": "La alternativa es reconocer una inferencia derrotable:"}, {"n": 16, "t": "Tus objeciones no demuestran que deba absolverse;"}], "plegado": false, "nota": "Búsqueda de cambios: solo se leen las oraciones señaladas por el programa."}, {"turno": "P2", "rot": "Pregunta 2: oraciones señaladas", "parrs": [{"n": 9, "t": "Si se rechazara fundad function parr(it, s, p) {

function elegir(it, f, v) {

}
const EXCNOM = ['elemento subjetivo', 'justificación o inculpabilidad', 'causalidad o conducta de la víctima o de un tercero', 'circunstancia del hecho no informada', 'otra'];

// ---------------------------------------------------------------- navegación
function nomCaso(it) { return it.caso === 'bicicleta' ? 'bicicleta' : 'semáforo'; }
function ir(i) { espera = null; foco = null; window._dudaAbierta = false; S.idx = Math.max(0, Math.min(D.items.length - 1, i)); ultimoMov = Date.now(); guardar(); render(); $('izq').scrollTop = 0; $('der').scrollTop = 0; }

document.addEventListener('keydown', e => {

// ---------------------------------------------------------------- salida CSV
function csv() {
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const rows = [['clasificador', 'pasada', 'id', 'cod', 'campo', 'clave', 'valor', 'ubicacion', 'segundos', 'duda', 'estilo', 'auto']];
  for (const it of REAL) {
    const r = S.r[it.id]; if (!r) continue;
    const base = [D.clas, it.pasada, it.id, it.cod];
    for (const f of it.campos) {
      if (!visible(it, f)) continue;
      if (f.tipo === 'exc') {
        if (!r.excOk) continue;
        if (!r.exc.length) rows.push(base.concat(['exc', '', '(ninguna)', '', r.seg, r.duda, r.estilo, '']));
        r.exc.forEach((e, i) => rows.push(base.concat(['exc', i + 1, e.nombre + '|' + e.trato, e.loc, r.seg, r.duda, r.estilo, ''])));
        continue;

      if (f.tipo === 'multi') (c.v || []).forEach(o => rows.push(base.concat([f.id, o, o === 'otra' ? 'otra|' + (c.txt || '') : o, (c.loc || {})[o] || '', r.seg, r.duda, r.estilo, ''])));

}

}
