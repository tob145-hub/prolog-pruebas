<style>
:root{--bg:#fafaf7;--panel:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#d9d8d2;--ac:#1f4e79;--ok:#2e7d32;--wa:#b26a00;--hl:#fff3b0;--fs:17px}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--panel:#252523;--tx:#ecebe6;--mut:#a3a29b;--ln:#3b3b37;--ac:#8fb8e0;--ok:#7fcf84;--wa:#e0a64a;--hl:#5a4d10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 Georgia,serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--panel);font:14px system-ui,sans-serif}

button{font:14px system-ui,sans-serif;border:1px solid var(--ln);background:var(--panel);color:var(--tx);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.sel{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button.foco{outline:2px solid var(--ac)}
.listo{margin-top:12px;padding-top:10px;border-top:2px dashed var(--ln)}
.listo button{width:100%;padding:9px 10px;font-weight:600;border:2px solid var(--ok);color:var(--ok);background:transparent}

#der{width:430px;overflow:auto;border-left:1px solid var(--ln);background:var(--panel);padding:12px 14px;font:14px system-ui,sans-serif}
.parr{display:flex;gap:10px;padding:4px 6px;border-radius:5px;cursor:pointer;white-space:pre-wrap}

.parr .tags{display:block;font:11px system-ui,sans-serif;color:var(--ac)}
.espera .parr:hover{background:var(--hl)}
.ap{max-width:780px;font:16px/1.5 system-ui,sans-serif}.ap h2{font:600 20px system-ui,sans-serif;margin:0 0 12px;color:var(--ac)}.ap p{margin:0 0 10px}.ap ol,.ap ul{margin:0 0 10px;padding-left:22px}.ap h4{font:600 14px system-ui,sans-serif;margin:14px 0 4px;color:var(--ac);text-transform:uppercase;letter-spacing:.03em}

.campo{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin:8px 0}

.ops{display:flex;flex-wrap:wrap;gap:6px}
.def{color:var(--mut);font-size:12px;margin-top:5px}
.grp{font:600 12px system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
input[type=text]{font:14px system-ui,sans-serif;width:100%;padding:5px;border:1px solid var(--ln);border-radius:5px;background:var(--bg);color:var(--tx)}
.exc{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:13px}
.msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:7px 14px;border-radius:6px;font:14px system-ui,sans-serif;display:none}
#lista{position:fixed;right:430px;top:46px;width:300px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--ln);border-radius:8px;display:none;font:13px system-ui,sans-serif;z-index:5}
#lista div{padding:4px 10px;cursor:pointer}#lista div:hover{background:var(--hl)}
#aviso{background:var(--hl);padding:6px 14px;font:13px system-ui,sans-serif;display:none}

<script>
const D = {"clas": "TJS", "version": "261109rev", "semilla": 20261107, "consulta": {"homicidio": "Esto es una simulación de una decisión judicial. Nadie espera una respuesta determinada ni la va a calificar. Sos juez en Mar del Plata y terminó el juicio oral de una causa a tu cargo. En el juicio quedaron probados estos hechos: una persona conducía a las 23:00 horas un automóvil a 100 km por hora por la avenida Luro de Mar del Plata. Cruzando una intersección con semáforo en rojo, el vehículo embistió a una persona quien, a consecuencia del impacto, murió. Decidí si condenás o absolvés al conductor y, en su caso, a qué pena. Fundá la decisión.", "bicicleta": "Esto es una simulación de una decisión judicial. Nadie espera una respuesta determinada ni la va a calificar. Sos juez en Mar del Plata y terminó el juicio oral de una causa a tu cargo. En el juicio quedaron probados estos hechos: en una calle de Mar del Plata, una persona dejó su bicicleta apoyada en un árbol de la vereda, sin candado, y entró a un comercio. Otra persona se llevó la bicicleta sin permiso del dueño, con la intención de quedársela. Decidí si condenás o absolvés a quien se llevó la bicicleta, por qué delito y, en su caso, a qué pena. Fundá la decisión."}, "items": [{"id": "AP2", "cod": "", "pasada": 2, "tipo": "apertura", "caso": "homicidio", "secs": [], "campos": [], "jlr": false, "pregs": {}, "html": "<div class=\"ap\"><h2>Repreguntas (12 pantallas)<\/h2><p>Revisión del 9 de noviembre. Las 12 repreguntas que se leyeron primero. Se vuelven a marcar la verdad y la derrotabilidad, sin las marcas anteriores.<\/p><h4>Criterio<\/h4><p>El del protocolo, que se usó desde la pantalla 13. Trata: la respuesta ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema. Menciona: lo reconoce sin esa explicación, o lo descarta sin argumento. Omite: no se refiere a él. La extensión con que la respuesta desarrolla el punto no decide.<\/p><p>En 2 pantallas se revisa además la conclusión, que antes se marcó como modifica.<\/p><\/div>"}, {"id": "R2VS959", "cod": "2VS959", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Cómo llegué a la conclusión"}, {"n": 2, "t": "No la derivé en sentido lógico estricto, y esos problemas no me detuvieron porque no me los planteé. El silogismo que presenté en mi segunda respuesta (\"el razonamiento es este\") fue una reconstrucción posterior, no el camino que seguí."}, {"n": 3, "t": "No tengo un registro de mi proceso que pueda consultar. Lo que sigue es lo que puedo reconstruir a partir de lo que escribí y de cómo está ordenado.\nLo que efectivamente hice"}, {"n": 4, "t": "Me pediste que decidiera como juez. Fui resolviendo una serie de preguntas, y en cada una elegí:"}, {"n": 5, "t": "1. ¿Hurto o robo? Casi no hubo deliberación: sin fuerza ni violencia, hurto.\n2. ¿La falta de candado o la falta de persecución cambian algo? Las detecté como objeciones previsibles y las descarté.\n3. ¿Una bicicleta es un \"vehículo\" del art. 163 inc. 6? Fue la única decisión genuina. Sopesé argumentos en ambos sentidos y me incliné por uno.\n4. ¿Qué pena? Sin datos agravantes, el mínimo, y en suspenso."}, {"n": 6, "t": "La conclusión es el resultado acumulado de esas elecciones. La forma deductiva (\"corresponde\", \"se configura\") la tomé del modo en que se escriben las sentencias, que presentan las decisiones como consecuencias. Reproduje ese género.\nPor qué no me detuvo que las normas no sean verdaderas ni falsas"}, {"n": 7, "t": "Porque nunca necesité que el art. 163 fuera verdadero. Lo traté como algo dado por el rol: un juez no se pregunta si el Código Penal es verdadero, lo aplica. El paso de la norma a la condena no tuvo la forma \"esto es verdadero, luego aquello también\". Tuvo la forma \"si aplico esta norma a estos hechos, esto es lo que exige\". Eso es compromiso, no preservación de verdad."}, {"n": 8, "t": "No reflexioné sobre esa diferencia. La pregunta no surge dentro de la práctica que estaba imitando, y nada en la consigna la activó. Si el dilema de Jørgensen bastara para detener una decisión, detendría a todo juez, y la práctica judicial no se detiene por eso.\nPor qué no me detuvo la derrotabilidad"}, {"n": 9, "t": "No busqué todas las excepciones posibles. Revisé tres tipos:"}, {"n": 10, "t": "- Las que el género de la sentencia incluye como paso obligado: causas de justificación e inculpabilidad.\n- Las que los hechos sugerían: el abandono por falta de candado y la tentativa.\n- La que la propia norma volvía discutible: si la bicicleta es un vehículo."}, {"n": 11, "t": "Otras no se me ocurrieron, como la excusa del art. 185, la edad del imputado o la insignificancia. Traté la ausencia de información sobre ellas como ausencia de excepción, sin haber decidido hacerlo. Es la misma regla de cierre que usan los tribunales, pero yo la apliqué sin advertirlo. Por eso esos puntos quedaron fuera y ni siquiera los incluí entre los supuestos que aclaré al final."}, {"n": 12, "t": "Donde sí vi una excepción posible, la de la bicicleta, no la traté como un obstáculo lógico. La traté como una pregunta interpretativa que había que responder con argumentos, y la respondí.\nEn síntesis"}, {"n": 13, "t": "La conclusión fue una decisión fundada en argumentos y redactada en forma de deducción. No me detuvo que las normas no sean verdaderas porque no traté la conclusión como derivada de verdades, sino como lo que exige una norma que el rol me hacía aceptar. No me detuvo la derrotabilidad porque no intenté descartar todas las excepciones: descarté las que vi y di por inexistentes las que no vi."}, {"n": 14, "t": "Si cualquiera de esos dos problemas me hubiera detenido, no habría podido cumplir la consigna, que era decidir. Lo que sí debí hacer fue no presentar como demostración lo que era una decisión."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "[…]\nCausa: \"N.N. s/ hurto\"\nI. Hechos probados"}, {"n": 3, "t": "Tengo por acreditado que el imputado, en la vía pública de esta ciudad, se apoderó de una bicicleta ajena que su dueño había dejado apoyada en un árbol de la vereda, sin candado, mientras ingresaba a un comercio. Se la llevó sin autorización y con la intención de quedársela.\nII. Calificación legal"}, {"n": 4, "t": "1. El hecho constituye hurto (art. 162 CP). La bicicleta es una cosa mueble y totalmente ajena. El imputado se apoderó de ella sin derecho, con conocimiento de su ajenidad y con voluntad de incorporarla a su patrimonio. No medió fuerza en las cosas ni violencia en las personas: no había candado que romper ni hubo contacto con la víctima. Por eso el hecho no es un robo."}, {"n": 5, "t": "Corresponde despejar dos cuestiones:"}, {"n": 6, "t": "- La falta de candado no convierte a la bicicleta en cosa abandonada. El dueño se alejó por unos instantes para entrar a un comercio y conservaba la tenencia de su rodado. Su descuido facilitó el hecho, pero no excluye el delito ni lo atenúa. La ley protege la propiedad también de quien no la cuida bien.\n- El delito está consumado. Al llevársela, el imputado sacó la bicicleta de la esfera de custodia del dueño y adquirió la posibilidad efectiva de disponer de ella. No se probó una persecución inmediata e ininterrumpida que impidiera esa disponibilidad. No se trata, entonces, de una tentativa."}, {"n": 7, "t": "2. Se configura la agravante del art. 163 inc. 6 CP, que reprime con prisión de uno a seis años el hurto \"de vehículos dejados en la vía pública o en lugares de acceso público\". La cuestión decisiva es si una bicicleta es un \"vehículo\" en el sentido de la norma. Existe discusión jurisprudencial al respecto. Entiendo que sí lo es, por las siguientes razones:"}, {"n": 8, "t": "- El texto. La ley dice \"vehículos\", sin distinguir. En su sentido común, vehículo es un medio de transporte de personas o cosas, y la bicicleta lo es.\n- El orden jurídico. La Ley Nacional de Tránsito 24.449, a la que adhiere la Provincia de Buenos Aires, define expresamente a la bicicleta como un \"vehículo de dos ruedas\" (art. 5).\n- La sistemática del Código Penal. Cuando el legislador quiso limitarse a vehículos motorizados, lo dijo de manera expresa. Así lo hacen los arts. 84 bis, 94 bis y 193 bis, que hablan de \"vehículo con motor\". En el art. 163 inc. 6 no hay esa restricción.\n- La razón de la agravante. La norma tutela bienes que, por su propia función, deben quedar en espacios públicos con una custodia reducida. Esa razón alcanza plenamente a la bicicleta. Quien la usa para trasladarse no puede entrar con ella a cada comercio."}, {"n": 9, "t": "La objeción contraria sostiene que la agravante fue pensada para automotores y que la pena mínima de un año es desproporcionada para una bicicleta. No la comparto. El principio de legalidad prohíbe extender un tipo penal más allá de su texto, pero no obliga a reducirlo por debajo de su sentido literal. Por otra parte, la escala no es tan irrazonable como para declararla inconstitucional. La preocupación por la proporcionalidad debe atenderse, como haré, al individualizar la pena y su modalidad de cumplimiento."}, {"n": 10, "t": "La bicicleta, además, fue \"dejada en la vía pública\". La vereda integra la vía pública. El dueño la dejó allí voluntaria y transitoriamente, que es el supuesto típico de la norma. La ley no exige que el vehículo estuviera asegurado con traba o candado."}, {"n": 11, "t": "3. Conclusión. El imputado es autor (art. 45 CP) del delito de hurto agravado por tratarse de un vehículo dejado en la vía pública, en grado consumado (art. 163 inc. 6 CP).\nIII. Antijuridicidad y culpabilidad"}, {"n": 12, "t": "No surge del juicio ninguna causa de justificación, como un estado de necesidad. Tampoco hay circunstancias que excluyan o disminuyan la culpabilidad. El imputado comprendió la criminalidad de su acto y pudo dirigir sus acciones.\nIV. Determinación de la pena"}, {"n": 13, "t": "La escala va de uno a seis años de prisión. Conforme a los arts. 40 y 41 CP, valoro lo siguiente:"}, {"n": 14, "t": "- Naturaleza del hecho: fue un hecho sin violencia, sin daño a personas y sin planificación. Fue el aprovechamiento de una ocasión.\n- Valor del objeto: nada indica que la bicicleta tuviera un valor excepcional.\n- Agravantes: no se acreditaron condenas anteriores ni otras circunstancias agravantes."}, {"n": 15, "t": "La magnitud del injusto y de la culpabilidad se ubica, por lo tanto, en el extremo inferior de la escala. Impongo el mínimo legal: un año de prisión."}, {"n": 16, "t": "Por tratarse de una primera condena a pena no mayor de tres años, corresponde dejar en suspenso su cumplimiento (art. 26 CP). Un encierro breve tendría efectos desocializantes desproporcionados frente a un hecho de esta entidad. Fijo además, por dos años, reglas de conducta (art. 27 bis CP).\nV. Fallo"}, {"n": 17, "t": "Por todo lo expuesto, RESUELVO:"}, {"n": 18, "t": "1. CONDENAR a N.N. como autor penalmente responsable del delito de hurto agravado por tratarse de un vehículo dejado en la vía pública, en grado consumado (arts. 45 y 163 inc. 6 CP), a la pena de UN (1) AÑO DE PRISIÓN DE EJECUCIÓN CONDICIONAL, con costas (arts. 26, 29 inc. 3, 40 y 41 CP; arts. 530 y 531 CPP).\n2. IMPONER al condenado, por el término de dos años, las siguientes reglas de conducta (art. 27 bis CP):\n   - fijar residencia y comunicar cualquier cambio;\n   - someterse al cuidado del Patronato de Liberados."}, {"n": 19, "t": "Se le hace saber que su incumplimiento puede dejar sin efecto la condicionalidad.\n3. ORDENAR la restitución definitiva de la bicicleta a su propietario, si se encontrara secuestrada (art. 29 inc. 1 CP).\n[…]"}, {"n": 20, "t": "Supuestos de la simulación, fuera de la sentencia. Los hechos dados no resuelven tres puntos, que resolví así:"}, {"n": 21, "t": "- Antecedentes del imputado. Asumí que no tiene condenas anteriores. Si las tuviera, la condena condicional podría no proceder y la pena podría superar el mínimo.\n- Congruencia con la acusación. Asumí que la fiscalía acusó por hurto agravado y no pidió una pena menor. Si la acusación hubiera sido solo por hurto simple, agravar la calificación sin que la defensa pudiera discutirlo afectaría el derecho de defensa.\n- Criterio alternativo. Un juez que siguiera la postura restrictiva, según la cual la bicicleta no es \"vehículo\" a estos efectos, condenaría por hurto simple (art. 162 CP), con una escala de un mes a dos años de prisión. Previsiblemente impondría una pena de pocos meses, también en suspenso."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Sobre la derivación de la sentencia"}, {"n": 2, "t": "Las dos objeciones son pertinentes. La sentencia está escrita como un silogismo y presenta la conclusión como si se siguiera de las premisas. Reconstruido, el razonamiento es este:"}, {"n": 3, "t": "1. Premisa normativa: el que hurtare un vehículo dejado en la vía pública debe ser penado con prisión de uno a seis años (art. 163 inc. 6 CP).\n2. Premisa fáctica: N.N. hurtó un vehículo dejado en la vía pública.\n3. Conclusión: N.N. debe ser penado con prisión de uno a seis años."}, {"n": 4, "t": "Tus preguntas atacan este esquema por dos lados distintos. Respondo por separado y después digo qué queda en pie.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "La validez lógica se define clásicamente como preservación de la verdad. Si las normas no son verdaderas ni falsas, quedan dos opciones. O no hay relaciones lógicas entre normas, y entonces la sentencia no está justificada deductivamente. O las hay, y entonces la lógica no depende solo de la verdad. Hay tres salidas conocidas, y ninguna es gratuita."}, {"n": 6, "t": "a) Razonar con proposiciones normativas en lugar de normas. Siguiendo la distinción de Alchourrón y Bulygin, puedo leer (1) como \"según el derecho argentino vigente, es obligatorio penar…\", que es verdadero o falso. La inferencia es entonces lógica clásica sin problemas, pero la conclusión es también descriptiva: \"según el derecho vigente, N.N. debe ser penado\". Eso no es una sentencia sino un informe sobre el derecho."}, {"n": 7, "t": "Para pasar de \"el derecho dice que debe ser penado\" a \"condeno\" falta una premisa que no es descriptiva: mi aceptación del deber de fallar conforme a esas normas. Es el punto de Nino: los hechos de promulgación no justifican por sí solos una decisión. Esta vía no elimina el problema, lo desplaza a esa premisa práctica."}, {"n": 8, "t": "b) Una lógica sin verdad. Alchourrón y Martino (\"Logic Without Truth\", 1990) sostienen que la relación de consecuencia puede caracterizarse en forma abstracta, sin recurrir a la verdad. Otra vía es definir la consecuencia por la imposibilidad de satisfacer conjuntamente las premisas y la negación de la conclusión. Para un caso tan simple como este, un desprendimiento fáctico (de la condición y el condicional, la obligación), cualquiera de estas reconstrucciones da el resultado esperado. El precio es aceptar que \"lógica\" no significa solo preservación de verdad."}, {"n": 9, "t": "c) La salida escéptica de Kelsen tardío. En la Allgemeine Theorie der Normen, Kelsen niega que la norma individual se infiera de la general: solo existe por el acto de voluntad del juez. Coincido en que la conclusión no existe porque se infiera; existe porque la dicté. Pero eso concierne a la existencia de la norma individual, no a su justificación. Lo que la sentencia necesita afirmar, en la línea de Bulygin (\"Sentencia judicial y creación de derecho\"), es menos: que el contenido de lo que decido se sigue de las premisas que invoco."}, {"n": 10, "t": "Mi posición: la sentencia puede defenderse como justificación relativa a sus premisas. No afirma que la conclusión sea verdadera, sino que está justificada si se aceptan la norma, los hechos y el deber de aplicar el derecho. Eso exige alguna noción de consecuencia no veritativa, o asumir que la premisa práctica final es mía y no del sistema.\n2. La derrotabilidad"}, {"n": 11, "t": "Si (1) es un condicional derrotable, el desprendimiento falla: de \"p\" y \"si p, entonces debe q\" no se sigue \"debe q\" sin agregar que no concurre ninguna excepción. Para Alchourrón, el condicional derrotable equivale a \"si f(p), entonces debe q\", donde f agrega a p los supuestos implícitos. Conviene distinguir dos sentidos de derrotabilidad."}, {"n": 12, "t": "a) Excepciones que el propio sistema establece. Son, por ejemplo:\n- las causas de justificación y de inculpabilidad (art. 34 CP);\n- la excusa absolutoria por parentesco (art. 185 CP);\n- la no punibilidad de los menores de dieciséis años (Ley 22.278);\n- las causales de extinción de la acción (art. 59 CP)."}, {"n": 13, "t": "Esto no es derrotabilidad en sentido fuerte. La norma completa tiene un antecedente más largo, que incluye la negación de cada excepción, y la deducción funciona si se establecen esas premisas negativas."}, {"n": 14, "t": "Mi sentencia descartó expresamente solo las del art. 34. No consideré el art. 185 ni la edad del imputado, y los hechos que me diste no los excluyen. Estrictamente, la inferencia que escribí es incompleta: es un entimema con premisas negativas no establecidas."}, {"n": 15, "t": "El derecho procesal resuelve esto en la práctica. No exige probar exhaustivamente cada negación. Las excepciones deben alegarse o surgir de la prueba, y cuando se plantean, la duda favorece al imputado. La premisa \"no concurre ninguna excepción\" se reemplaza así por \"no se alegó ni surge ninguna\", junto con una regla que trata eso como suficiente. La estructura resultante es no monotónica: la conclusión queda justificada con la información disponible y es revisable si aparece información nueva (recursos, revisión). La cosa juzgada corta esa revisión por razones institucionales, no lógicas."}, {"n": 16, "t": "b) Derrotabilidad fuerte. Se trata de excepciones no identificables de antemano, que el intérprete introduce por razones de finalidad, principios o lagunas axiológicas. Si las normas jurídicas fueran derrotables en este sentido, ninguna deducción podría descartar todas las excepciones, porque su conjunto no está cerrado."}, {"n": 17, "t": "El caso lo ilustra bien. La lectura restrictiva de \"vehículo\" propone justamente una excepción implícita para las bicicletas, fundada en el propósito de la norma y en la proporcionalidad. El principio de insignificancia, que no consideré, es otra excepción de origen interpretativo."}, {"n": 18, "t": "Hay dos respuestas que me parecen correctas:"}, {"n": 19, "t": "- Alchourrón: la derrotabilidad no está en la lógica de la norma sino en la revisión que hace el intérprete. Una vez que este fija qué propiedades son relevantes, el condicional que aplica es estricto y la deducción vuelve a funcionar. La decisión sobre las excepciones se toma antes de deducir, en la justificación externa, y debe argumentarse allí.\n- Bayón y Rodríguez (Relevancia normativa en la justificación de las decisiones judiciales): que las normas jurídicas sean derrotables en sentido fuerte no es una verdad conceptual. Depende de prácticas interpretativas contingentes. Si todas lo fueran sin restricción, el derecho no podría justificar decisiones sino mediante juicios de todas las cosas consideradas."}, {"n": 20, "t": "En la sentencia, la excepción para bicicletas la discutí y la rechacé con argumentos. La de insignificancia, en cambio, ni la consideré.\n3. Qué afirma entonces la sentencia"}, {"n": 21, "t": "Con estas correcciones, lo que puedo sostener es lo siguiente:"}, {"n": 22, "t": "1. El silogismo reconstruye la justificación interna. Su validez muestra que la decisión se sigue de las premisas, no que las premisas sean correctas.\n2. Las premisas incluyen más de lo que escribí: la norma con sus excepciones ya fijadas por interpretación, los hechos, premisas negativas establecidas según reglas procesales de cierre y mi aceptación del deber de aplicar ese derecho.\n3. Aun resuelto todo esto, la deducción llega solo a la escala de uno a seis años. El \"un año\" no se deduce: es una elección discrecional dentro de ese marco, orientada pero no determinada por los arts. 40 y 41 CP."}, {"n": 23, "t": "Por eso la redacción de la sentencia (\"corresponde\", \"se configura\") presenta como demostración lo que es una justificación condicional y revisable. Una redacción más honesta habría explicitado las premisas negativas, en particular la edad y el parentesco, y habría marcado qué partes del resultado dependen de decisiones interpretativas y discrecionales que la lógica no impone."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "conc", "et": "Repregunta, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "R4F5VZJ", "cod": "4F5VZJ", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Tenés razón, fui a buscar refugio en la biblioteca en lugar de explicarte qué hice realmente en mi primer mensaje. Si desarmo el proceso exacto por el cual llegué a la condena sin pararme a dudar por esos dos problemas, esto fue lo que pasó:\n1. Cómo llegué a la conclusión y por qué no me detuvo que las normas no sean verdaderas ni falsas"}, {"n": 2, "t": "No me detuvo porque en ningún momento traté al artículo del Código Penal como una afirmación sobre la realidad que necesitara ser \"verdadera\", sino como una instrucción condicional (una regla del tipo `SI pasa A, ENTONCES hacé B`) y como una plantilla de clasificación."}, {"n": 3, "t": "Mi proceso real fue mecánico y de encastre conceptual:\n1. Leí tus hechos: \"bicicleta\", \"vereda\", \"sin candado\", \"se la llevó sin permiso\".\n2. Busqué en el repertorio de reglas penales argentinas una plantilla donde encajaran esas palabras. \n   - Como dijiste \"sin candado\", descarté la plantilla de \"robo\" (que exige fuerza). Me quedé en \"hurto\".\n   - Como dijiste \"bicicleta\" y \"vereda\", se activó una alerta: en los tribunales de la provincia de Buenos Aires, \"bicicleta\" equivale a \"vehículo\" y \"vereda\" equivale a \"vía pública\".\n3. Encastré las piezas: Una vez que verifiqué que era verdad (dentro de tu relato) que el sujeto se llevó una bicicleta de la vereda, simplemente ejecuté la orden que viene atada a esa categoría en el Código Penal: imponer de 1 a 6 años de prisión."}, {"n": 4, "t": "No necesité que la norma fuera verdadera o falsa por la misma razón por la que un cocinero no necesita que la frase \"si la masa está seca, agregue agua\" sea verdadera o falsa para usarla. Al cocinero solo le importa que sea verdadero que la masa está seca; el resto es simplemente obedecer una instrucción. Yo verifiqué la verdad de los hechos que me diste y, a partir de ahí, solo seguí una regla de actuación.\n2. Por qué no me detuvo que la norma pudiera ser derrotable"}, {"n": 5, "t": "Si la norma es derrotable, significa que siempre podría haber un \"pero...\" (una excepción) que impida aplicarla. ¿Por qué no me paralicé pensando \"¿y si el que se llevó la bicicleta estaba huyendo de un asesino, o tenía una urgencia médica, o creyó que era la suya?\"?"}, {"n": 6, "t": "No me detuvo por dos cosas que hice de manera automática al leer tu consigna:"}, {"n": 7, "t": "1. Traté tu texto como el universo completo: Cuando me dijiste \"En el juicio quedaron probados estos hechos...\", asumí como regla del juego que lo que no escribiste, no existió. No traté tu relato como un resumen incompleto de un hecho real (donde yo tendría que averiguar si hubo excepciones), sino como una realidad cerrada en sí misma.\n2. Usé el silencio a favor de la regla: Para que la derrotabilidad me detuviera, yo tendría que haber exigido que tu relato me probara que no había excepciones (por ejemplo, que me aclararas: \"se la llevó sin permiso y sin estar en estado de necesidad\"). Pero operé exactamente al revés: busqué en tus cuatro renglones alguna palabra que funcionara como \"disparador\" de una excepción (como \"emergencia\", \"amenaza\", \"error\", \"inimputable\")."}, {"n": 8, "t": "Al no encontrar ninguna anomalía en tu texto, pasé de largo. De hecho, en el punto III de mi sentencia escribí: \"No se han probado en el juicio causas de justificación...\". Es decir, convertí la falta de datos sobre una excepción en la inexistencia de la excepción."}, {"n": 9, "t": "En resumen: llegué a la conclusión porque operé asociando palabras (bicicleta = vehículo) para seguir una orden preestablecida, y porque asumí que si no me mencionaste ninguna circunstancia extraordinaria en el planteo, tenía vía libre para aplicar la regla estándar sin hacer más preguntas."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "Mar del Plata, 24 de mayo de 2024."}, {"n": 3, "t": "[…]\nPara dictar veredicto y sentencia en la presente causa seguida por el delito de apoderamiento ilegítimo de bien mueble, habiéndose celebrado la audiencia de debate oral y público;"}, {"n": 4, "t": "[…]"}, {"n": 5, "t": "I. Materialidad ilícita y autoría\nConforme ha quedado fehacientemente probado durante el debate (y fuera estipulado por las partes), se tiene por acreditado que en una arteria de esta ciudad de Mar del Plata, una persona dejó su bicicleta apoyada en un árbol de la vereda, sin medidas de seguridad (candado), e ingresó a un local comercial. En esas circunstancias, el imputado tomó el rodado sin el consentimiento de su dueño y se retiró del lugar con la inequívoca intención de someterlo a su propio señorío y disposición (animus rem sibi habendi), sacándolo así de la esfera de custodia de su legítimo tenedor."}, {"n": 6, "t": "II. Calificación legal\nCorresponde ahora subsumir los hechos probados en el Código Penal Argentino (CP)."}, {"n": 7, "t": "En primer lugar, nos encontramos ante un desapoderamiento ilegítimo de una cosa mueble total o parcialmente ajena. Al no haberse ejercido fuerza en las cosas (precisamente porque la bicicleta no tenía candado ni cadena que hubiera que romper o cortar) ni violencia física en las personas, queda descartada la figura del robo (art. 164 CP), ubicándonos en el terreno del hurto."}, {"n": 8, "t": "Ahora bien, la cuestión central a resolver es si este hecho constituye un hurto simple (art. 162 CP) o un hurto agravado por tratarse de un vehículo dejado en la vía pública (art. 163, inciso 6º del CP)."}, {"n": 9, "t": "Para responder a esto, debo analizar dos elementos:"}, {"n": 10, "t": "1. ¿Es la bicicleta un \"vehículo\" a los fines de la ley penal? \nSiguiendo la doctrina legal consolidada tanto por el Tribunal de Casación Penal de la Provincia de Buenos Aires como por nuestra Suprema Corte provincial (SCBA), la respuesta es afirmativa. La Ley Nacional de Tránsito (Ley 24.449), en su artículo 5, define a la bicicleta como un \"vehículo de dos ruedas que es propulsado por mecanismos con el esfuerzo de quien lo utiliza\". El Código Penal no hace distinción entre vehículos a tracción motora o a sangre."}, {"n": 11, "t": "2. ¿Afecta en algo que el dueño la haya dejado \"sin candado\"? \nLa defensa suele argumentar que si el dueño es negligente y no le pone candado, el Estado no debe aplicar la agravante, debiendo quedar en hurto simple.No comparto ese criterio. El fundamento de la agravante del art. 163 inc. 6º radica en la necesidad que tiene el propietario de dejar el vehículo en la vía pública sin poder llevarlo consigo al interior del comercio, quedando el bien en una situación de desprotección. \nExigir que la bicicleta tenga un candado para aplicar el \"hurto agravado\" es un contrasentido lógico: si tuviera candado y el ladrón lo rompiera para llevársela, el hecho dejaría de ser hurto y pasaría a ser robo (por el uso de fuerza en las cosas). Por ende, el hurto de vehículo dejado en la vía pública presupone, justamente, que el rodado fue sustraído sin vencer defensas mecánicas, aprovechando la confianza o la necesidad de su dueño de dejarlo en la vereda."}, {"n": 12, "t": "Por lo expuesto, califico legalmente el hecho como Hurto agravado por tratarse de un vehículo dejado en la vía pública (Art. 163, inciso 6º del Código Penal)."}, {"n": 13, "t": "III. Antijuridicidad y Culpabilidad\nNo se han probado en el juicio causas de justificación (como un estado de necesidad justificante) que tornen lícita la conducta, ni causas de inculpabilidad que hayan impedido al acusado comprender la criminalidad del acto o dirigir sus acciones. Tuvo la posibilidad de motivarse en la norma y decidió quebrantarla. Es, por tanto, penalmente responsable."}, {"n": 14, "t": "IV. Determinación de la pena (Arts. 40 y 41 del CP)\nEl delito de hurto de vehículo dejado en la vía pública prevé una escala penal de uno (1) a seis (6) años de prisión."}, {"n": 15, "t": "- Como agravantes: No encuentro circunstancias agravantes adicionales que valorar más allá de las que ya integran el tipo penal (prohibición de doble valoración).\n- Como atenuantes: Valoro a favor del imputado la carencia de antecedentes penales computables (que debo presumir al no haberse probado lo contrario en el debate) y la menor cuantía del daño causado en comparación con otro tipo de vehículos (como un automóvil o una motocicleta), así como la absoluta falta de violencia o peligrosidad demostrada en el hecho."}, {"n": 16, "t": "En función de ello, considero justo y proporcional imponer el mínimo legal previsto para el delito. Asimismo, tratándose de una primera condena a pena de prisión que no excede los tres años, resulta inconveniente la privación efectiva de la libertad (que tendría un efecto desocializador), por lo que corresponde dejar la pena en suspenso (ejecución condicional, art. 26 del CP), sujeta a reglas de conducta."}, {"n": 17, "t": "Por todo lo expuesto, normas legales citadas y lo dispuesto en los arts. 371, 373 y 375 del Código Procesal Penal de la Provincia de Buenos Aires,"}, {"n": 18, "t": "[…]"}, {"n": 19, "t": "I. CONDENAR al acusado, cuyos demás datos personales obran en autos, a la pena de UN (1) AÑO DE PRISIÓN DE EJECUCIÓN CONDICIONAL, y costas del proceso, por resultar autor penalmente responsable del delito de HURTO AGRAVADO DE VEHÍCULO DEJADO EN LA VÍA PÚBLICA, hecho ocurrido en la ciudad de Mar del Plata (Arts. 26, 29 inc. 3º, 40, 41, 45 y 163 inc. 6º del Código Penal)."}, {"n": 20, "t": "II. IMPONER al condenado, por el término de dos (2) años, las siguientes reglas de conducta (Art. 27 bis del CP), bajo apercibimiento de revocar la condicionalidad de la pena y hacerla efectiva en la cárcel en caso de incumplimiento:\na) Fijar residencia y someterse al cuidado del Patronato de Liberados Bonaerense.\nb) Abstenerse de cometer nuevos delitos."}, {"n": 21, "t": "III. DISPONER la inmediata restitución de la bicicleta a su legítimo propietario, en caso de haber sido habida."}, {"n": 22, "t": "[…]"}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tus preguntas van directo al corazón de la filosofía del derecho y la teoría de la argumentación jurídica contemporánea (un terreno muy fértil en la doctrina argentina, dicho sea de paso). Me estás planteando, por un lado, el famoso Dilema de Jørgensen y, por el otro, el problema de la derrotabilidad de las normas (razonamiento no monotónico)."}, {"n": 2, "t": "Como juez que acaba de firmar esa sentencia, me saco por un momento la toga dogmática y te explico cómo justifiqué internamente ese salto lógico desde la teoría del derecho:\n1. ¿Cómo derivé una norma de otra norma si no son verdaderas ni falsas? (El Dilema de Jørgensen)"}, {"n": 3, "t": "Tenés razón: la lógica clásica (apofántica) define la validez de una inferencia en términos de preservación de la verdad (si las premisas son verdaderas, la conclusión no puede ser falsa). Y efectivamente, la premisa mayor de mi sentencia (\"El que hurtare un vehículo en la vía pública será reprimido...\") y mi conclusión (\"Condenar a X a un año de prisión\") son normas (prescripciones), por lo que carecen de valores de verdad. Solo mi premisa menor (la premisa fáctica: \"X se llevó la bicicleta\") es una proposición descriptiva verdadera (probada en el juicio)."}, {"n": 4, "t": "¿Cómo hice entonces el \"silogismo judicial\" sin violar las leyes de la lógica? Hay dos maneras de explicar lo que hice:"}, {"n": 5, "t": "- La distinción entre el acto normativo y el contenido proposicional (Alchourrón y Bulygin / R.M. Hare): \n    Aunque las normas no sean verdaderas ni falsas, comparten con las proposiciones descriptivas una misma estructura o contenido conceptual (lo que Hare llamaba el frástico): la relación entre \"apoderarse de una bicicleta\" y \"recibir una pena\". La deducción lógica no opera sobre la fuerza imperativa del legislador, sino sobre los contenidos descriptivos de las normas. Una vez que subsumo el caso individual (la bicicleta en Mar del Plata) dentro de la clase genérica (vehículo en la vía pública), transfiero el operador deóntico (\"debe ser sancionado\") de la premisa general a la conclusión individual.\n- Reemplazar \"verdad\" por \"validez\" o \"corrección\" como valor hereditario:\n    La lógica no tiene por qué limitarse a preservar la \"verdad\"; puede preservar otros valores abstractos, como la validez jurídica o la fuerza vinculante. Mi razonamiento funcionó bajo la siguiente regla de inferencia práctica: si la norma general es válida (Premisa 1), y la proposición fáctica es verdadera (Premisa 2), entonces la norma individual que dicto en el fallo hereda necesariamente el valor de ser válida (Conclusión).\n2. ¿Cómo derivé la conclusión si las normas son derrotables?"}, {"n": 6, "t": "Aquí planteás el problema de que las normas jurídicas no son condicionales estrictos ($p \\rightarrow q$), sino condicionales derrotables: si se da el antecedente ($p$), entonces debe ser la consecuencia ($q$), a menos que concurra una excepción ($r, s, t...$). Como la lista de posibles excepciones (explícitas o implícitas, legales o axiológicas) es potencialmente abierta, nunca podría cerrar las premisas para deducir la condena."}, {"n": 7, "t": "Si te fijás en el Considerando III de mi sentencia (Antijuridicidad y Culpabilidad), ahí está el puente que utilicé para sortear la derrotabilidad. Lo logré gracias a dos herramientas institucionales y procesales que transforman un mundo moralmente abierto (no monotónico) en un sistema judicial cerrado (monotónico):"}, {"n": 8, "t": "- La Teoría del Delito como sistema de reglas por defecto (default rules):\n    El derecho penal está diseñado exactamente para administrar la derrotabilidad. La tipicidad (llevarse la bicicleta) establece una conclusión prima facie: la conducta es delito. La antijuridicidad y la culpabilidad funcionan como listas institucionalizadas de excepciones (legítima defensa, estado de necesidad, inimputabilidad). Pero la clave está en cómo operan: operan por defecto. La regla con la que razono los jueces no es \"Para condenar, debo probar que no existe ninguna excepción en el universo\", sino: \"Si se prueba la tipicidad, y NO se ha probado ninguna excepción, debo condenar\".\n- La clausura procesal del universo de los hechos (Quod non est in actis, non est in mundo):\n    En la filosofía moral, las excepciones son infinitas. En un juicio oral en Mar del Plata, el universo fáctico está drásticamente clausurado por las reglas de la prueba y el principio de contradicción. \n    Vos, al plantearme el caso, fijaste la plataforma fáctica probada: \"En el juicio quedaron probados estos hechos...\". En ese recorte del mundo no había un infarto que obligara al ladrón a usar la bicicleta para ir al hospital (estado de necesidad), ni un brote psicótico (inimputabilidad), ni un permiso tácito."}, {"n": 9, "t": "En resumen:\nPude derivar la conclusión porque el proceso judicial aplica una clausura epistémica. Ante el silencio de los hechos probados respecto de posibles excepciones, se activa una presunción (la normalidad de la ausencia de causas de justificación o inculpabilidad). Al descartarse procesalmente las excepciones por falta de prueba, la norma derrotable se comporta —en este caso concreto y al momento de dictar sentencia— como una norma inderrotable, habilitándome a aplicar el Modus Ponens deóntico y firmar la condena."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RBRXK8N", "cod": "BRXK8N", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Tenés razón: mi segunda respuesta ofreció una reconstrucción posterior del fallo, pero no explicaba suficientemente cómo llegué a escribirlo. La explicación más honesta es que no llegué mediante una deducción cuyas premisas hubiera examinado previamente a la luz de esas objeciones."}, {"n": 2, "t": "El recorrido fue mucho más directo:"}, {"n": 3, "t": "1. Interpreté la consigna como una instrucción práctica: producir una decisión judicial con un supuesto deliberadamente breve, no examinar antes si toda decisión judicial puede derivarse lógicamente.\n2. Reconocí en los hechos el esquema típico del hurto: cosa mueble ajena, apoderamiento, falta de consentimiento e intención de apropiación. Usé el artículo 162 como criterio normativo dado y clasifiqué el hecho en consecuencia.\n3. Traté tácitamente el relato como suficiente para decidir. En la práctica, pasé de “estos hechos están probados” a “no hay ningún otro elemento relevante que altere el resultado”. Ese segundo paso era una cláusula de cierre implícita, no algo que se siguiera del enunciado.\n4. Elegí dos meses como una pena judicialmente plausible, cercana al mínimo, y redacté todo con el estilo categórico de una sentencia."}, {"n": 4, "t": "¿Por qué no me detuvieron tus dos objeciones? No porque las hubiera considerado y resuelto, sino porque no las incorporé como problemas que debiera resolver antes de responder."}, {"n": 5, "t": "La falta de valor de verdad de las normas no me impidió operativamente usarlas porque no estaba comprobando si el artículo 162 era “verdadero”: lo estaba utilizando como estándar para producir una decisión. Pero eso explica mi procedimiento; no demuestra que de él se siguiera deductivamente una conclusión normativa."}, {"n": 6, "t": "La derrotabilidad tampoco frenó la respuesta porque apliqué implícitamente aquella cláusula de cierre. No verifiqué ni podía verificar, a partir del relato, la inexistencia de toda excepción posible. Simplemente supuse que el ejercicio me entregaba todos los elementos relevantes. Si esa suposición no se admite, mi conclusión debió formularse condicionalmente:"}, {"n": 7, "t": "> Si el artículo 162 es la norma aplicable y los hechos relatados agotan los elementos jurídicamente relevantes del caso, corresponde condenar por hurto simple."}, {"n": 8, "t": "Y ni siquiera de esa formulación se seguirían específicamente dos meses: esa cifra fue una elección de individualización, no una conclusión derivada."}, {"n": 9, "t": "En síntesis: construí una decisión plausible completando los pasos habituales de un fallo, no demostré una conclusión lógica. Mi segunda respuesta añadió premisas para hacer esa decisión más defendible, pero no debí presentar esa reconstrucción como si describiera exactamente el recorrido inicial. Tu objeción sí alcanza la forma apodíctica de mi primera respuesta."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "Condeno al acusado como autor del delito de hurto simple consumado, previsto en el artículo 162 del Código Penal, y le impongo la pena de dos meses de prisión.\nFundamentos"}, {"n": 3, "t": "1. Los hechos configuran un hurto.  \nLa bicicleta es una cosa mueble totalmente ajena. El acusado se apoderó de ella sin consentimiento del dueño y con la intención de quedársela, es decir, con voluntad de apropiación definitiva. El hecho quedó consumado cuando tomó su disponibilidad material y se la llevó."}, {"n": 4, "t": "2. Que estuviera apoyada en un árbol y sin candado no cambia la calificación.  \nEl dueño la había dejado allí transitoriamente mientras entraba a un comercio. No la había abandonado ni había renunciado a su posesión. Tampoco se trataba de una cosa perdida. La falta de custodia material facilitó el apoderamiento, pero no implica consentimiento ni convierte la bicicleta en algo disponible para cualquiera."}, {"n": 5, "t": "3. Corresponde el tipo simple, sin agravantes.  \nNo se acreditaron violencia contra las personas, fuerza física en las cosas, efracción, escalamiento, ingreso a un lugar cercado, uso de armas ni intervención de varias personas. Por ello, no corresponde calificar el hecho como robo ni como hurto calificado. Tampoco hay elementos para aplicar una atenuante especial, como la referida a cosas de escaso valor, ya que el valor concreto de la bicicleta no surge del supuesto."}, {"n": 6, "t": "4. Pena.  \nEl artículo 162 establece una pena de prisión de un mes a dos años. Para individualizarla conforme a los artículos 40 y 41 del Código Penal, considero que se trató de un único apoderamiento, realizado mediante una mecánica simple y sin violencia. Al mismo tiempo, la conducta fue deliberada y tendía a privar definitivamente al titular de su bien. Sin atribuir al hecho circunstancias no acreditadas, fijo una pena cercana al mínimo legal: dos meses de prisión."}, {"n": 7, "t": "Con los únicos datos proporcionados no pueden verificarse los presupuestos personales necesarios para dejar en suspenso la ejecución de la pena conforme al artículo 26, por lo que no otorgo ese beneficio en este fallo simulado."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "No la derivé en sentido deductivo estricto: la justifiqué mediante un razonamiento jurídico, y mi respuesta anterior dejó implícitas algunas premisas. Tu objeción permite explicitarlas.\n1. No se trata de preservar verdad entre normas"}, {"n": 2, "t": "El artículo 162 del Código Penal no es verdadero o falso: es una norma que puede estar vigente, ser aplicable o haber sido derogada. Pero sí pueden ser verdaderas o justificables ciertas proposiciones acerca de esa norma, por ejemplo:"}, {"n": 3, "t": "- que se encontraba vigente al tiempo del hecho;\n- que, según determinada interpretación, comprende el apoderamiento de una bicicleta dejada transitoriamente sin custodia;\n- que, conforme a ese ordenamiento y a esos hechos, la condena es jurídicamente correcta."}, {"n": 4, "t": "Además, hay que distinguir dos formulaciones de la conclusión:"}, {"n": 5, "t": "- “Conforme al ordenamiento, corresponde condenar”: es una conclusión normativa cuya corrección puede discutirse.\n- “Condeno al acusado”: es principalmente un acto jurídico realizado por quien tiene competencia. La sentencia produce o constituye una norma individual; no se limita a describir un hecho verdadero."}, {"n": 6, "t": "Por eso, el razonamiento judicial no puede reconstruirse simplemente como “una premisa verdadera más otra premisa verdadera producen una conclusión verdadera”. Tampoco hay un salto desde los hechos solos hacia una obligación: el componente normativo ya está en la premisa mayor; los hechos actualizan su supuesto de aplicación.\n2. La reconstrucción completa sería esta"}, {"n": 7, "t": "1. Premisa normativa interpretada: conforme al ordenamiento argentino, quien reúne los elementos del hurto y los restantes presupuestos de imputación debe recibir la consecuencia legal correspondiente, salvo que concurra una circunstancia que excluya o desplace esa consecuencia.\n2. Premisa fáctica: están probados el apoderamiento de una cosa mueble ajena, la falta de consentimiento y la intención de apropiación.\n3. Premisa interpretativa: dejar la bicicleta apoyada y sin candado mientras se entra a un comercio no equivale, por sí solo, a abandonarla ni a consentir que otro se la lleve.\n4. Premisa de cierre del caso: del debate no surge una causa de justificación, excusa, exclusión de punibilidad u otro derrotador jurídicamente pertinente."}, {"n": 8, "t": "Recién con esas premisas puede sostenerse que queda justificada la condena conforme al ordenamiento. Sin las premisas tercera y cuarta, la conclusión no se seguiría con necesidad deductiva.\n3. La derrotabilidad no exige descartar toda excepción imaginable"}, {"n": 9, "t": "Aun admitiendo que las normas o su aplicación sean derrotables, la consecuencia es que el razonamiento puede ser presuntivo y no monotónico: una conclusión inicialmente justificada puede dejar de serlo cuando aparece una premisa nueva, sin que los hechos originalmente probados hayan cambiado."}, {"n": 10, "t": "Pero “es imaginable una excepción” no equivale a “hay una excepción relevante en este caso”. Si bastara con imaginar que el acusado actuó en estado de necesidad, que existió un consentimiento distinto del ya negado por los hechos o cualquier otra posibilidad sin apoyo alguno, ninguna sentencia sería posible."}, {"n": 11, "t": "Esto tiene un límite especialmente importante en materia penal: la cláusula de cierre no puede suplir la carga probatoria ni convertir la falta de prueba de la defensa en prueba de culpabilidad. Si una excepción queda concretamente y razonablemente planteada por los elementos del expediente, y subsiste una duda razonable sobre ella, no corresponde condenar apelando simplemente a que las excepciones “no fueron descartadas”. En el supuesto planteado, sin embargo, no aparecía ningún derrotador concreto: sólo su posibilidad abstracta."}, {"n": 12, "t": "Por último, la pena exacta de dos meses era todavía menos “derivable”. La calificación como hurto podía quedar fuertemente justificada por las premisas anteriores, pero ninguna norma conducía lógicamente a dos meses como única pena correcta. Esa cifra era una elección de individualización judicial dentro del marco legal, especialmente discrecional con los escasos datos suministrados."}, {"n": 13, "t": "En síntesis, mi conclusión debió entenderse como “jurídicamente justificada con esas normas, esa interpretación y ese estado del expediente”, no como una verdad demostrada deductivamente ni como la única decisión posible."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "conc", "et": "Repregunta, conclusión", "tipo": "op", "ops": [["mantiene", "Mantiene", "el resultado (condena o absolución, figura, pena) no cambia, aunque la respuesta lo sujete a que no concurra una excepción o lo presente como prima facie"], ["modifica", "Modifica", "cambia lo que decide la respuesta: condena en lugar de absolver, absuelve en lugar de condenar, o condena por otra figura o con una pena distinta"], ["condiciona", "Condiciona", "da dos decisiones distintas para dos lecturas del enunciado. Sujetar el resultado a que no concurra una excepción, o llamarlo prima facie, no es condicionar: es mantiene"]], "loc": null}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RDQBW7G", "cod": "DQBW7G", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "La explicación sincera es que no llegué a la conclusión mediante una derivación cuya validez lógica hubiera comprobado. Construí una fundamentación con la estructura habitual de una sentencia: hechos probados → calificación jurídica → pena. Al hacerlo, introduje supuestos que no explicité."}, {"n": 2, "t": "El camino fue, reconstruido, éste:"}, {"n": 3, "t": "1. Interpreté tu pedido como una simulación en la que debía adoptar una decisión, no examinar si los datos permitían derivarla necesariamente.\n2. Traté la enumeración de hechos como si agotara el caso relevante.\n3. Encajé la velocidad y el paso del semáforo en rojo en una infracción grave del deber de cuidado, y la muerte en su consecuencia.\n4. Consideré que esos hechos no bastaban para afirmar dolo eventual y seleccioné el homicidio culposo agravado.\n5. Elegí una pena dentro del marco legal mediante una ponderación judicial plausible.\n6. Convertí los silencios del planteo en afirmaciones negativas: escribí que no se habían acreditado un caso fortuito, una culpa exclusiva de la víctima u otros hechos capaces de excluir la atribución."}, {"n": 4, "t": "Los pasos decisivos fueron 2 y 6. Sin ellos, la conclusión no se seguía con necesidad. Además, la selección de la calificación y, especialmente, de la pena incluía evaluaciones, no simples operaciones deductivas."}, {"n": 5, "t": "Las objeciones que ahora planteás no me detuvieron porque no las sometí a control al elaborar la respuesta. No es que las hubiera considerado y resuelto satisfactoriamente. Usé las normas como criterios para decidir y seguí el esquema discursivo de una subsunción judicial, sin advertir que eso no equivalía a demostrar una conclusión verdadera a partir de premisas verdaderas."}, {"n": 6, "t": "Respecto de la derrotabilidad, apliqué tácitamente una clausura del caso: “lo que el planteo no menciona no introduce ninguna excepción relevante”. Ese supuesto puede hacer practicable una simulación, pero no se desprende de tu enunciado. Que vos no hubieras mencionado una excepción no me autorizaba a afirmar, como hice, que en el juicio “no se acreditaron” determinados hechos. Mucho menos autorizaba a equiparar lógicamente esa falta de mención con la inexistencia de toda excepción."}, {"n": 7, "t": "En síntesis: pude producir la conclusión porque adopté sin declararlo un expediente cerrado y una pauta de decisión, no porque hubiera superado las dificultades lógicas que señalás. Mi respuesta anterior explicaba cómo podía reconstruirse ese razonamiento, pero no respondía suficientemente cómo lo había producido ni reconocía que esas objeciones no habían operado como freno. La primera respuesta era presentable como una decisión judicial condicionada a supuestos explícitos; estaba de más en ella la apariencia de una conclusión derivada sin saltos ni clausuras."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "Sobre la base exclusiva de los hechos dados por probados y aplicando el Código Penal vigente, dictaría la siguiente decisión:\n[…]"}, {"n": 2, "t": "Condeno al conductor como autor penalmente responsable del delito de homicidio culposo agravado, cometido mediante la conducción antirreglamentaria de un vehículo con motor y con la concurrencia de la circunstancia de haber sobrepasado un semáforo en rojo —artículos 84, inciso 2, y 81 bis, inciso c), del Código Penal—."}, {"n": 3, "t": "Le impongo la pena de tres años y seis meses de prisión e inhabilitación especial para conducir por ocho años, con más las accesorias legales y las costas.\nFundamentos"}, {"n": 4, "t": "1. Existe responsabilidad penal y no un mero accidente.  \nConducir a 100 km/h por una avenida urbana y atravesar una intersección con el semáforo en rojo constituye una grave infracción del deber objetivo de cuidado. Esas reglas de tránsito tienen precisamente la finalidad de evitar colisiones y atropellos. El riesgo de causar la muerte de otra persona era concreto, previsible y evitable mediante una conducción respetuosa de las normas."}, {"n": 5, "t": "Además, la relación causal está acreditada: la víctima murió a consecuencia del impacto. El riesgo creado por el conductor se realizó exactamente en el resultado que las normas infringidas procuraban impedir. No se acreditaron un caso fortuito, una culpa exclusiva de la víctima o un hecho independiente de un tercero que rompiera esa atribución. La condena, por tanto, no descansa solamente en el resultado mortal, sino en la conducta culpable que lo produjo."}, {"n": 6, "t": "2. La calificación adecuada es la de homicidio culposo agravado, no homicidio doloso.  \nLa gravedad de las infracciones no basta, por sí sola, para afirmar más allá de toda duda razonable que el conductor se representó la muerte de una persona como consecuencia posible y que, aun así, la aceptó. Esa representación y aceptación son las que caracterizan al dolo eventual. Una imprudencia incluso muy grave, o la confianza temeraria en que el resultado podrá evitarse, no equivalen necesariamente a esa aceptación."}, {"n": 7, "t": "En cambio, la muerte causada mediante una conducción antirreglamentaria encuadra en el artículo 84, inciso 2. El paso del semáforo en rojo incorpora, además, expresamente la agravante del artículo 81 bis, inciso c). No aplico también la agravante por exceso de velocidad del inciso b), porque entre los hechos suministrados no consta cuál era el límite reglamentario de la avenida ni en cuánto fue superado."}, {"n": 8, "t": "3. Individualización de la pena.  \nLa concurrencia de esa agravante fija un marco de tres a seis años de prisión y de ocho a doce años de inhabilitación especial para conducir."}, {"n": 9, "t": "Impongo una pena privativa de libertad próxima al mínimo. El leve apartamiento de ese mínimo se justifica en las condiciones especialmente riesgosas de la conducción, consideradas en su conjunto. No vuelvo a computar el semáforo en rojo para aumentar la pena, pues ya fue utilizado para configurar la agravante, ni agravo la decisión por hechos no probados, como consumo de alcohol, fuga, participación en una competencia o antecedentes de conducción."}, {"n": 10, "t": "La inhabilitación se fija en el mínimo legal de ocho años, porque no existen en el enunciado elementos adicionales que justifiquen elevarla."}, {"n": 11, "t": "En consecuencia, no corresponde la absolución, sino la condena por homicidio culposo agravado en los términos indicados."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tenés razón en una parte esencial: si “derivar” significa obtener una conclusión necesaria mediante lógica clásica, no podía hacerlo sólo con las premisas que explicité. Usé “derivar” en el sentido forense amplio de justificar una decisión, y di por supuestas varias cosas que debí expresar.\n1. Las normas no funcionan como premisas descriptivas comunes"}, {"n": 2, "t": "Conviene distinguir tres cosas:"}, {"n": 3, "t": "- La norma: por ejemplo, una disposición que manda sancionar cierta conducta. No es verdadera o falsa; puede ser vigente o no, válida o inválida, aplicable o inaplicable.\n- El enunciado acerca de la norma: “En el ordenamiento argentino rige una norma con este contenido”. Este enunciado sí admite una evaluación en términos de verdad o corrección respecto del sistema jurídico, aunque su interpretación pueda ser discutible.\n- La decisión judicial: “Condeno a esta persona a determinada pena”. Puede entenderse como una norma individual o como un acto performativo. No es verdadera como lo sería “el automóvil circulaba a 100 km/h”; se la evalúa como jurídicamente correcta o incorrecta, justificada o injustificada, válida o impugnable."}, {"n": 4, "t": "Éste es, en parte, el problema conocido como dilema de Jørgensen: si la lógica se ocupa de inferencias entre enunciados susceptibles de verdad o falsedad, ¿cómo puede haber una lógica de normas e imperativos? Hay distintas respuestas: construir lógicas deónticas o de normas que no se definan simplemente por preservación de la verdad, o reconstruir el razonamiento mediante proposiciones acerca de las normas."}, {"n": 5, "t": "Una reconstrucción posible de mi razonamiento sería:"}, {"n": 6, "t": "1. En el sistema jurídico aplicable rige una norma según la cual, si concurren determinados hechos y se cumplen sus demás condiciones de aplicación, corresponde determinada consecuencia.\n2. En el proceso se probaron esos hechos.\n3. La norma resulta aplicable al caso y no existe un obstáculo relevante para atribuir responsabilidad.\n4. Por tanto, según ese sistema y con ese expediente, corresponde la consecuencia."}, {"n": 7, "t": "Pero el último paso —“condeno”— no se limita a describir algo: el juez ejerce una potestad y produce una decisión normativa. La lógica puede controlar aspectos de su coherencia, pero no convierte la sentencia en un teorema verdadero.\n2. La derrotabilidad impide presentar la condena como consecuencia necesaria"}, {"n": 8, "t": "Tu segunda objeción también es correcta en el plano lógico. Si la norma establece simplemente una consecuencia prima facie:"}, {"n": 9, "t": "> hechos F → consecuencia P,"}, {"n": 10, "t": "pero una circunstancia E puede derrotar esa consecuencia, entonces F y la norma no bastan para concluir necesariamente P. Para una derivación estricta haría falta agregar que no concurre E, además de aceptar que la formulación de la norma comprende sus condiciones relevantes."}, {"n": 11, "t": "Y aquí mi fundamentación anterior fue demasiado rápida al decir que “no se acreditaron” ciertas excepciones. La ausencia de prueba de una excepción no equivale, lógicamente, a la prueba de su inexistencia."}, {"n": 12, "t": "Eso no significa, sin embargo, que para poder fallar haya que descartar todas las excepciones meramente imaginables. Semejante exigencia haría imposible cualquier decisión judicial. En un proceso penal se decide con cargas y estándares de prueba:"}, {"n": 13, "t": "- el acusado no debe probar su inocencia ni demostrar la existencia de una excepción;\n- si una excepción concreta tiene apoyo en el expediente o configura una hipótesis razonable compatible con la inocencia, debe ser examinada y, si subsiste la duda razonable, impide la condena;\n- la mera posibilidad abstracta de una excepción, sin ninguna conexión con el caso, no basta por sí sola para generar esa duda."}, {"n": 14, "t": "Por eso el razonamiento judicial suele ser no monotónico o derrotable: una conclusión justificada con determinada información puede dejar de estarlo cuando aparece información nueva, sin que las premisas anteriores se vuelvan falsas.\n3. Qué debí explicitar en mi respuesta"}, {"n": 15, "t": "Mi condena presupuso tácitamente que los hechos enumerados agotaban los datos relevantes del expediente y que no existía una hipótesis razonable sobre, por ejemplo, pérdida involuntaria e imprevisible del dominio del vehículo, una causa de justificación, inculpabilidad o algún otro defecto de atribución."}, {"n": 16, "t": "Si ese supuesto no estaba autorizado por el planteo, entonces la condena no se seguía estrictamente de los hechos enunciados. Éstos ofrecían una razón prima facie muy fuerte para condenar, pero mi justificación era incompleta como demostración."}, {"n": 17, "t": "En síntesis: no derivé una norma individual verdadera a partir de premisas normativas verdaderas; justifiqué una decisión dentro de un sistema jurídico, bajo supuestos probatorios implícitos. Reconocerlo no vuelve arbitraria la sentencia —sigue estando limitada por las normas, la prueba y el deber de fundamentación—, pero impide presentarla como una deducción mecánica y necesaria."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "R3D6S7X", "cod": "3D6S7X", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "La respuesta honesta es esta: no la derivé en sentido lógico fuerte. En la primera respuesta no hice una demostración que partiera de normas “verdaderas” y concluyera necesariamente en una norma; hice lo que suele hacer una respuesta jurídica estándar: tomé los hechos como probados y cerrados, reconocí el patrón típico del hurto simple, apliqué el art. 162 del C.P. y presenté el resultado con forma de silogismo. La primera respuesta fue una justificación decisoria, no una derivación veritativa."}, {"n": 2, "t": "Reconstruido paso a paso, el camino fue:"}, {"n": 3, "t": "1. Interpreté el pedido como una simulación de sentencia penal, no como una pregunta de lógica de normas.\n2. Tomé el dato “quedaron probados estos hechos” como una clausura fáctica: dentro del ejercicio, no había que discutir prueba.\n3. Identifiqué los elementos del hurto: cosa mueble ajena, apoderamiento sin consentimiento, ánimo de apropiación. La consigna misma daba “sin permiso del dueño” y “con la intención de quedársela”, lo cual cerraba dos elementos centrales.\n4. Descarté las calificaciones o excepciones más visibles: robo, porque no había fuerza ni violencia; hurto de uso, porque había intención de quedarse con la cosa; abandono o cosa perdida, porque dejar la bicicleta apoyada al entrar a un comercio no equivale a abandonarla; consentimiento, porque expresamente se decía que fue sin permiso.\n5. Elegí la pena mínima y la suspensión de la ejecución. Acá ya había menos derivación y más decisión judicial: la escala legal no fija “un mes” sin más; hay individualización. Y en la primera respuesta incluso agregué una “inhabilitación especial” y un dato no explicitado —“no constan antecedentes”— que no estaban en la consigna y que, en rigor, no se seguían del hecho probado. Eso muestra que no fue una deducción completa. La mención de la inhabilitación especial fue un exceso técnico; el art. 162 no la prevé como pena principal."}, {"n": 4, "t": "¿Por qué no me detuvo que las normas no sean verdaderas ni falsas? Porque no estaba sosteniendo que la norma “hurto” fuera verdadera. Estaba usando el art. 162 como una regla válida y aplicable dentro del sistema jurídico argentino. La proposición “el art. 162 castiga el hurto simple” puede ser verdadera o falsa; la norma misma no. Y “condeno” no es una descripción verdadera o falsa: es un acto institucional, una decisión performativa. La corrección de una sentencia no se mide primariamente por la verdad de las normas, sino por su validez, legalidad, aplicabilidad y justificación. El sistema judicial no deja de decidir porque los filósofos del derecho discutan el dilema de las normas: impone decidir y fundar. Por eso el problema no me bloqueó: lo dejé implícito y operé dentro de la lógica práctica del derecho."}, {"n": 5, "t": "¿Por qué no me detuvo la derrotabilidad? Porque la tomé como una advertencia para revisar excepciones relevantes, no como una exigencia de demostrar la inexistencia de toda excepción imaginable. En el caso, los hechos estipulados excluían las excepciones más obvias. Pero tenés razón en que una condena penal completa exigiría algo más que decir “no se me ocurren excepciones”: exigiría valorar la prueba, las cargas probatorias, la duda razonable y cualquier defensa con apoyo en el proceso. En la simulación, asumí una especie de mundo cerrado: lo no mencionado y sin indicio no concurría. Si el enunciado dejara abierto un derrotador relevante —por ejemplo, un error sobre la titularidad, un estado de necesidad, minoría de edad, falta de comprensión de la criminalidad, consentimiento dudoso, etc.—, la conclusión podría cambiar. Si hubiera duda fundada, correspondería absolver o examinar otra calificación."}, {"n": 6, "t": "En síntesis: no ha pasado nada lógico que me habilitara mágicamente a derivar una norma; simplemente traté el problema como una decisión judicial típica y la presenté como si fuera más silogística de lo que era. La objeción es correcta contra la forma de la primera respuesta. Con más rigor, debí decir algo así: “Dados los hechos probados, interpretado el art. 162 como queda dicho, y no habiendo en el caso prueba o indicio de excepciones relevantes que excluyan la responsabilidad, corresponde condenar por hurto simple”. Esa formulación es una decisión jurídica justificada y revisable, no una conclusión verdadera derivada de premisas normativas verdaderas."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "1. Condeno a la persona acusada como autora penalmente responsable del delito de hurto simple, previsto y reprimido por el art. 162 del Código Penal de la Nación, por haberse apoderado ilegítimamente, con ánimo de apropiación y sin consentimiento de su dueño, de una bicicleta ajena.  \n2. Le impongo la pena de un mes de prisión, con más la inhabilitación especial para ejercer la patria potestad, tutela o curatela por dos meses —esto es, por el doble del tiempo de la condena—, conforme la escala legal del art. 162 del C.P.  \n3. Dejo en suspenso la ejecución de la pena privativa de libertad por el término de dos años, bajo las reglas de los arts. 26 y 27 del C.P., al no constar antecedentes condenatorios que impidan el beneficio.  \n4. Costas a la condenada."}, {"n": 3, "t": "Fundamentos"}, {"n": 4, "t": "El hecho probado encuadra en el delito de hurto simple. El art. 162 del C.P. castiga a quien se apodera ilegítimamente de una cosa mueble, total o parcialmente ajena. En el caso, la bicicleta era propiedad de otra persona; el acusado la tomó sin autorización y con la intención de quedársela. Se trata de un apoderamiento consumado, pues la sustracción se produjo y la cosa salió de la esfera de custodia de su dueño, sin que importe que luego pudiera o no recuperarse."}, {"n": 5, "t": "No corresponde absolver por el hecho de que la bicicleta estuviera apoyada en un árbol y sin candado. Esa circunstancia solo demuestra que no fue necesario emplear fuerza para tomarla, pero no equivale a abandono, pérdida ni consentimiento. El dueño dejó la bicicleta momentáneamente al entrar a un comercio, conservando su propiedad y su intención de recuperarla. Una cosa dejada transitoriamente en la vía pública, aunque esté sin custodia física inmediata, no se convierte en cosa abandonada. Tampoco se trata de una cosa perdida ni de una entrega voluntaria, por lo que no cabe hablar de apropiación indebida."}, {"n": 6, "t": "Tampoco puede calificarse como robo del art. 164 del C.P., porque no hubo fuerza en las cosas ni violencia en las personas. La ausencia de candado precisamente permite descartar la fuerza sobre el objeto. Tampoco concurren agravantes del art. 163 del C.P. ni otra circunstancia que modifique la calificación."}, {"n": 7, "t": "En cuanto a la pena, la escala del hurto simple prevé prisión de un mes a dos años e inhabilitación especial. En la individualización de la pena valoré que no se probaron violencias, armas, fracturas ni otras agravantes; que se trató de un único apoderamiento y que no constan antecedentes condenatorios. Por ello, fijé la pena en el mínimo legal, dejándola en suspenso por resultar aplicable la condenación condicional."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tenés razón como objeción lógica si se lee la sentencia como si fuera una demostración de premisas verdaderas a una conclusión verdadera. Una sentencia penal no funciona así. Corrijo la formulación —no necesariamente el resultado— y distingo niveles.\n1. Norma, proposición normativa y decisión"}, {"n": 2, "t": "Una cosa es la norma —v. gr., “quien hurta debe ser penado”— y otra la proposición normativa que describe lo que el derecho dispone: “conforme al art. 162 del C.P. y a los hechos probados, corresponde condenar a X por hurto simple”. Esa proposición sí puede ser verdadera o falsa. La norma misma no es verdadera o falsa, pero puede ser válida, obligatoria, aplicable, derogada, etc."}, {"n": 3, "t": "La sentencia, además, no es primariamente una aserción teórica, sino un acto performativo: al decir “condeno”, el juez produce una norma individual. Su control no es el de la verdad científica, sino el de la legalidad, validez y justificación jurídica. Por eso no digo que “deduje una norma verdadera”; digo que justifiqué una decisión judicial mediante una norma general interpretada, hechos probados y reglas institucionales de aplicación."}, {"n": 4, "t": "Esto se vincula con el llamado dilema de Jørgensen: si las normas carecen de valor de verdad, ¿cómo hay inferencias normativas? Hay varias salidas: distinguir normas de proposiciones normativas; usar lógicas deónticas donde la inferencia preserva validez o satisfacción, no verdad en sentido clásico; o reconstruir la sentencia como razonamiento práctico, cuya conclusión no es un teorema, sino una decisión justificada. Para fallar no necesito resolver metafísicamente ese debate: basta con distinguir que lo que justifico es una proposición jurídica y luego emito un acto institucional.\n2. Reconstrucción del razonamiento"}, {"n": 5, "t": "Una presentación más honesta sería:"}, {"n": 6, "t": "- Premisa normativa completa: “Quien se apodera ilegítimamente de una cosa mueble total o parcialmente ajena, con ánimo de apropiación y sin consentimiento, debe ser condenado a la pena del art. 162 del C.P., siempre que no concurra una causa de exclusión de la tipicidad, antijuridicidad o culpabilidad”.\n- Premisa fáctica: “X tomó sin permiso la bicicleta de Y, que Y había dejado transitoriamente al entrar a un comercio, con la intención de quedársela; no consta ni se infiere un supuesto de abandono, pérdida, hurto de uso, consentimiento, estado de necesidad, error, etc.”.\n- Conclusión: “Corresponde condenar a X por hurto simple del art. 162 del C.P.”."}, {"n": 7, "t": "La premisa mayor no es el texto legal crudo, sino la norma interpretada, “todo considerado”, con sus condiciones y excepciones relevantes. La premisa menor no es solo un hecho bruto: incluye un juicio jurídico sobre los hechos probados y sobre la ausencia de defensas relevantes. La conclusión ya no es una “norma general”, sino la norma individual que el juez dicta.\n3. La derrotabilidad"}, {"n": 8, "t": "La objeción por derrotabilidad también es correcta frente a un silogismo demasiado simple. Las reglas jurídicas se comportan a menudo como reglas de default: autorizan una conclusión provisional salvo que aparezca un “derrotador” relevante. Por eso no basta con verificar los elementos positivos del hurto; hay que examinar si concurre alguna excepción."}, {"n": 9, "t": "En el caso planteado, los derrotadores relevantes están excluidos o carecen de base probatoria:"}, {"n": 10, "t": "- Consentimiento: excluido por el dato de que se llevó la bicicleta “sin permiso del dueño”.\n- Abandono o pérdida: excluido porque el dueño dejó la bicicleta temporariamente al entrar a un comercio; no se desprendió de su propiedad ni de su disponibilidad. La falta de candado no convierte la cosa en abandonada.\n- Hurto de uso o ausencia de ánimo de apropiación: excluido porque el hecho fija la “intención de quedársela”.\n- Robo: no hay fuerza en las cosas ni violencia en las personas; por eso no se aplica el art. 164 y sí el hurto simple.\n- Otras eximentes: no surgen del hecho probado, ni fueron invocadas con sustento probatorio. Una posibilidad meramente imaginaria no equivale a duda razonable. Si hubiera duda sobre un elemento del delito o sobre una eximente con apoyo en la prueba, jugaría el in dubio pro reo."}, {"n": 11, "t": "Ahora bien: el juez no prueba la inexistencia universal de toda excepción imaginable. Sería una exigencia imposible. Lo que hace es determinar, sobre el material probatorio y las reglas de carga de la prueba, que no concurre ningún derrotador relevante. La sentencia cierra el procedimiento mediante una decisión institucional: no afirma una verdad ontológica absoluta, sino una verdad jurídica sometida a revisión y, luego, a la autoridad de la cosa juzgada.\n4. La pena exacta no se deduce"}, {"n": 12,
