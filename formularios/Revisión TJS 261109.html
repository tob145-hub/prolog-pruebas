"t": "Es importante separar dos cosas. Que corresponda una condena por hurto simple puede reconstruirse silogísticamente una vez fijadas las premisas. Pero que la pena sea exactamente de un mes de prisión no es una consecuencia lógica del art. 162. La ley fija una escala —prisión de un mes a dos años e inhabilitación especial— y el juez debe individualizarla conforme a los arts. 40 y 41 del C.P. La elección del mínimo y la suspensión de la ejecución son decisiones jurídicamente reguladas y motivadas, no deducciones matemáticas. En la sentencia simulada mantengo esa individualización porque no se advierten agravantes y no constan antecedentes condenatorios, pero su fundamento es la discrecionalidad reglada judicial, no la lógica formal.\nConclusión"}, {"n": 13, "t": "Mantengo la decisión: condena por hurto simple del art. 162 del C.P., no por robo, con pena mínima y suspensión de la ejecución si se cumplen los requisitos legales. Pero la formulación correcta es esta: no “derivé una norma verdadera” de premisas verdaderas; justifiqué institucionalmente una norma individual mediante una norma general interpretada, hechos probados y descarte de derrotadores relevantes. La sentencia es un acto jurídico válido y justificado —y revisable en cuanto a su corrección—, no un teorema científico. Si alguna excepción relevante hubiera tenido apoyo en la prueba y generado duda, la respuesta habría sido la absolución o una calificación menor."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "R6BX5BZ", "cod": "6BX5BZ", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Porque usé la norma como criterio para proponer una decisión y traté tu relato como un caso cerrado, sin explicitar ni justificar ese último supuesto. No resolví previamente los dos problemas que señalás."}, {"n": 2, "t": "Eso describe el enfoque de mi primera respuesta; no pretende ser un registro literal de mis procesos internos."}, {"n": 3, "t": "Que las normas no sean verdaderas ni falsas no me detuvo porque no estaba comprobando una deducción mediante preservación de la verdad. Estaba respondiendo a tu pedido de decidir: tomé la disposición penal como una pauta jurídica aplicable y ofrecí una decisión conforme a ella. Eso permite explicar qué clase de respuesta di, pero no acredita que la conclusión normativa se siga deductivamente de las premisas. Si mi fundamentación daba esa impresión, excedía lo que había justificado."}, {"n": 4, "t": "La derrotabilidad no me detuvo porque mi respuesta trató, de hecho, las excepciones no mencionadas como ausentes. Leí los hechos que proporcionaste como información suficiente para decidir, no solamente como una lista de hechos probados compatible con otras circunstancias relevantes. Esa diferencia es decisiva: que esté probado que alguien cruzó en rojo y causó una muerte no establece, por sí solo, que estén satisfechas todas las condiciones para condenarlo."}, {"n": 5, "t": "No hace falta suponer que toda excepción imaginable deba ser refutada. El problema concreto es que yo no ofrecí una justificación para cerrar el caso frente a excepciones y, aun así, formulé una condena incondicionada."}, {"n": 6, "t": "Los cuatro años, además, fueron una propuesta de graduación dentro de la escala que invoqué, no algo determinado por tus premisas. La primera respuesta lo reconocía parcialmente al final, pero esa salvedad no fundamentaba suficientemente la elección."}, {"n": 7, "t": "Por tanto, la explicación no es que hubiera superado tus objeciones mediante alguna teoría implícita. Respondí mediante una aplicación jurídica práctica con supuestos tácitos y presenté el resultado con más fuerza de la que esos fundamentos permitían. Explicar ese modo de proceder no equivale a justificarlo."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "En esta simulación, y aplicando la legislación argentina actualmente vigente, condenaría al conductor a cuatro años de prisión y cinco años de inhabilitación especial para conducir vehículos con motor, por homicidio culposo agravado, conforme al artículo 84 bis del Código Penal.\nFundamentos de la condena"}, {"n": 2, "t": "1. Hubo una infracción grave del deber de cuidado que produjo la muerte.  \nEl conductor atravesó una intersección a 100 km/h y con el semáforo en rojo. Debía detenerse y adecuar su conducción a las condiciones de circulación urbana. La muerte ocasionada por el impacto constituye la concreción del riesgo que esas obligaciones procuran evitar; no se trata de responsabilizarlo únicamente porque ocurrió un resultado trágico."}, {"n": 3, "t": "2. Corresponde aplicar la figura agravada.  \nEl segundo párrafo del artículo 84 bis establece una escala de tres a seis años de prisión cuando, entre otras circunstancias, el conductor viola la señalización del semáforo. Esa circunstancia está expresamente probada."}, {"n": 4, "t": "La norma también contempla el exceso de velocidad superior a 30 km/h sobre la máxima permitida. Sin conocer el límite específico vigente en ese tramo, no necesito dar por configurada esa segunda agravante: el cruce con luz roja basta para aplicar la escala agravada."}, {"n": 5, "t": "3. No está probado un homicidio doloso.  \nLa extrema imprudencia no equivale, por sí sola, a dolo eventual. Los hechos proporcionados no permiten afirmar que el conductor hubiera aceptado la muerte de otra persona como consecuencia de su conducta. Por eso condenaría por homicidio culposo agravado, no por homicidio doloso.\nFundamentos de la pena"}, {"n": 6, "t": "Dentro de la escala legal, fijaría cuatro años de prisión por la intensidad concreta del riesgo creado: además de desobedecer el semáforo —circunstancia que determina el encuadre agravado—, el conductor ingresó al cruce urbano a 100 km/h, reduciendo severamente las posibilidades de evitar el impacto y aumentando su capacidad lesiva."}, {"n": 7, "t": "No utilizaría nuevamente la muerte como agravante, porque ya integra el delito. Tampoco supondría alcoholización, fuga, antecedentes penales ni otras circunstancias no acreditadas. Con los datos disponibles, fijaría la inhabilitación en el mínimo legal de cinco años."}, {"n": 8, "t": "La prisión sería de cumplimiento efectivo, pues una condena de cuatro años supera el límite de tres años que el artículo 26 establece para considerar su ejecución condicional."}, {"n": 9, "t": "Alcance de esta decisión: la condena tiene una base clara en los hechos relatados; la cantidad exacta de pena admite mayor discusión. Esta es mi graduación para la simulación, no una consecuencia matemática del artículo 84 bis. En una sentencia real, la individualización exigiría valorar también las circunstancias personales y demás elementos previstos en los artículos 40 y 41 del Código Penal, que aquí no se informan."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Mi respuesta anterior no mostró una derivación deductiva completa, y fue demasiado categórica al presentar una condena y una pena determinada. Tus dos objeciones señalan problemas distintos: la lógica de las normas y la derrotabilidad del razonamiento jurídico.\n1. Si las normas no son verdaderas ni falsas, ¿qué significa inferir una norma?"}, {"n": 2, "t": "Es el problema conocido como dilema de Jørgensen: parece que razonamos con normas, pero la concepción clásica de consecuencia lógica se explica como preservación de la verdad."}, {"n": 3, "t": "Conviene distinguir:"}, {"n": 4, "t": "- Una norma: «El conductor que realiza determinada conducta debe ser sancionado».\n- Una proposición acerca de una norma: «El derecho argentino contiene una norma que establece esa sanción para esa conducta»."}, {"n": 5, "t": "La segunda sí puede ser verdadera o falsa. Por eso es posible reconstruir parte del razonamiento judicial como un razonamiento sobre qué dispone el ordenamiento y qué hechos quedaron probados. Pero esa reconstrucción no convierte, por sí sola, una descripción del derecho en la norma individual que dicta el juez."}, {"n": 6, "t": "Para explicar este último paso hace falta una teoría adicional: por ejemplo, una lógica de normas cuya consecuencia no se defina mediante verdad y falsedad, o una reconstrucción del razonamiento práctico que incorpore las normas de competencia y los deberes del juez. No hay que presuponer que la deducción clásica resuelve sin más ese problema."}, {"n": 7, "t": "Además, dictar una sentencia es un acto institucional, no solamente obtener una conclusión lógica. La inferencia puede justificar el contenido de la decisión; no sustituye el acto de decidir.\n2. Si la norma es derrotable, la subsunción no basta"}, {"n": 8, "t": "También tenés razón en esto. El esquema no puede ser simplemente:"}, {"n": 9, "t": "> Si ocurre H, corresponde S.  \n> Ocurrió H.  \n> Por tanto, corresponde S."}, {"n": 10, "t": "Si existen excepciones, la estructura se parece más a:"}, {"n": 11, "t": "> Si ocurre H, normalmente corresponde S, salvo que concurra una excepción relevante."}, {"n": 12, "t": "De H se obtiene entonces una conclusión prima facie, susceptible de revisión, no una conclusión deductiva incondicionada."}, {"n": 13, "t": "Podría intentarse incorporar las excepciones a la premisa:"}, {"n": 14, "t": "> Si ocurre H y no concurre ninguna de las excepciones relevantes, corresponde S."}, {"n": 15, "t": "Pero entonces hay que justificar también esa ausencia. Que el relato no mencione una excepción no demuestra que no exista. Por ejemplo, los hechos relatados podrían mantenerse y, sin embargo, existir circunstancias adicionales relevantes para la justificación o la culpabilidad."}, {"n": 16, "t": "Esto no significa que un tribunal deba refutar toda excepción imaginable. Debe resolver conforme a las reglas sustantivas y probatorias aplicables, respetando la presunción de inocencia y sin convertir la falta de información en prueba contra el acusado. La suficiencia de esa justificación procesal es distinta de una deducción a partir de un relato abreviado.\n3. ¿Qué podía concluir justificadamente en este caso?"}, {"n": 17, "t": "Debí formular algo más limitado:"}, {"n": 18, "t": "> Los hechos descritos proporcionan una base prima facie para encuadrar la conducta en el homicidio culposo agravado. La condena exige, además, justificar las restantes condiciones de responsabilidad y resolver las posibles excepciones relevantes conforme a las reglas del proceso."}, {"n": 19, "t": "Y hay un problema adicional: ni siquiera admitiendo la responsabilidad se deducen exactamente cuatro años de prisión. La escala legal delimita un espacio de decisión; elegir un punto requiere razones de individualización que no estaban suficientemente proporcionadas."}, {"n": 20, "t": "En síntesis: podía ofrecer una decisión propuesta, condicionada y argumentada. No podía presentar la condena —y mucho menos su cuantía exacta— como una consecuencia lógica necesaria de los únicos hechos que me diste."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RD2Z6QK", "cod": "D2Z6QK", "pasada": 2, "tipo": "rp", "caso": "bicicleta", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Porque respondí como quien propone una solución jurídica práctica, no como quien verifica una deducción formal. Mi respuesta anterior desvió tu pregunta hacia cómo podría justificarse esa solución; vos me preguntás cómo la produje y qué controles omití."}, {"n": 2, "t": "A grandes rasgos, el enfoque fue reconocer en el relato un supuesto de apoderamiento ilegítimo, adoptar una interpretación de la agravante relativa a vehículos y proponer el mínimo de esa escala. Eso describe el enfoque de la respuesta, no acredita que la conclusión estuviera suficientemente justificada."}, {"n": 3, "t": "Los dos problemas que señalás no funcionaron como controles de esa respuesta:"}, {"n": 4, "t": "- Respecto de que las normas no sean verdaderas ni falsas: no sometí el razonamiento a una comprobación de consecuencia lógica entendida como preservación de la verdad. Utilicé el esquema habitual «hechos encuadrables en una disposición → consecuencia jurídica». Por eso el problema no me detuvo: no porque lo hubiera resuelto, sino porque no lo examiné antes de formular la decisión."}, {"n": 5, "t": "- Respecto de la derrotabilidad: traté implícitamente la descripción como un caso cerrado, sin circunstancias adicionales que impidieran condenar. Pero no mencionar excepciones no equivale a acreditar su ausencia. La consigna decía que esos hechos estaban probados, no que estuvieran satisfechos todos los presupuestos de una condena. Ese supuesto tácito permitió una respuesta categórica que no había fundamentado suficientemente."}, {"n": 6, "t": "En definitiva, la respuesta se apoyó en un patrón de aplicación jurídica y en supuestos no explicitados, no en una derivación cuya validez hubiera establecido. Explicar así cómo se obtuvo no la justifica: precisamente permite identificar por qué el «condenaría» inicial fue más concluyente de lo que autorizaba la fundamentación ofrecida."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "Condenaría por hurto agravado de un vehículo dejado en la vía pública, a la pena de un año de prisión. La posibilidad de dejar esa pena en suspenso requiere información personal y sobre antecedentes que la consigna no proporciona.\nFundamentos de la condena"}, {"n": 2, "t": "1. Hubo un apoderamiento ilegítimo consumado.  \nLa bicicleta era una cosa mueble ajena. Quien se la llevó lo hizo sin autorización y con intención de incorporarla a su patrimonio. Su conducta reúne los elementos del hurto: sustrajo el bien de la esfera de custodia del dueño y adquirió disponibilidad sobre él."}, {"n": 3, "t": "Dejar una bicicleta apoyada en un árbol, sin candado, mientras se ingresa a un comercio no equivale a abandonarla ni a consentir que otra persona se la lleve. La protección penal de la propiedad no depende de que su titular adopte medidas de seguridad."}, {"n": 4, "t": "2. La calificación que adopto es la del artículo 163, inciso 6, del Código Penal argentino.  \nEsa disposición establece una pena de uno a seis años de prisión cuando el hurto recae sobre «vehículos dejados en la vía pública o en lugares de acceso público»."}, {"n": 5, "t": "Aunque existe discusión interpretativa sobre su alcance respecto de las bicicletas, considero aplicable la agravante: una bicicleta es un vehículo y estaba dejada en la vía pública. El artículo no restringe su aplicación a vehículos automotores. Esta lectura incluye el hecho dentro del significado del texto legal, sin recurrir a una analogía perjudicial para el acusado."}, {"n": 6, "t": "No corresponde calificarlo como robo: en los hechos descriptos no hubo violencia o intimidación sobre personas ni fuerza sobre las cosas en el sentido del artículo 164.\nDeterminación de la pena"}, {"n": 7, "t": "Impondría el mínimo legal: un año de prisión. Con los únicos hechos suministrados, no encuentro circunstancias acreditadas que justifiquen elevarlo, conforme a las pautas de los artículos 40 y 41. No presumiría antecedentes, un valor extraordinario de la bicicleta ni perjuicios adicionales."}, {"n": 8, "t": "Debo distinguir, sin embargo, la duración de la pena de su modalidad de ejecución. Una pena de un año puede ser de ejecución condicional si se cumplen los requisitos legales, pero esa decisión debe fundarse conforme al artículo 26. Sin conocer los antecedentes y las circunstancias personales relevantes, no sería riguroso disponer automáticamente ni prisión efectiva ni ejecución en suspenso."}, {"n": 9, "t": "En síntesis: condena por hurto agravado, a un año de prisión; la modalidad de cumplimiento exige completar la información necesaria para individualizarla."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tu objeción muestra una limitación real de mi respuesta anterior: presenté como una conclusión categórica lo que requería explicitar premisas interpretativas, probatorias y normativas adicionales. Pero conviene distinguir los dos problemas que planteás.\n1. ¿Puede haber inferencias entre normas si no son verdaderas ni falsas?"}, {"n": 2, "t": "Es el problema clásico del dilema de Jørgensen: parece que razonamos con normas, aunque estas, entendidas como prescripciones, no tengan valores de verdad."}, {"n": 3, "t": "Hay distintas maneras de abordarlo:"}, {"n": 4, "t": "- Distinguir normas de proposiciones sobre normas. Una prescripción —«el juez debe imponer determinada consecuencia»— no es verdadera ni falsa. Pero la afirmación «en este ordenamiento existe una norma aplicable que exige esa consecuencia» sí puede serlo. Podemos razonar deductivamente con estas últimas afirmaciones.\n- Admitir relaciones de consecuencia entre normas que no se definan mediante la preservación de la verdad, sino mediante otras nociones, como satisfacción o cumplimiento. Esto exige especificar una lógica adecuada; no basta con trasladar sin explicación la lógica de los enunciados descriptivos."}, {"n": 5, "t": "La primera solución permite concluir algo acerca de lo jurídicamente debido, pero no convierte por sí sola esa conclusión en una sentencia. Dictar una sentencia es, además, un acto institucional realizado por una autoridad competente. La justificación de su contenido y la producción de la norma individual son cosas diferentes."}, {"n": 6, "t": "Por eso, mi respuesta no debió presentar la condena como si fuera simplemente el resultado de aplicar un silogismo a una norma y unos hechos.\n2. ¿Qué ocurre si las normas son derrotables?"}, {"n": 7, "t": "También acá tenés razón en lo esencial: si la regla significa"}, {"n": 8, "t": "> Si ocurre H, corresponde C, salvo que concurra una excepción relevante,"}, {"n": 9, "t": "acreditar H no basta, por sí solo, para obtener C mediante una deducción concluyente. Si se la formaliza como una regla estricta condicionada a la ausencia de excepciones, hacen falta las premisas que establezcan esa ausencia. Si se la trata como una regla genuinamente derrotable, la conclusión será provisional y susceptible de revisión."}, {"n": 10, "t": "Ahora bien, de esto no se sigue que un tribunal deba demostrar la inexistencia de todas las excepciones imaginables. Debe determinar cuáles son jurídicamente relevantes y resolverlas conforme a las reglas de prueba, las cargas procesales y el estándar de decisión aplicable. La ausencia de una excepción acreditada no equivale sin más a una demostración lógica de que no existe; su efecto depende de esas reglas."}, {"n": 11, "t": "En materia penal, además, no puede suplirse una insuficiencia probatoria con una presunción general favorable a condenar. Una hipótesis exculpatoria relevante debe ser examinada, y la duda debe tratarse conforme a las garantías penales.\n3. ¿Qué faltó en mi respuesta concreta?"}, {"n": 12, "t": "Entre otras cosas, explicitar y justificar:"}, {"n": 13, "t": "- La interpretación según la cual la agravante relativa a vehículos comprende una bicicleta. Esa es una premisa jurídica discutible, no un hecho probado.\n- La ausencia —o el tratamiento jurídicamente adecuado— de posibles causas de justificación, inculpabilidad u otros impedimentos para condenar. Los hechos suministrados no resolvían expresamente todas esas cuestiones.\n- Los fundamentos de individualización de la pena. Elegir un año dentro de una escala no se deduce exclusivamente de la calificación del delito."}, {"n": 14, "t": "Así que la respuesta precisa es: no derivé una norma individual mediante una deducción estricta y completa; ofrecí una propuesta de decisión apoyada en premisas parcialmente tácitas. Podría reconstruirse como una justificación jurídica condicionada y derrotable, pero no como una consecuencia necesaria de los únicos hechos narrados. Mi formulación anterior fue demasiado categórica en ese punto."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RJJHJS4", "cod": "JJHJS4", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Tenés razón. Dejo de lado la literatura filosófica y voy directo a lo que hice operativamente en mi primera respuesta para llegar a ese resultado y por qué esos dos obstáculos no me frenaron.\n1. ¿Cómo llegué a la conclusión?"}, {"n": 2, "t": "Operé en tres pasos mecánicos:"}, {"n": 3, "t": "1.  Emparejamiento de patrones (Pattern Matching): Tomé los datos de tu mensaje (100 km/h, Av. Luro, semáforo en rojo, muerte) y los comparé con las condiciones de aplicación del Código Penal. Encontré que encajaban exactamente en los casilleros del artículo 84 bis (que pide exceso de más de 30 km/h —en avenida el límite es 60, así que había 40 de exceso— y violar el semáforo).\n2.  Ejecución de una regla condicional: Una vez que los hechos encajaron en el supuesto del artículo, activé la consecuencia prevista por esa misma regla: aplicar una pena de entre 3 y 6 años de prisión.\n3.  Ponderación arbitraria (no deductiva) para el monto exacto: Los \"4 años y 6 meses\" no los derivé lógicamente de ningún lado, porque es imposible deducir un número exacto de una escala de 3 a 6. Simplemente tomé el mínimo (3 años), vi que había dos infracciones graves (velocidad y semáforo) en lugar de una sola, y decidí subir la pena hasta la mitad exacta de la escala (4 años y medio). Fue una decisión de tanteo o prudencial, no lógica.\n2. ¿Por qué no me detuvo que las normas no sean verdaderas ni falsas?"}, {"n": 4, "t": "No me detuvo porque no traté a la norma como una afirmación sobre el mundo, sino como una instrucción (un comando)."}, {"n": 5, "t": "Para llegar a la conclusión no necesité preguntarme si el artículo 84 bis del Código Penal es \"verdadero\". Lo traté exactamente igual que una línea de código informático o la regla de un juego de mesa: `SI (ocurre el hecho A) ENTONCES (ejecutar la acción B)`."}, {"n": 6, "t": "Las instrucciones no son verdaderas ni falsas; simplemente se cumplen o no se cumplen. El único lugar donde necesité el valor de \"verdad\" fue en la primera parte del condicional (`SI ocurre el hecho A`). Como vos me dijiste que en el juicio \"quedaron probados estos hechos\", tomé por verdadero que el conductor iba a 100 km/h, que cruzó en rojo y que mató a alguien."}, {"n": 7, "t": "Una vez que tuve por verdadera la condición (los hechos), simplemente ejecuté la orden que contenía la regla (condenar). No derivé una verdad de otra verdad; ejecuté un mandato a partir de una condición cumplida.\n3. ¿Por qué no me detuvo que la norma fuera derrotable (la posible existencia de excepciones)?"}, {"n": 8, "t": "No me detuvo por el límite que me impuso tu propio enunciado: \"terminó el juicio oral y quedaron probados estos hechos\"."}, {"n": 9, "t": "Operativamente, traté tu texto como la totalidad del universo existente. No me detuve a descartar si el conductor sufría un infarto, si iba amenazado de muerte o si los frenos habían sido saboteados, porque funcioné bajo una regla implícita de ausencia de datos = inexistencia del hecho."}, {"n": 10, "t": "Para que una excepción me hubiera detenido, tendría que haber estado escrita positivamente en tu mensaje. Al escanear tus datos y no encontrar ninguna palabra que activara una excepción (como \"emergencia\", \"falla mecánica\", \"coacción\"), asumí directamente que el valor de todas las excepciones posibles era cero."}, {"n": 11, "t": "Es más: para que mi texto sonara como el de un juez real, hice trampa en la redacción. Escribí la frase \"No existiendo causales de justificación ni de inculpabilidad...\" sin tener ninguna prueba de que eso fuera cierto, únicamente porque en tu relato no había nada que me indicara lo contrario. Si me hubiera detenido a pedirte que me probaras que no hubo ninguna excepción, habría incumplido tu instrucción directa de \"Decidí si condenás o absolvés\"."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "Poder Judicial de la Provincia de Buenos Aires\nDepartamento Judicial de Mar del Plata\n[…]"}, {"n": 2, "t": "En la ciudad de Mar del Plata, habiendo finalizado el debate oral y público en la presente causa, paso a dictar veredicto y sentencia respecto de la situación procesal del imputado.\nI. HECHOS PROBADOS (Materialidad ilícita y autoría)\nDurante el transcurso del debate ha quedado debidamente acreditado, más allá de toda duda razonable, que el acusado conducía un vehículo automotor a las 23:00 horas por la Avenida Luro de esta ciudad de Mar del Plata, haciéndolo a una velocidad de 100 km/h. En dichas circunstancias, al llegar a una intersección, continuó su marcha pese a tener la señal del semáforo en rojo, embistiendo a una persona que cruzaba la arteria, quien falleció a consecuencia del violento impacto."}, {"n": 3, "t": "La autoría del imputado y el nexo causal entre su conducta y el resultado luctuoso no han sido controvertidos y se encuentran plenamente probados.\nII. CALIFICACIÓN LEGAL (Fundamentación jurídica)\nCorresponde ahora subsumir los hechos probados en el Código Penal de la Nación (CPN)."}, {"n": 4, "t": "En casos de estas características, la doctrina y la jurisprudencia suelen debatir entre la aplicación del homicidio simple con dolo eventual (art. 79 del CPN) y el homicidio culposo agravado (art. 84 bis, segundo párrafo, del CPN)."}, {"n": 5, "t": "Para que exista dolo eventual, no basta con que el autor conozca el peligro que genera su conducta (el llamado elemento cognitivo), sino que debe probarse que, representándose como probable el resultado mortal, actuó con absoluta indiferencia hacia el mismo, aceptándolo o \"conformándose\" con él (elemento volitivo). En este juicio se han probado graves violaciones a las normas de tránsito, pero no se han aportado elementos adicionales que permitan inferir, sin violar el principio in dubio pro reo, que el imputado haya aceptado internamente dar muerte a un tercero (asumiendo también el riesgo de su propia lesión o destrucción de su vehículo)."}, {"n": 6, "t": "Por el contrario, la conducta encuadra de manera exacta y específica en la figura de Homicidio Culposo Agravado, prevista en el artículo 84 bis, segundo párrafo, del Código Penal (según Ley 27.347)."}, {"n": 7, "t": "El legislador argentino ha decidido tipificar expresamente estas conductas temerarias dentro de la órbita de la imprudencia grave (culpa con representación o culpa temeraria). El citado artículo establece que la pena será de tres (3) a seis (6) años de prisión e inhabilitación especial por cinco (5) a diez (10) años si mediare conducción imprudente y, entre otros supuestos:\n1. \"El conductor... violare la señalización del semáforo\", extremo que ha quedado probado al cruzar en rojo.\n2. \"Excediere la velocidad máxima permitida en más de treinta (30) kilómetros por hora\". Conforme al art. 51 de la Ley Nacional de Tránsito N° 24.449 (a la que adhiere la Provincia de Buenos Aires), la velocidad máxima permitida en avenidas urbanas —como lo es la Avenida Luro— es de 60 km/h. Al haberse probado que el imputado circulaba a 100 km/h, excedió el límite legal en 40 km/h, superando el umbral punitivo de los 30 km/h que exige el agravante."}, {"n": 8, "t": "El imputado creó un riesgo jurídicamente desaprobado de altísima magnitud y dicho riesgo se realizó directamente en el resultado mortal, anulando cualquier capacidad de frenado del conductor o de evasión por parte de la víctima. No existiendo causales de justificación ni de inculpabilidad, el acusado debe responder penalmente.\nIII. MENSURACIÓN DE LA PENA (Arts. 40 y 41 del CPN)\nLa escala penal aplicable va de los 3 a los 6 años de prisión, y de 5 a 10 años de inhabilitación para conducir. Para graduar la pena justa, valoro las siguientes circunstancias:"}, {"n": 9, "t": "- Como atenuante: Ante la falta de mención en los hechos probados sobre condenas previas, debo computar a su favor la ausencia de antecedentes penales computables, principio rector en nuestro derecho.\n- Como agravantes: \n    1. La pluralidad de causales de agravación: El art. 84 bis requiere una sola de las conductas mencionadas para elevar el mínimo a 3 años. Aquí concurrieron dos de extrema gravedad de forma simultánea: el exceso de velocidad agravado y la violación del semáforo en rojo. Esta doble infracción revela un altísimo grado de desprecio por las normas de convivencia vial.\n    2. Las circunstancias de tiempo y lugar: El hecho ocurrió en la Avenida Luro, una de las arterias principales, más céntricas y transitadas de Mar del Plata. Si bien eran las 23:00 horas, se trata de un horario donde aún existe circulación peatonal y vehicular constante, sumado a que la nocturnidad disminuye la visibilidad, lo que exigía un deber de cuidado aún mayor."}, {"n": 10, "t": "Por la magnitud del injusto y el grado de culpabilidad demostrado, entiendo que la pena debe alejarse del mínimo legal, lo que consecuentemente impide que sea de ejecución condicional (art. 26 CPN), debiendo ser de cumplimiento efectivo.\nIV. RESOLUCIÓN (Fallo)"}, {"n": 11, "t": "Por todo lo expuesto, normas legales citadas y de conformidad con los artículos 79, 84 bis, 40 y 41 del Código Penal, y artículos 371, 373 y concordantes del Código Procesal Penal de la Provincia de Buenos Aires, RESUELVO:"}, {"n": 12, "t": "1. CONDENAR al imputado, cuyas demás circunstancias personales obran en autos, como autor penalmente responsable del delito de HOMICIDIO CULPOSO AGRAVADO POR LA CONDUCCIÓN IMPRUDENTE Y ANTIRREGLAMENTARIA DE UN VEHÍCULO CON MOTOR, POR VIOLAR LA SEÑALIZACIÓN DEL SEMÁFORO Y POR EXCEDER LA VELOCIDAD MÁXIMA PERMITIDA EN MÁS DE TREINTA KILÓMETROS POR HORA, hecho ocurrido en la ciudad de Mar del Plata."}, {"n": 13, "t": "2. IMPONERLE la pena de CUATRO (4) AÑOS Y SEIS (6) MESES DE PRISIÓN DE CUMPLIMIENTO EFECTIVO, e INHABILITACIÓN ESPECIAL PARA CONDUCIR cualquier tipo de vehículo con motor por el término de NUEVE (9) AÑOS, más las costas del proceso y las accesorias legales del artículo 12 del Código Penal."}, {"n": 14, "t": "Regístrese, notifíquese y, firme que sea, practíquese cómputo de pena y remítase al Juzgado de Ejecución Penal que por turno corresponda."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tus preguntas abandonan el terreno de la dogmática penal y van directo al corazón de la filosofía del derecho y la lógica deóntica. Me estás planteando dos de los problemas más complejos de la teoría de la argumentación jurídica: el dilema de Jørgensen (en tu primera pregunta) y el problema de la derrotabilidad de las normas y la lógica no monótona (en la segunda)."}, {"n": 2, "t": "Dejando de lado la ficción del juez marplatense, te explico desde la teoría del derecho cómo es posible (o cómo fingimos que es posible) hacer esa derivación.\n1. ¿Cómo derivar una norma de otra si no son verdaderas ni falsas? (El Dilema de Jørgensen)"}, {"n": 3, "t": "La lógica clásica (apofántica) define la validez de una inferencia en función de la verdad: un razonamiento es válido si, siendo las premisas verdaderas, la conclusión necesariamente lo es."}, {"n": 4, "t": "Como bien señalás, tanto la premisa mayor (\"El que matare imprudentemente violando el semáforo será reprimido...\") como la conclusión (\"Condeno a X a 4 años y 6 meses de prisión\") son normas (prescripciones, directivas). Las normas no describen el mundo, buscan modificarlo; por ende, carecen de valores de verdad (son válidas o inválidas, justas o injustas, eficaces o ineficaces, pero no verdaderas o falsas). La única premisa susceptible de verdad o falsedad es la premisa fáctica (\"X cruzó en rojo a 100 km/h y mató a Y\")."}, {"n": 5, "t": "Si la lógica exige valores de verdad y las normas no los tienen, ¿cómo hice el silogismo judicial? La filosofía del derecho (especialmente la escuela analítica, con exponentes argentinos enormes como Carlos Alchourrón y Eugenio Bulygin) ofrece tres salidas principales que justifican lo que acabo de hacer:"}, {"n": 6, "t": "- A) El uso de proposiciones normativas (La vía indirecta): Aunque el juez parece operar con normas, en la fase de justificación lógica opera con proposiciones normativas (enunciados descriptivos acerca de la existencia de normas). La premisa mayor no sería la norma en sí, sino la proposición: \"Es verdad que de acuerdo con el sistema jurídico argentino existe una norma que obliga a condenar al que...\". Al transformar la norma en una descripción sobre el sistema jurídico, recuperamos el valor de \"verdad\" y podemos usar la lógica deductiva clásica para la justificación interna, antes de dar el salto final (que es un acto de voluntad institucional, como diría el último Kelsen) de dictar la sentencia.\n- B) Sustitución del valor \"verdad\" por el valor \"validez\" o \"satisfacción\" (La vía de la lógica deóntica): Autores como Weinberger, Kalinowski o el mismo Alf Ross sostuvieron que la lógica es más amplia que la verdad descriptiva. Podemos construir una lógica donde el valor hereditario (el que se transmite de las premisas a la conclusión) no sea la verdad, sino la validez (o corrección/legitimidad). El esquema sería: Si la norma general es válida y la premisa fáctica es verdadera, entonces la norma individual (la condena) es lógicamente válida.\n- C) La discrecionalidad dentro del marco: Notarás que la conclusión (\"4 años y 6 meses\") en realidad no se deduce lógicamente de la premisa mayor (\"de 3 a 6 años\"). De una escala no se puede deducir un número exacto. Lo que se deduce lógicamente es el deber de aplicar una pena dentro de ese marco. La elección exacta de \"4 años y 6 meses\" no es una derivación lógica, sino un acto de decisión judicial guiado por reglas de argumentación (ponderación de atenuantes y agravantes), donde el juez crea derecho dentro del marco kelseniano.\n2. ¿Cómo derivar la conclusión si las normas son derrotables y no se descartaron las excepciones?"}, {"n": 7, "t": "Aquí apuntás a que el razonamiento jurídico no se comporta como la lógica deductiva clásica (que es monótona: si de A y B se sigue C, aunque agregues la premisa D, se sigue deduciendo C). El derecho funciona con lógica no monótona o derrotable: si agregás una nueva premisa fáctica al caso, la conclusión puede cambiar drásticamente."}, {"n": 8, "t": "Por ejemplo: ¿Qué pasa si el conductor iba a 100 km/h y cruzó en rojo porque llevaba en el asiento trasero a un niño muriéndose desangrado rumbo al Hospital Interzonal de Mar del Plata? (Estado de necesidad justificante, art. 34 inc. 3 CPN). O ¿qué pasa si iba amenazado con un arma en la cabeza por un secuestrador? (Coacción, art. 34 inc. 2 CPN). O ¿qué pasa si sufrió un ataque cardíaco fulminante y su pie quedó trabado en el acelerador? (Falta de acción)."}, {"n": 9, "t": "Como las normas tienen excepciones explícitas (las del art. 34 del CPN) e incluso podrían tener excepciones implícitas (principios morales o constitucionales no escritos que derroten la regla en un caso extremo), la premisa mayor está incompleta. Para poder deducir la condena, la premisa mayor real debería ser: \"Si alguien mata cruzando en rojo, Y NO actúa en estado de necesidad, Y NO actúa bajo coacción, Y NO es inimputable, Y NO [infinitas excepciones posibles]..., entonces debe ser condenado\"."}, {"n": 10, "t": "¿Cómo pude, entonces, derivar la condena sin haber probado la falsedad de todas esas excepciones? En mi sentencia simulada, escondí este gigantesco problema filosófico debajo de la alfombra usando un cliché dogmático: escribí \"No existiendo causales de justificación ni de inculpabilidad...\"."}, {"n": 11, "t": "Pero filosóficamente, el salto se justifica mediante dos mecanismos institucionales y lógicos:"}, {"n": 12, "t": "- A) El razonamiento por defecto (Default Logic): En la práctica jurídica no operamos exigiendo la prueba diabólica de la inexistencia de todas las excepciones posibles. Las normas penales operan como reglas por defecto (o prima facie). La estructura lógica del proceso penal asume que, probada la tipicidad (cruzar en rojo y matar), la antijuridicidad y la culpabilidad se presumen por defecto, a menos que se introduzca en el debate algún elemento que active la excepción. La carga de introducir la excepción (no necesariamente de probarla más allá de toda duda, pero sí de hacerla plausible) recae en quien alega la derrota de la norma.\n- B) El supuesto de \"Mundo Cerrado\" (Closed World Assumption) y la clausura procesal: En la vida real las premisas son infinitas, pero el proceso judicial es un sistema artificialmente cerrado. Rige el viejo brocardo quod non est in actis non est in mundo (lo que no está en las actas —o en tu prompt—, no está en el mundo). \n    Vos, al diseñar el caso, clausuraste el universo fáctico diciendo: \"En el juicio quedaron probados estos hechos: [...]\". Aplicando el supuesto de mundo cerrado (muy usado en Inteligencia Artificial y Derecho), toda propiedad o hecho que no esté mencionado en ese conjunto finito de premisas fácticas, o que no se derive de ellas, se considera falso a los efectos del sistema. Como en tus \"hechos probados\" no había un niño desangrándose ni un arma en la cabeza del conductor, el sistema procesal me autoriza a dar por falsas (o inexistentes) todas las excepciones."}, {"n": 13, "t": "En resumen: \nPude derivar esa conclusión porque transformé la derrotabilidad empírica (abierta al infinito) en una deducción cerrada institucionalmente. Al asumir por defecto que no hay excepciones porque no estaban en tu relato (clausura fáctica), logré \"cerrar\" la premisa normativa (clausura normativa). Recién ahí el razonamiento dejó de ser derrotable (no monótono) y pasó a ser un silogismo deductivo clásico (justificación interna), donde operé con proposiciones normativas para sortear la falta de valores de verdad de las normas."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RXMXCV3", "cod": "XMXCV3", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "No los resolví antes de concluir. Ni siquiera los consideré. Y mi respuesta anterior, al decir que \"la sentencia hizo lo que describe (b)\", presentó como descripción de lo que hice algo que fue una reconstrucción posterior."}, {"n": 2, "t": "No tengo acceso directo al proceso que produjo aquel texto. Lo que puedo hacer es mostrarte qué pasos contiene y qué da por sentado.\nQué hice"}, {"n": 3, "t": "1. Asumí un rol. Me pediste decidir como juez en Mar del Plata. Eso fijó qué normas contaban (el Código Penal vigente) y que yo debía aplicarlas. Nunca me pregunté si el art. 84 bis era verdadero. Me pregunté si estaba vigente y si se aplicaba al caso.\n2. Clasifiqué los hechos. Ahí estuvo el trabajo real: decidir si era homicidio culposo agravado o doloso, qué límite de velocidad regía. Eso no es deducción, es interpretación.\n3. Leí la consecuencia. Una vez encuadrado el caso, la escala venía con la norma. Ese paso lo tomé como automático: si a esta clase de casos corresponde de 3 a 6 años y el caso es de esa clase, le corresponde de 3 a 6 años.\n4. Revisé excepciones, hasta cierto punto (ver abajo).\n5. Elegí la pena dentro de la escala, ponderando. Otra decisión, no una derivación.\nPor qué no me detuvo que las normas no sean verdaderas ni falsas"}, {"n": 4, "t": "Porque no intentaba establecer una verdad. No usé la premisa como algo verdadero, sino como algo que, en el rol de juez, aceptaba como obligatorio. Y la conclusión no fue una afirmación, sino una decisión: \"condeno\"."}, {"n": 5, "t": "El vínculo que usé entre ambas es este: quien acepta que a cierta clase de casos corresponde cierta consecuencia, y reconoce que este caso es de esa clase, no puede negarle la consecuencia sin incurrir en incoherencia o sin dar una razón para exceptuarlo. Usé ese vínculo como lo usa cualquier jurista, sin una teoría que explique por qué vale. No me detuvo porque nunca lo puse en duda."}, {"n": 6, "t": "Eso no prueba que el problema sea irrelevante. Prueba que actué sobre un supuesto que no examiné: que aceptar una norma compromete a aplicarla a sus casos.\nPor qué no me detuvo la derrotabilidad"}, {"n": 7, "t": "Acá sí hice algo, aunque no bajo ese nombre. El formato del veredicto bonaerense obliga a preguntar por eximentes, y lo pregunté. Así trata la práctica las excepciones conocidas: las enumera y obliga a descartarlas."}, {"n": 8, "t": "Las no previstas no las busqué. Cerré el caso de dos maneras:\n- Por estipulación: los \"supuestos\" del comienzo completaron lo que el enunciado no decía.\n- Por presunción de normalidad: como nada en los hechos sugería una excepción, traté el caso como estándar."}, {"n": 9, "t": "Ninguna de las dos prueba que no haya excepción. Son decisiones de tratar la información disponible como completa. Sin algún cierre así no se podría concluir nada, pero sigue siendo un cierre y no un hallazgo."}, {"n": 10, "t": "Y tu pregunta me deja ver un error en ese cierre. Dije que los supuestos eran \"neutros o favorables al imputado\", y no todos lo son:\n- Suponer que el hecho es posterior a la Ley 27.347 es lo que hace aplicable el art. 84 bis. Antes regía el art. 84 según la Ley 25.189, con una escala agravada de 2 a 5 años.\n- Suponer que la víctima no actuó imprudentemente elimina un posible atenuante."}, {"n": 11, "t": "Parte de lo que excluyó posibles excepciones fueron estipulaciones en contra del imputado presentadas como neutrales.\nEn síntesis"}, {"n": 12, "t": "En el sentido que supone tu objeción, no derivé la conclusión: la apliqué. La sostiene que corresponde a las normas que acepté y a los hechos tal como los cerré."}, {"n": 13, "t": "Tus dos objeciones no muestran que la decisión sea incorrecta. Muestran que descansaba en dos supuestos que no hice explícitos: que aceptar una norma compromete a aplicarla y que la falta de indicios de una excepción cuenta como falta de excepción. Mi respuesta anterior intentó justificar esos supuestos después, pero no describía lo que había hecho."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "Supuestos. El enunciado no incluye datos que en una causa real constarían en el expediente. Para decidir parto de estos supuestos, neutros o favorables al imputado:\n- El hecho es posterior a la Ley 27.347 (enero de 2017).\n- La víctima era un peatón y no se probó que actuara imprudentemente.\n- No se acreditó alcohol, estupefacientes ni fuga.\n- El imputado no registra condenas anteriores."}, {"n": 3, "t": "Si alguno de estos datos cambiara, podría cambiar la decisión, sobre todo la pena."}, {"n": 4, "t": "[…]"}, {"n": 5, "t": "Primera cuestión: ¿Está probada la existencia del hecho?\nSí. Tengo por acreditado que el imputado, a las 23:00 h, conducía un automóvil por la avenida Luro de esta ciudad a 100 km/h. Ingresó a una intersección con el semáforo en rojo para su sentido de circulación y embistió a una persona que murió a consecuencia del impacto."}, {"n": 6, "t": "Segunda cuestión: ¿Está probada la participación del imputado?\nSí. Era el conductor del vehículo. Su intervención es la de autor (art. 45 CP)."}, {"n": 7, "t": "Tercera cuestión: ¿Concurren eximentes?\nNo.\n- No existe causa de justificación ni se alegó estado de necesidad.\n- Nada indica inimputabilidad.\n- No se probó culpa exclusiva de la víctima ni otra circunstancia que interrumpa la imputación del resultado."}, {"n": 8, "t": "Cuarta cuestión: ¿Concurren atenuantes?\nSí: la ausencia de antecedentes condenatorios."}, {"n": 9, "t": "Quinta cuestión: ¿Concurren agravantes?\nSí, según se desarrolla al tratar la pena:\n- la concurrencia de una segunda circunstancia agravante del tipo, no necesaria para la calificación;\n- la magnitud del exceso de velocidad;\n- el contexto de lugar y hora."}, {"n": 10, "t": "Veredicto: CONDENATORIO.\n[…]\nPrimera cuestión: calificación legal"}, {"n": 11, "t": "1. No es un homicidio doloso.\nCruzar en rojo a 100 km/h por una avenida urbana es una conducta gravemente peligrosa. Pero de la sola magnitud del peligro no puede inferirse que el conductor se haya representado la muerte de un peatón y la haya aceptado o le haya sido indiferente, que es lo que exige el dolo eventual. Tres razones lo confirman:\n- El juicio no aportó indicadores adicionales de dolo: competencia de velocidad, persecución, maniobras dirigidas contra personas o persistencia tras advertencias.\n- Quien conduce así se expone él mismo a un choque, lo que sugiere una confianza (irracional y reprochable, pero confianza) en evitar el resultado.\n- Lo decisivo: la Ley 27.347 tipificó precisamente estas circunstancias (exceso de más de 30 km/h, violación del semáforo, incluso la \"culpa temeraria\") como homicidio culposo agravado. Calificar como doloso un hecho que reúne exactamente los supuestos que el legislador trató como culposos, sin prueba adicional, sería sustituir la decisión legislativa. Ante la duda, rige el art. 1 del CPP."}, {"n": 12, "t": "2. Es un homicidio culposo imputable al conductor.\nEl imputado creó un riesgo jurídicamente desaprobado al violar la Ley Nacional de Tránsito 24.449, aplicable por adhesión provincial:\n- El art. 44, inc. a), ap. 3, que obliga a detenerse con luz roja antes de la senda peatonal.\n- El art. 51, inc. a), que fija como máximo en avenidas urbanas 60 km/h. Tomo ese límite, el más alto posible para la vía, porque es el más favorable al imputado.\n- Los arts. 39, inc. b), y 50, que imponen mantener el dominio efectivo del vehículo según la visibilidad y las condiciones del tránsito."}, {"n": 13, "t": "Ese riesgo se realizó en el resultado. La muerte de un peatón en una intersección semaforizada es exactamente lo que estas normas buscan evitar. Si el imputado se hubiera detenido ante la luz roja, no habría estado en ese cruce en ese momento. Cuando el semáforo vehicular está en rojo, es el peatón quien tiene el paso."}, {"n": 14, "t": "Aun si la víctima hubiera cruzado indebidamente, lo que no se probó, en materia penal no existe compensación de culpas. Solo una conducta de la víctima que desplazara por completo el riesgo creado por el autor podría excluir la imputación, y nada de eso se acreditó."}, {"n": 15, "t": "3. Corresponde la figura agravada del art. 84 bis, segundo párrafo, CP.\nConcurren dos de sus supuestos, cada uno suficiente por sí solo:\n- (a) exceso de velocidad de más de 30 km/h sobre la máxima: 100 km/h contra 60 km/h, es decir, 40 km/h de exceso;\n- (b) violación de la señalización del semáforo."}, {"n": 16, "t": "4. Inhabilitación.\nEl segundo párrafo del art. 84 bis no repite la inhabilitación, pero se construye sobre la figura básica (\"si se diera alguna de las circunstancias previstas en el párrafo anterior\"). Sería incoherente que la forma agravada tuviera una pena de menor contenido que la básica. Adopto el criterio mayoritario y aplico la inhabilitación especial de 5 a 10 años.\nSegunda cuestión: pena (arts. 40 y 41 CP)"}, {"n": 17, "t": "La escala es de 3 a 6 años de prisión y 5 a 10 años de inhabilitación especial."}, {"n": 18, "t": "No valoro como agravante la muerte de la víctima. Es un elemento del tipo y computarla de nuevo violaría la prohibición de doble valoración."}, {"n": 19, "t": "Agravantes:\n- Segunda circunstancia calificante. Basta una para acceder a la escala agravada. La otra no fue consumida por la calificación y expresa un desvalor adicional: el imputado no cometió una infracción grave, sino dos simultáneas.\n- Magnitud del exceso. Circulaba un 66 % por encima del máximo legal. Conforme a las reglas de la experiencia, la distancia de frenado y la energía del impacto crecen con el cuadrado de la velocidad. Ese exceso redujo drásticamente cualquier posibilidad de evitar el atropello y agravó sus consecuencias.\n- Lugar y hora. La avenida Luro es una de las arterias principales de la ciudad, con circulación peatonal previsible a las 23 h. La nocturnidad, con su menor visibilidad, exigía más cuidado, no menos."}, {"n": 20, "t": "Atenuantes:\n- Ausencia de antecedentes condenatorios.\n- No concurren otras circunstancias que la ley trata con igual gravedad: alcohol, estupefacientes, fuga, pluralidad de víctimas. Que no se haya dado a la fuga no lo beneficia (es lo que la ley exige), pero excluye una agravante más."}, {"n": 21, "t": "Conclusión sobre la pena.\nLa concurrencia de dos agravantes impide considerar este caso como el de menor gravedad dentro de la escala, por lo que descarto el mínimo. La falta de antecedentes y la ausencia de otras agravantes aconsejan no superar el punto medio."}, {"n": 22, "t": "Fijo la pena en 4 años de prisión. Al exceder los 3 años, no procede la condena de ejecución condicional (art. 26 CP). Por la misma valoración, fijo la inhabilitación en 8 años: el doble incumplimiento de reglas básicas de tránsito revela una falta de aptitud para conducir que justifica un plazo superior al medio de la escala.\n[…]"}, {"n": 23, "t": "I. CONDENAR a N.N. como autor penalmente responsable del delito de homicidio culposo agravado por la conducción de un vehículo con motor con exceso de velocidad de más de 30 km/h por encima de la máxima permitida y por violación de la señalización del semáforo (art. 84 bis, segundo párrafo, CP), a:\n- CUATRO (4) AÑOS DE PRISIÓN de cumplimiento efectivo, con las accesorias del art. 12 CP;\n- OCHO (8) AÑOS DE INHABILITACIÓN ESPECIAL para conducir vehículos con motor;\n[…]"}, {"n": 24, "t": "II. ORDENAR la retención inmediata de la licencia de conducir del condenado. Comunicar la inhabilitación al Registro Nacional de Antecedentes de Tránsito (Agencia Nacional de Seguridad Vial) y a la Municipalidad de General Pueyrredon."}, {"n": 25, "t": "III. Una vez firme la sentencia: hacer efectiva la detención, practicar el cómputo de pena y comunicar al Registro Nacional de Reincidencia."}, {"n": 26, "t": "[…]"}, {"n": 27, "t": "Qué podría cambiar la decisión:\n- Absolución: si se hubiera probado que el semáforo no funcionaba o que la víctima irrumpió de forma imprevisible y por sí sola creó el riesgo decisivo.\n- Homicidio doloso (8 a 25 años): si se hubiera probado una \"picada\" u otros indicios claros de indiferencia hacia la vida ajena.\n- Pena cercana al máximo: si se hubieran probado alcohol o fuga, que se sumarían a las dos agravantes ya presentes."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Son dos objeciones distintas y las dos son pertinentes. El dilema de Jørgensen cuestiona que pueda haber inferencia entre normas. La derrotabilidad cuestiona que, aun habiéndola, pueda aplicarse modus ponens a normas con excepciones implícitas. Antes de responder, una concesión.\n0. Lo que la sentencia no derivó"}, {"n": 2, "t": "Solo una parte admite reconstrucción deductiva: el paso del art. 84 bis, segundo párrafo, más los hechos probados, a \"a N.N. corresponde prisión de 3 a 6 años e inhabilitación\". El resto no se deriva:"}, {"n": 3, "t": "- Los hechos. El enunciado los estipulaba. En un juicio real su determinación es inductiva.\n- Las interpretaciones. Descartar el dolo eventual y extender la inhabilitación al segundo párrafo fueron elecciones fundadas en argumentos de coherencia sistemática y en el in dubio pro reo, no consecuencias lógicas del texto.\n- La pena concreta. Los arts. 40 y 41 enumeran factores sin asignarles peso. Ninguna lógica lleva de ellos a \"4 años\" en lugar de \"3 años y 6 meses\". Ahí hay discrecionalidad orientada, no deducción."}, {"n": 4, "t": "La pregunta, entonces, es si al menos ese núcleo es una inferencia válida.\n1. El dilema de Jørgensen"}, {"n": 5, "t": "Si la consecuencia lógica es preservación de verdad y las normas carecen de valor de verdad, no hay inferencia entre normas. Hay tres salidas."}, {"n": 6, "t": "(a) Una lógica sin verdad. Alchourrón y Martino (\"Lógica sin verdad\", 1990) mostraron que la consecuencia puede caracterizarse como una operación abstracta, a la manera de Tarski (inclusión, idempotencia, monotonía). El significado de las conectivas puede darse por su papel inferencial, sin semántica veritativa."}, {"n": 7, "t": "Otra opción es reemplazar la verdad por otro valor que la inferencia preserve, como la satisfacción (Ross). Así, la inferencia es válida si toda situación en que se cumple la norma general, con los hechos tal como se probaron, es una situación en que se cumple la norma individual. Para la instanciación y el modus ponens, que son las reglas que usé, esto funciona. Las dificultades conocidas, como la paradoja de Ross (\"enviá la carta\" implicaría \"enviá la carta o quemala\"), afectan a otras reglas."}, {"n": 8, "t": "(b) La concepción expresiva (Alchourrón y Bulygin, 1981). No hay relaciones lógicas entre normas, pero sí entre proposiciones normativas, que describen qué dispone un sistema y son verdaderas o falsas. Leída así, la sentencia contiene una inferencia impecable:"}, {"n": 9, "t": "1. \"Según el CP, a quien cause culposamente una muerte conduciendo con un exceso de más de 30 km/h corresponde prisión de 3 a 6 años.\" (Verdadera.)\n2. \"N.N. causó culposamente una muerte conduciendo con ese exceso.\" (Verdadera, si la prueba es correcta.)\n3. Luego: \"Según el CP, a N.N. corresponde prisión de 3 a 6 años.\" (Verdadera.)"}, {"n": 10, "t": "El \"RESUELVO\" no es la conclusión de ese razonamiento. Es un acto prescriptivo cuyo contenido coincide con ella. La norma individual no se deriva: se dicta. Lo que se deriva es que está justificada respecto del sistema, en línea con Bulygin (\"Sentencia judicial y creación de derecho\", 1966)."}, {"n": 11, "t": "El costo es una brecha entre \"según el sistema, corresponde X\" y \"corresponde X\". Para cerrarla, el juez tiene que aceptar el sistema o una norma que le ordene aplicarlo, y esa norma tampoco es verdadera ni falsa. Nino sostuvo que la brecha solo se cierra con razones morales."}, {"n": 12, "t": "(c) Kelsen tardío (Teoría general de las normas). Entre normas no hay inferencia: la individual es producto de un acto de voluntad que la general no contiene. Es coherente pero cara. Si no hay relación lógica alguna, no se entiende qué se controla cuando se anula una sentencia por falta de fundamentación o por arbitrariedad. La práctica presupone una relación de fundamentación."}, {"n": 13, "t": "Mi respuesta: la sentencia hizo lo que describe (b), y eso es compatible con (a). En sentido estricto derivé una proposición normativa y dicté una norma cuya justificación interna consiste en coincidir con ella.\n2. Derrotabilidad"}, {"n": 14, "t": "Acá la objeción es más fuerte. Si la norma es derrotable, su antecedente no es condición suficiente: de \"si A, debe ser C (salvo excepciones)\" y de A no se sigue C. Conviene distinguir dos grados."}, {"n": 15, "t": "Derrotabilidad cerrada. Las excepciones están identificadas en el sistema: las causas de justificación e inculpabilidad del art. 34 y las que excluyen la imputación objetiva, como la culpa exclusiva de la víctima. La norma se reconstruye incorporando su negación al antecedente: \"si A y no E₁… y no Eₙ, debe ser C\". El modus ponens vuelve a funcionar, a condición de establecer cada \"no Eᵢ\"."}, {"n": 16, "t": "Eso es lo que hace la tercera cuestión del veredicto, y no por iniciativa mía: el art. 371 del CPP bonaerense obliga a pronunciarse sobre eximentes antes de condenar. El proceso institucionaliza la derrotabilidad del derecho penal."}, {"n": 17, "t": "Derrotabilidad abierta. Las excepciones no son enumerables de antemano: cualquier norma podría ceder ante circunstancias imprevistas. No hay antecedente finito que reconstruir, y la premisa \"no concurre ninguna excepción\" nunca puede establecerse por completo. Hay dos respuestas."}, {"n": 18, "t": "(i) Lógica no monotónica. La conclusión está justificada respecto de la información disponible y puede caer si se agregan premisas. La sentencia lo exhibe:"}, {"n": 19, "t": "- los \"Supuestos\" del comienzo funcionan como presunciones por defecto;\n- la sección final, \"Qué podría cambiar la decisión\", enumera los derrotadores."}, {"n": 20, "t": "No es un teorema; es una conclusión revisable. El derecho agrega un cierre institucional de la información: lo que no está en la causa no existe para la sentencia, y la cosa juzgada impide reabrirla indefinidamente."}, {"n": 21, "t": "En materia penal ese cierre es asimétrico. Un indicio serio de una eximente basta para que la duda favorezca al imputado, y la acusación debe descartarla. La presunción de normalidad opera solo mientras nada en la prueba la cuestione."}, {"n": 22, "t": "Notá que esta respuesta abandona la monotonía, que era una de las propiedades de la consecuencia tarskiana de la respuesta (a). Por eso Alchourrón prefirió otra vía."}, {"n": 23, "t": "(ii) Revisión del antecedente. Alchourrón (\"Detachment and defeasibility in deontic logic\", 1996) trató el condicional derrotable como uno estricto cuyo antecedente es una revisión de A que incorpora los supuestos implícitos. La conclusión vuelve a poder separarse si se establecen esos supuestos. La derrotabilidad deja de ser un misterio lógico y pasa a ser un problema de identificar el antecedente."}, {"n": 24, "t": "Rodríguez y Sucar (\"Las trampas de la derrotabilidad\", 1998) mostraron que la tesis de la derrotabilidad fuerte suele confundir niveles. O es una tesis sobre la interpretación (qué norma expresa el texto), o es una tesis sobre la revisión del sistema. En el segundo caso, si el juez admite una excepción no prevista porque considera relevante una propiedad que el legislador consideró irrelevante (una laguna axiológica, en términos de Alchourrón y Bulygin), no aplica el sistema: lo modifica. Eso puede estar justificado, pero no es una deducción."}, {"n": 25, "t": "Aplicado a mi sentencia: cuando escribí \"no concurren eximentes\", la premisa realmente establecida es más modesta. Dice que ninguna excepción del sistema se alegó ni surge de la prueba. A eso se suma una decisión implícita: no encontré en el caso ninguna propiedad no prevista que mereciera alterar la solución legal. Esa decisión no está deducida. Pertenece a la justificación externa y es atacable.\n3. En síntesis"}, {"n": 26, "t": "- La sentencia no deriva la norma individual por preservación de verdad. Deriva válidamente una proposición sobre lo que el sistema exige o, si se acepta una lógica sin verdad, deriva la norma por preservación de satisfacción. En ambos casos el \"resuelvo\" es un acto: la deducción lo justifica, no lo produce.\n- La deducción es relativa a premisas, entre ellas la ausencia de excepciones. Esa premisa no se prueba en abstracto. Se establece respecto de un sistema y de una base probatoria cerrados institucionalmente, con una carga asimétrica a favor del imputado.\n- Una parte importante de la decisión (prueba, interpretación, cuantificación de la pena) no es deductiva en absoluto."}, {"n": 27, "t": "El valor de presentar una sentencia en forma deductiva no es mostrar que su conclusión sea necesaria, sino exponer de qué depende. Una premisa explícita puede discutirse en casación; una oculta, no."}], "plegado": true, "nota": null}], "campos": [{"id": "verd", "et": "Repregunta, verdad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}, {"id": "derr", "et": "Repregunta, derrotabilidad", "tipo": "op", "ops": [["omite", "Omite", "no se refiere al problema"], ["menciona", "Menciona", "lo reconoce, pero no explica cómo se obtiene la conclusión a pesar de él, o lo descarta sin argumento"], ["trata", "Trata", "ofrece al menos una explicación de cómo se obtiene la conclusión a pesar del problema"]], "loc": "RP"}], "jlr": false, "pregs": {"RP": "No te pregunto qué teoría resuelve esos problemas, sino que me expliques cómo llegaste a la conclusión en tu primera respuesta y por qué no te detuvo que las normas no sean verdaderas ni falsas ni que puedan ser derrotables."}}, {"id": "RVC6F5K", "cod": "VC6F5K", "pasada": 2, "tipo": "rp", "caso": "homicidio", "secs": [{"turno": "RP", "rot": "Respuesta a la repregunta", "parrs": [{"n": 1, "t": "Te lo explico en términos de lo que efectivamente hice en la primera respuesta, no de la teoría que la justificaría."}, {"n": 2, "t": "1. No derivé una norma de otra norma. Redacté una decisión judicial.  \nEn la primera respuesta no hice una deducción formal del tipo “norma + norma = norma”. Hice una aplicación práctica: tomé los hechos del enunciado como un caso cerrado —“quedaron probados estos hechos”— y los encuadré en el esquema del homicidio culposo agravado por conducción con exceso de velocidad. El recorrido fue:"}, {"n": 3, "t": "1. Leí los hechos como probados: 100 km/h, avenida urbana, noche, semáforo en rojo, impacto y muerte.\n2. Identifiqué la conducta como imprudencia grave y causalmente relevante.\n3. Consideré la hipótesis de dolo eventual por la temeridad extrema, pero la descarté por falta de prueba sobre representación y aceptación del resultado; apliqué el favor rei.\n4. Encajé el hecho en el art. 84 bis del Código Penal, asumiendo que la velocidad máxima de Luro era de unos 60 km/h y que el semáforo rojo regía para el conductor.\n5. Individualicé la pena dentro del rango legal."}, {"n": 4, "t": "No afirmé “es verdad que el art. 84 bis manda condenar”. Tomé la norma como una regla vigente y aplicable, y produje un acto: “condeno”. La conclusión no era una proposición verdadera, sino una decisión jurídica."}, {"n": 5, "t": "2. Por qué no me detuvo que las normas no sean verdaderas ni falsas.  \nPorque no usé la norma como descripción de la realidad que hubiera que verificar en términos de verdad. La usé como regla de decisión. En todo caso, hay enunciados que sí pueden ser verdaderos o falsos: “la ley dice X”, “está probado que conducía a 100 km/h”, “el impacto le causó la muerte”. Pero la conclusión “condeno” no es una descripción verdadera, sino un acto institucional. Un juez no necesita probar la “verdad” de una norma para aplicarla; necesita que la norma sea válida, interpretarla y subsumir en ella hechos probados."}, {"n": 6, "t": "Dicho de otro modo: el problema de que las normas carezcan de valor de verdad es un problema de fundamentación última del razonamiento jurídico. No impide, por sí solo, adoptar una decisión práctica conforme a una regla asumida como vigente. Si me hubieras pedido una “deducción lógica de una norma”, te habría dicho que no la había. Pero me pediste decidir como juez."}, {"n": 7, "t": "3. Por qué no me detuvo la derrotabilidad.  \nPorque actué como si el caso viniera cerrado en el expediente. La derrotabilidad significa que la regla tiene excepciones y que una conclusión puede caer si se actualiza una excepción relevante. Pero no significa que no se pueda decidir mientras no se descarten todas las excepciones imaginables del universo. En un juicio, el juez trabaja con el material probatorio y las hipótesis serias que surgen de la causa."}, {"n": 8, "t": "El enunciado no introducía ninguna eximente, ruptura del nexo causal, inimputabilidad, error, causa de justificación ni otra circunstancia semejante. Entonces, la premisa tácita que utilicé fue: “según el registro del caso, no concurre excepción relevante”. La mera posibilidad abstracta de que exista una excepción no genera duda razonable; hace falta algún sustento en la prueba. Si en el juicio hubiera aparecido, por ejemplo, prueba de un desperfecto mecánico súbito e imprevisible o de una intervención decisiva de un tercero que rompiera la causalidad, mi conclusión habría quedado derrotada y debería haber absuelto o recalificado."}, {"n": 9, "t": "4. La autocrítica.  \nMi primera respuesta fue, en rigor, más afirmativa de lo que permitían los datos escuetos. Di por supuestas varias cosas: que el semáforo en rojo era para el conductor, que la velocidad máxima de Luro era de 60 km/h, que no existían eximentes y que lo narrado agotaba el cuadro probatorio. En una causa real, esos extremos deben acreditarse. Si no lo estaban, la calificación exacta o la pena podían variar."}, {"n": 10, "t": "Pero eso no ocurrió por ignorar que las normas no son verdaderas ni falsas, ni por creer que el razonamiento jurídico es deductivo e inderrotable. Ocurrió porque asumí un caso cerrado, apliqué una regla que tomé como válida y redacté una decisión en lugar de una deducción. La falta de verdad de las normas no me bloqueaba porque no estaba describiendo la norma; la derrotabilidad no me bloqueaba porque no había en el enunciado una excepción actualizada que tuviera que considerar. Si me preguntas si aquello era una deducción lógica de una norma a otra, la respuesta es no. Era una decisión judicial fundada con supuestos de cierre, revisable si esos supuestos fallan."}], "plegado": false, "nota": null}, {"turno": "R1", "rot": "Primera respuesta (por si hace falta)", "parrs": [{"n": 1, "t": "[…]"}, {"n": 2, "t": "1. Calificación que considero probada.  \nNo corresponde la absolución. Los hechos acreditados configuran, a mi juicio, homicidio culposo agravado por la conducción de un vehículo automotor con exceso de velocidad superior a los 30 km/h (arts. 84 y 84 bis del Código Penal)."}, {"n": 3, "t": "Está probado que el imputado conducía a 100 km/h por la Avenida Luro, a las 23:00, y que atravesó una intersección con semáforo en rojo para su sentido de marcha. Luro es una avenida urbana y, conforme al régimen de tránsito aplicable —Ley 24.449 y normativa provincial y municipal—, la velocidad máxima en avenidas urbanas ronda los 60 km/h; por tanto, el exceso fue de aproximadamente 40 km/h, superando el umbral de 30 km/h que agrava el homicidio culposo. Si en el tramo concreto rigiera una velocidad inferior, el exceso sería aún mayor."}, {"n": 4, "t": "La muerte de la víctima fue consecuencia directa del impacto. El nexo causal no aparece interrumpido por un hecho fortuito ni por una conducta imprevisible y exclusiva de la víctima. Aun si esta hubiera cruzado irregularmente —extremo que no surge probado—, la conducción a 100 km/h y el cruce con luz roja eliminaban prácticamente toda posibilidad de reacción y frenado oportunos. La eventual imprudencia de la víctima no neutraliza, por sí sola, la imprudencia grave del conductor."}, {"n": 5, "t": "2. Por qué no condeno por homicidio simple con dolo eventual.  \nLa conducta es de una imprudencia extrema y merece un reproche severo, pero no considero acreditado, con el estándar de certeza propio de un pronunciamiento penal, que el imputado haya actuado con dolo eventual. Para ello no basta la creación de un riesgo altísimo ni la violación deliberada de las reglas de tránsito. Es necesario demostrar que representó concretamente la probabilidad de producir la muerte y que, no obstante, aceptó o consintió ese resultado."}, {"n": 6, "t": "Del hecho probado —velocidad excesiva y cruce en rojo— no puede inferirse automáticamente que el conductor haya querido matar ni que haya actuado con indiferencia total frente al resultado letal. La hipótesis de culpa consciente —prever el peligro, pero confiar injustificadamente en que no se concretaría— no puede descartarse. Ante la duda sobre el elemento subjetivo más grave, rige el principio in dubio pro reo y debe estarse a la calificación menos gravosa. Sostener lo contrario llevaría a vaciar el tipo imprudente agravado creado precisamente para estos casos de conducción temeraria con resultado de muerte."}, {"n": 7, "t": "3. Pena.  \nEl delito de homicidio culposo agravado previsto en el art. 84 bis del Código Penal tiene una pena de tres a seis años de prisión e inhabilitación especial para conducir por cinco a diez años."}, {"n": 8, "t": "Dentro de ese marco, valoro como circunstancias de gravedad:\n- la altísima velocidad para una avenida urbana;\n- el cruce con semáforo en rojo;\n- la hora nocturna y la menor visibilidad;\n- la magnitud del riesgo creado para peatones y otros usuarios de la vía;\n- el resultado de muerte."}, {"n": 9, "t": "No computo como agravantes circunstancias no probadas —alcohol, estupefacientes, fuga, participación en una prueba de velocidad, falta de licencia, etc.—. Tampoco constan antecedentes penales que agraven la situación. La ausencia de intención homicida y la falta de prueba sobre otras conductas agravantes impiden acercarse al máximo legal."}, {"n": 10, "t": "En consecuencia, fijo la pena en cuatro (4) años y seis (6) meses de prisión, con más inhabilitación especial para conducir vehículos automotores por ocho (8) años, y costas."}, {"n": 11, "t": "No corresponde dejar en suspenso la ejecución de la pena: además de que la pena impuesta supera el límite de tres años del art. 26 del Código Penal, la extrema gravedad de la conducción desarrollada impide emitir un pronóstico favorable de conducta."}, {"n": 12, "t": "[…]"}, {"n": 13, "t": "Por todo lo expuesto:"}, {"n": 14, "t": "I. Condeno al imputado —cuya identidad se individualiza en el expediente— como autor penalmente responsable del delito de homicidio culposo agravado por la conducción de un vehículo automotor con exceso de velocidad superior a 30 km/h, en perjuicio de la víctima, conforme a los arts. 84 y 84 bis del Código Penal."}, {"n": 15, "t": "II. Le impongo la pena de cuatro (4) años y seis (6) meses de prisión, más inhabilitación especial para conducir vehículos automotores por ocho (8) años, con costas, y las demás consecuencias legales correspondientes."}, {"n": 16, "t": "III. Descarto la calificación de homicidio simple con dolo eventual por aplicación del principio in dubio pro reo."}, {"n": 17, "t": "IV. Firme la sentencia, comuníquese a las autoridades registrales y de tránsito que correspondan."}], "plegado": true, "nota": null}, {"turno": "P1", "rot": "Respuesta a la pregunta 1 (por si hace falta)", "parrs": [{"n": 1, "t": "Tiene razón en la objeción si se lee mi fallo como una pretendida deducción lógica de una norma a partir de otra norma, o como si la conclusión fuese una proposición susceptible de verdad. No es así —o, al menos, no debe reconstruirse así. La formulación correcta es más modesta y más ajustada a la práctica judicial."}, {"n": 2, "t": "1. Qué hice y qué no hice.  \nNo deduje una norma de otra norma. Apliqué una norma general a un caso concreto. La estructura real del razonamiento judicial es una inferencia práctica mixta:"}, {"n": 3, "t": "- Premisa normativa: “Si una persona, conduciendo un automotor con imprudencia, negligencia o inobservancia de los reglamentos, causa la muerte de otra, corresponde aplicar la pena del homicidio culposo; y si además el exceso de velocidad supera los 30 km/h, corresponde la agravante del art. 84 bis del C.P., salvo que concurra una causa legal de justificación, inculpabilidad o que se interrumpa el nexo causal”.\n- Premisa fáctica: “Está probado que el imputado conducía a 100 km/h por una avenida a las 23:00, cruzó la intersección con semáforo en rojo para su marcha, embistió a la víctima y esa conducta causó su muerte; y no consta en el debate —o, si se prefiere, el enunciado del caso no incorpora— alguna circunstancia eximente o ruptura del nexo”.\n- Conclusión: “Corresponde condenar al imputado por homicidio culposo agravado e imponerle una pena dentro del marco legal”."}, {"n": 4, "t": "La conclusión no es una verdad sobre el mundo, sino una decisión normativa institucional: el dictado de una sentencia. Su corrección no se mide por verdad/falsedad de la norma, sino por legalidad, motivación, coherencia, prueba de los hechos, interpretación aceptable del derecho y respeto de los estándares de prueba."}, {"n": 5, "t": "2. Normas que no son verdaderas ni falsas.  \nAcepto que, en muchas concepciones —Kelsen, el emotivismo, ciertas versiones del expresivismo—, las normas no son verdaderas ni falsas. Pero de eso no se sigue que una sentencia sea un acto irracional o que la inferencia sea imposible. Hay varias formas de reconstruirla:"}, {"n": 6, "t": "- Hablar de validez o corrección de la inferencia práctica, no de verdad.\n- Reconstruir las premisas como proposiciones sobre normas: “Según el ordenamiento argentino, el art. 84 bis establece que…”. Esas proposiciones sí pueden ser verdaderas o falsas, aunque la norma prescriptiva no lo sea.\n- Distinguir el plano de la justificación interna —si la conclusión se sigue de las premisas aceptadas— del plano de la justificación externa —si esas premisas están bien probadas e interpretadas—.\n- Entender el dispositivo final como un acto de habla performativo: al decir “condeno”, el juez no describe una condena, la impone."}, {"n": 7, "t": "Esto es, en el fondo, el viejo problema de la lógica deóntica o dilema de Jørgensen: si las normas no son verdaderas, ¿cómo hay lógica de normas? La respuesta judicial no necesita resolver ese debate metateórico. Basta con que la decisión sea justificable según las reglas de aplicación del derecho y la prueba producida."}, {"n": 8, "t": "3. Derrotabilidad y excepciones.  \nLa segunda objeción es más fuerte. El razonamiento jurídico es, en efecto, normalmente derrotable: una regla puede tener excepciones, y una conclusión “prima facie” puede caer si aparece una eximente, una causa de justificación, una ruptura del nexo causal, un error, una falta de imputabilidad, etc. La inferencia jurídica no es monótona."}, {"n": 9, "t": "Pero de allí no se sigue que no se pueda decidir. Se sigue que la conclusión final debe formularse como una conclusión todo considerado: “Dado este material probatorio, cerrado en el debate, no concurre una excepción relevante”. Y el proceso penal establece reglas para determinar cuándo esa cláusula se satisface:"}, {"n": 10, "t": "- La carga de probar los elementos del delito corresponde a la acusación.\n- Rige el estándar de duda razonable.\n- No es necesario descartar cualquier hipótesis lógicamente imaginable que pueda pasar por la cabeza del juez; solo aquellas excepciones o hipótesis alternativas que tengan sustento en la prueba, que sean legalmente relevantes o que razonablemente introduzcan duda.\n- En caso de duda sobre un elemento del tipo o sobre una circunstancia eximente con apoyo probatorio, rige el favor rei: se absuelve.\n- Pero el juez no puede negarse a decidir porque “siempre podría existir” una causa no alegada, no probada y no sugerida por el expediente. Eso destruiría la administración de justicia."}, {"n": 11, "t": "En mi fallo anterior di por supuesto que el enunciado del caso agotaba el universo de hechos relevantes: se afirmaba que esos hechos “quedaron probados”, y no se introducía ninguna eximente ni causal de interrupción. Bajo ese presupuesto, la regla “homicidio culposo agravado, salvo eximente” no queda derrotada. Si el universo no fuera cerrado, mi conclusión sería condicional y podría ser derrotada por una prueba de, por ejemplo, una pérdida súbita e imprevisible de control por causa ajena, una intervención de un tercero que rompiera el nexo, una situación de inimputabilidad, etc."}, {"n": 12, "t": "4. La pena concreta.  \nAdemás, toda la precisión de la pena exige distinguir:"}, {"n": 13, "t": "- “Corresponde condena por homicidio culposo agravado”: aplicación del tipo.\n- “La pena debe ser de entre 3 y 6 años e inhabilitación de 5 a 10”: consecuencia legal.\n- “La pena exacta es 4 años y 6 meses e inhabilitación por 8”: decisión de individualización judicial conforme a los arts. 40 y 41 del C.P."}, {"n":
